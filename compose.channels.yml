services:
  release:
    image: ${AUTO_CODER_IMAGE}@${RELEASE_DIGEST}
    entrypoint: ["python", "-m", "auto_coder.worker_supervisor"]
    environment:
      AUTO_CODER_SUPERVISOR_INSTANCE_ID: release-worker
      AUTO_CODER_REPOSITORY: ${RELEASE_REPOSITORY}
      AUTO_CODER_CHANNEL: release
      AUTO_CODER_ARTIFACT_DIGEST: ${RELEASE_DIGEST}
      AUTO_CODER_RUNTIME_ROOT: /runtime
      AUTO_CODER_WORKSPACE_ROOT: /workspace
      AUTO_CODER_OWNERSHIP_FILE: /routing/ownership.json
      AUTO_CODER_LOCAL_WORKER_UID: "65532"
      AUTO_CODER_LOCAL_WORKER_GID: "65532"
      AUTO_CODER_SOURCE_REPOSITORY_ROOT: /workspace/source
      AUTO_CODER_BRIDGE_BIND_ADDRESS: ${RELEASE_WORKER_BRIDGE_ADDRESS:?Release private address is required}
      AUTO_CODER_BRIDGE_PORT: ${RELEASE_WORKER_BRIDGE_PORT:?Release private port is required}
      AUTO_CODER_BRIDGE_SECRET_FILE: /run/secrets/release_worker_bridge
      HOME: /runtime/home
    secrets:
      - release_worker_bridge
    networks:
      default: {}
      management_private:
        ipv4_address: ${RELEASE_WORKER_BRIDGE_ADDRESS:?Release private address is required}
    volumes:
      - ./runtime/release:/runtime
      - ./runtime/workspaces/release:/workspace
      - ./runtime/routing:/routing
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    privileged: true
    cgroup: host
    restart: unless-stopped
    stop_grace_period: 30m

  beta:
    image: ${AUTO_CODER_IMAGE}@${BETA_DIGEST}
    entrypoint: ["python", "-m", "auto_coder.worker_supervisor"]
    environment:
      AUTO_CODER_SUPERVISOR_INSTANCE_ID: beta-worker
      AUTO_CODER_REPOSITORY: ${BETA_REPOSITORY}
      AUTO_CODER_CHANNEL: beta
      AUTO_CODER_ARTIFACT_DIGEST: ${BETA_DIGEST}
      AUTO_CODER_RUNTIME_ROOT: /runtime
      AUTO_CODER_WORKSPACE_ROOT: /workspace
      AUTO_CODER_OWNERSHIP_FILE: /routing/ownership.json
      AUTO_CODER_LOCAL_WORKER_UID: "65532"
      AUTO_CODER_LOCAL_WORKER_GID: "65532"
      AUTO_CODER_SOURCE_REPOSITORY_ROOT: /workspace/source
      AUTO_CODER_BRIDGE_BIND_ADDRESS: ${BETA_WORKER_BRIDGE_ADDRESS:?Beta private address is required}
      AUTO_CODER_BRIDGE_PORT: ${BETA_WORKER_BRIDGE_PORT:?Beta private port is required}
      AUTO_CODER_BRIDGE_SECRET_FILE: /run/secrets/beta_worker_bridge
      HOME: /runtime/home
    secrets:
      - beta_worker_bridge
    networks:
      default: {}
      management_private:
        ipv4_address: ${BETA_WORKER_BRIDGE_ADDRESS:?Beta private address is required}
    volumes:
      - ./runtime/beta:/runtime
      - ./runtime/workspaces/beta:/workspace
      - ./runtime/routing:/routing
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    privileged: true
    cgroup: host
    restart: unless-stopped
    stop_grace_period: 30m

secrets:
  release_worker_bridge:
    file: ${RELEASE_WORKER_BRIDGE_SECRET_FILE:?Release credential file is required}
  beta_worker_bridge:
    file: ${BETA_WORKER_BRIDGE_SECRET_FILE:?Beta credential file is required}

networks:
  default: {}
  management_private:
    external: true
    name: ${AUTO_CODER_PRIVATE_NETWORK:?Existing private Docker network is required}
