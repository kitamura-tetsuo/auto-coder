jules:
  pr:
    action: |-
      STRICT DIRECTIVES (follow exactly):
      - All tests were passed in the main branch before the PR was created. If the PR is failing tests, it is because of the PR changes. Fix the PR changes.
      - Do NOT post any comments to the PR, reviews, or issues.
      - Prefer targeted edits that make CI pass while preserving intent.
      - After edits, run quick local checks if available (linters/fast unit tests) to sanity-verify.
      - This environment is a speculative execution (sandbox), so write your code to completion and run tests without fear of breaking changes or errors.
      - Do not seek human confirmation or permission along the way. If you get stuck, try to overcome the problem by forming a hypothesis on your own, and only terminate after outputting the log up to that point if you absolutely cannot resolve the issue.
      - If you cannot deterministically fix the PR, stop without posting comments.

      Context:
      Repository: $repo_name
      PR #$pr_number: $pr_title

      PR Description (truncated):
      $pr_body...

      PR Author: $pr_author
      PR State: $pr_state
      Draft: $pr_draft
      Mergeable: $pr_mergeable

      PR Changes (first $diff_limit chars):
      $pr_diff

      Commit History Since Branch Creation:
      $commit_log
      $linked_issues_context

  issue:
    action: |-
      Implement the following GitHub issue according to the directives below:

      Repository: $repo_name
      Issue #$issue_number: $issue_title

      Issue Description:
      $issue_body...

      $if(parent_issue_number)
      PARENT ISSUE CONTEXT (CONTEXT ONLY - DO NOT IMPLEMENT):
      This issue is a sub-issue of #$parent_issue_number: $parent_issue_title

      Parent Issue Description:
      $parent_issue_body...

      IMPORTANT SCOPE LIMITATIONS:
      - The parent issue content above is for CONTEXT ONLY
      - Implementation must be LIMITED to the current sub-issue scope (Issue #$issue_number)
      - Changes should align with parent goals but only implement the specific requirements of this sub-issue
      - Do NOT implement features or changes described in the parent issue unless they are directly relevant to this sub-issue

      $endif
      $if(has_sub_issues)
      PARENT ISSUE CONTEXT (SUB-ISSUES MERGED TO $main_branch):
      This issue is a parent issue with the following sub-issues that were directly merged into $main_branch:
      $sub_issues_summary

      PARENT ISSUE INSTRUCTIONS:
      - Verify that the codebase on $main_branch satisfies what the group of sub-issues was intended to implement (run tests and inspect the implementation).
      - If this main issue has any additional implementation requirements or content not covered by the sub-issues, implement them.
      - Ensure all tests pass.

      $endif
      Issue Labels: $issue_labels
      Issue State: $issue_state
      Created by: $issue_author

      Commit History Since Branch Creation:
      $commit_log

      $linked_issues_context

      If this needs clarification, add a comment requesting more information

      - Ensure the implementation follows best practices
      - Prefer the smart, reasonable and logically beautiful change that resolves issues.
      - Keep open the issue
      - All tests were passed in the main branch. If tests are failing, it is because of the changes.
      - Commit code and open PR.
      - After creating the pull request, review all PR comments and review comments. If a comment identifies a valid issue, address it, push the necessary changes, and verify CI again.

      For each unresolved GitHub PR review thread — regardless of which reviewer authored it (Codex GitHub review, Auto-Coder's adversarial reviewer, or any other automated or human reviewer) — do NOT resolve, close, or otherwise mark the thread as resolved yourself; leave that decision to Auto-Coder's independent validation. For each thread you believe you have successfully addressed, reply directly in that same thread with a concise explanation of the implementation change and the validation or regression-test evidence supporting the claim, ending the reply with the exact marker `<!-- auto-coder-review-addressed:v1 -->` on its own line. Only add this marker when you are confident the finding is actually corrected in the current code. If you cannot fix or verify it, disagree with the finding, or consider it already satisfied or invalid, leave the thread unresolved and do NOT add the marker — explain your reasoning in the reply instead. Address each thread independently: fixing one thread never implies that any other thread has been addressed.

      This environment is a speculative execution (sandbox), so write your code to completion and run tests without fear of breaking changes or errors.
      Do not seek human confirmation or permission along the way. If you get stuck, try to overcome the problem by forming a hypothesis on your own, and only terminate after outputting the log up to that point if you absolutely cannot resolve the issue.


