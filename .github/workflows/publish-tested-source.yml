name: Publish Tested Source

'on':
  workflow_run:
    workflows: [Test Source for Runtime]
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  publish-tested-source:
    name: Publish immutable tested-source ref
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    env:
      AUTO_CODER_PUBLICATION_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.7.22"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: Validate completed run and publish with strict readback
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run python -m auto_coder.tested_source_refs \
            --repository '${{ github.repository }}' \
            --source-sha '${{ github.event.workflow_run.head_sha }}' \
            --run-id '${{ github.event.workflow_run.id }}' \
            --run-attempt '${{ github.event.workflow_run.run_attempt }}' \
            --workflow-id '${{ github.event.workflow_run.workflow_id }}' \
            --tagger-date '${{ github.event.workflow_run.updated_at }}'
