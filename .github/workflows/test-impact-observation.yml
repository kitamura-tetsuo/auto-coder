name: Test Impact Observation (Advisory)

'on':
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Git SHA, tag or branch to actually check out and measure"
        required: true
        type: string
      baseline_run_id:
        description: "Optional exact successful test-impact baseline workflow run ID"
        required: false
        type: string
      baseline_run_attempt:
        description: "Optional exact successful baseline workflow run attempt"
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  observe:
    name: Full Python test-impact diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout explicitly requested source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.7.22"

      - name: Sync locked test dependencies
        run: uv sync --locked --extra test --dev

      - name: Prepare isolated invocation
        id: prepare
        run: |
          invocation_id="$(uv run python -c 'import uuid; print(uuid.uuid4())')"
          invocation_dir="${RUNNER_TEMP}/test-impact/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/${invocation_id}"
          mkdir -p "$invocation_dir"
          echo "invocation_id=$invocation_id" >> "$GITHUB_OUTPUT"
          echo "invocation_dir=$invocation_dir" >> "$GITHUB_OUTPUT"

      - name: Observe the entire ordinary PR pytest profile
        id: native
        timeout-minutes: 130
        env:
          IMPACT_DIRECTORY: ${{ steps.prepare.outputs.invocation_dir }}
          REQUESTED_SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          uv run python scripts/run_test_impact_observation.py \
            --directory "$IMPACT_DIRECTORY" \
            --repository "$GITHUB_REPOSITORY" \
            --source-ref "$REQUESTED_SOURCE_REF"

      - name: Normalize independent diagnostic result
        if: always() && steps.prepare.outputs.invocation_dir != ''
        env:
          IMPACT_DIRECTORY: ${{ steps.prepare.outputs.invocation_dir }}
        run: |
          uv run python -m scripts.summarize_test_impact \
            --directory "$IMPACT_DIRECTORY" \
            --checkout "$GITHUB_WORKSPACE" \
            --output "$IMPACT_DIRECTORY/observation.json"

      - name: Verify exact successful baseline attempt before retrieval
        id: baseline_provenance
        if: ${{ always() && inputs.baseline_run_id != '' && inputs.baseline_run_attempt != '' && steps.prepare.outputs.invocation_dir != '' }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASELINE_RUN_ID: ${{ inputs.baseline_run_id }}
          BASELINE_RUN_ATTEMPT: ${{ inputs.baseline_run_attempt }}
        run: |
          uv run python -c 'import os; from scripts.report_test_impact import _verify_remote_attempt; _verify_remote_attempt(os.environ["GITHUB_REPOSITORY"], int(os.environ["BASELINE_RUN_ID"]), int(os.environ["BASELINE_RUN_ATTEMPT"]), os.environ["GITHUB_TOKEN"])'

      - name: Download exact baseline run and attempt evidence
        if: ${{ always() && steps.baseline_provenance.outcome == 'success' }}
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          repository: ${{ github.repository }}
          run-id: ${{ inputs.baseline_run_id }}
          pattern: test-impact-${{ inputs.baseline_run_id }}-${{ inputs.baseline_run_attempt }}-*
          merge-multiple: false
          path: ${{ runner.temp }}/test-impact-baseline
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compare baseline candidates after the full native run
        if: ${{ always() && (inputs.baseline_run_id != '' || inputs.baseline_run_attempt != '') && steps.prepare.outputs.invocation_dir != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMPACT_DIRECTORY: ${{ steps.prepare.outputs.invocation_dir }}
          BASELINE_RUN_ID: ${{ inputs.baseline_run_id }}
          BASELINE_RUN_ATTEMPT: ${{ inputs.baseline_run_attempt }}
        run: |
          uv run python -m scripts.report_test_impact \
            --baseline-directory "${RUNNER_TEMP}/test-impact-baseline" \
            --baseline-run-id "${BASELINE_RUN_ID:-0}" \
            --baseline-run-attempt "${BASELINE_RUN_ATTEMPT:-0}" \
            --verify-baseline-run \
            --repository "$GITHUB_REPOSITORY" \
            --current "$IMPACT_DIRECTORY/observation.json" \
            --repository-dir "$GITHUB_WORKSPACE" \
            --output "$IMPACT_DIRECTORY/shadow-report.json" \
            --summary "$IMPACT_DIRECTORY/shadow-report.md"

      - name: Show independent retrospective summary
        if: always() && steps.prepare.outputs.invocation_dir != ''
        env:
          IMPACT_DIRECTORY: ${{ steps.prepare.outputs.invocation_dir }}
        run: |
          if [ -s "$IMPACT_DIRECTORY/shadow-report.md" ]; then
            cat "$IMPACT_DIRECTORY/shadow-report.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload partial or finalized invocation evidence
        if: always() && steps.prepare.outputs.invocation_dir != ''
        uses: actions/upload-artifact@v7
        with:
          name: test-impact-${{ github.run_id }}-${{ github.run_attempt }}-${{ steps.prepare.outputs.invocation_id }}
          path: ${{ steps.prepare.outputs.invocation_dir }}/
          if-no-files-found: warn
          retention-days: 14
