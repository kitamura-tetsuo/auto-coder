name: PR Tests

'on':
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Install dependencies
        run: |
          uv sync --dev
      - name: Check repository hygiene
        run: scripts/check_repository_hygiene.py --source head --repo .
      - name: Black (check)
        run: uv run black --check src/ tests/
      - name: isort (check)
        run: uv run isort --check-only src/ tests/
      - name: Flake8
        run: uv run flake8 src/ tests/
      # - name: Mypy
      #   run: uv run mypy src/

  tests-shard:
    name: Tests with Coverage (${{ matrix.group }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Sync dependencies with uv
        run: |
          uv sync --dev --extra test

      - name: Install package in development mode
        run: |
          # Install package with console scripts to make auto-coder command available
          uv pip install -e .

      - name: Test CLI entry point
        if: matrix.group == 1
        run: |
          # Run auto-coder --help and verify it exits successfully
          set -e
          # Add .venv/bin to PATH to access installed console scripts
          export PATH="$PWD/.venv/bin:$PATH"
          OUTPUT=$(auto-coder --help 2>&1)
          echo "$OUTPUT"
          # Check for expected help content
          if ! echo "$OUTPUT" | grep -q "Usage:"; then
            echo "Error: Help output does not contain 'Usage:'"
            exit 1
          fi
          if ! echo "$OUTPUT" | grep -q "Auto-Coder"; then
            echo "Error: Help output does not contain 'Auto-Coder'"
            exit 1
          fi
          echo "CLI entry point test passed!"

      - name: Run tests with coverage (shard ${{ matrix.group }}/4)
        timeout-minutes: 8
        run: |
          uv run python scripts/run_pr_test_shard.py \
            --group ${{ matrix.group }} \
            --attempt-timeout 180 \
            --termination-grace 10 \
            --max-attempts 2 \
            --log-dir pr-test-logs/shard-${{ matrix.group }}

      - name: Upload shard diagnostics
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pr-test-diagnostics-${{ matrix.group }}-${{ github.run_attempt }}
          path: pr-test-logs/shard-${{ matrix.group }}/
          if-no-files-found: ignore

      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report-${{ matrix.group }}-${{ github.run_attempt }}
          path: htmlcov/
          if-no-files-found: ignore

  tests:
    name: Tests with Coverage
    needs: tests-shard
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check shard results
        run: |
          if [ "${{ needs.tests-shard.result }}" != "success" ]; then
            echo "One or more test shards failed (result: ${{ needs.tests-shard.result }})."
            exit 1
          fi
          echo "All test shards passed."
