name: Management Recovery Epoch Acceptance

'on':
  pull_request:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  acceptance-plan:
    name: Select the complete native recovery acceptance matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      scenarios: ${{ steps.scenarios.outputs.scenarios }}
    steps:
      - name: Checkout exact reviewed source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.7.22"
      - name: Install locked test dependencies
        run: uv sync --locked --dev --extra test
      - name: Select every independent production scenario
        id: scenarios
        run: |
          .venv/bin/python -B - <<'PY'
          import json
          import os
          from scripts.test_management_recovery_epoch_host import ACCEPTANCE_SCENARIOS, required_cases

          assert len(ACCEPTANCE_SCENARIOS) == len(set(ACCEPTANCE_SCENARIOS))
          assert all(required_cases(scenario) for scenario in ACCEPTANCE_SCENARIOS)
          with open(os.environ["GITHUB_OUTPUT"], "a") as stream:
              stream.write("scenarios=" + json.dumps(ACCEPTANCE_SCENARIOS) + "\n")
          PY
  recovery-epoch:
    name: Recovery epoch (${{ matrix.scenario }}) in isolated VM
    needs: acceptance-plan
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        scenario: ${{ fromJSON(needs.acceptance-plan.outputs.scenarios) }}
    env:
      UV_LOCKED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      RECOVERY_FIXTURE: /var/tmp/ac-recovery-vm-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.scenario }}
      APPROVED_AUTHORIZATION_ID: ci-recovery-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.scenario }}
      RECOVERY_SCENARIO: ${{ matrix.scenario }}
    steps:
      - name: Checkout exact reviewed source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.7.22"
      - name: Install locked test dependencies
        run: uv sync --locked --dev --extra test
      - name: Inspect the actual guest acceleration device
        run: |
          set -euo pipefail
          if test -c /dev/kvm; then
            stat --format='KVM device: %n mode=%a uid=%u gid=%g' /dev/kvm
          else
            echo 'No KVM device: the fresh QEMU guest will use bounded software CPU emulation.'
          fi
      - name: Build and verify exact installed management image
        run: uv run python scripts/prepare_management_test_image.py
      - name: Prepare the approved fresh recovery VM
        env:
          FIXTURE_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          token_file="$RUNNER_TEMP/recovery-source-read-token"
          trap 'rm -f "$token_file"' EXIT
          printf '%s' "$FIXTURE_READ_TOKEN" > "$token_file"
          docker pull caddy:2
          manager_id="$(docker image inspect --format '{{.Id}}' "$AUTOCODER_FRESH_TEST_BASE_IMAGE")"
          caddy_id="$(docker image inspect --format '{{.Id}}' caddy:2)"
          bash scripts/recovery_vm/prepare.sh "$RECOVERY_FIXTURE" "$APPROVED_AUTHORIZATION_ID" "$manager_id" "$caddy_id" "$token_file" "$RECOVERY_SCENARIO"
      - name: Build bounded QEMU runner
        run: docker compose --env-file "$RECOVERY_FIXTURE/compose.env" build
      - name: Run actual original producers, containment and one-shot issuer
        timeout-minutes: 125
        run: |
          set -euo pipefail
          docker compose --env-file "$RECOVERY_FIXTURE/compose.env" run --rm fixture
      - name: Remove the ephemeral read credential
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/recovery-source-read-token"
          rm -f "$RECOVERY_FIXTURE/input/source-token"
      - name: Retain bounded native acceptance diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: management-recovery-epoch-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.scenario }}
          path: /var/tmp/ac-recovery-vm-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.scenario }}/output/
          if-no-files-found: error
          retention-days: 7
  verifier-omission-control:
    name: Detect omitted post-consumption verification in isolated VM
    needs: acceptance-plan
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      UV_LOCKED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      RECOVERY_FIXTURE: /var/tmp/ac-recovery-vm-${{ github.run_id }}-${{ github.run_attempt }}-verifier-omission-control
      APPROVED_AUTHORIZATION_ID: ci-recovery-${{ github.run_id }}-${{ github.run_attempt }}-verifier-omission-control
      RECOVERY_SCENARIO: post-receipt-ready-mutation
    steps:
      - name: Checkout exact reviewed source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.7.22"
      - name: Install locked test dependencies
        run: uv sync --locked --dev --extra test
      - name: Inspect the actual guest acceleration device
        run: |
          set -euo pipefail
          if test -c /dev/kvm; then
            stat --format='KVM device: %n mode=%a uid=%u gid=%g' /dev/kvm
          else
            echo 'No KVM device: the fresh QEMU guest will use bounded software CPU emulation.'
          fi
      - name: Build and verify exact installed management image
        run: uv run python scripts/prepare_management_test_image.py
      - name: Prepare the approved fresh recovery VM
        env:
          FIXTURE_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          token_file="$RUNNER_TEMP/recovery-source-read-token"
          trap 'rm -f "$token_file"' EXIT
          printf '%s' "$FIXTURE_READ_TOKEN" > "$token_file"
          docker pull caddy:2
          manager_id="$(docker image inspect --format '{{.Id}}' "$AUTOCODER_FRESH_TEST_BASE_IMAGE")"
          caddy_id="$(docker image inspect --format '{{.Id}}' caddy:2)"
          bash scripts/recovery_vm/prepare.sh "$RECOVERY_FIXTURE" "$APPROVED_AUTHORIZATION_ID" "$manager_id" "$caddy_id" "$token_file" "$RECOVERY_SCENARIO" omit-post-consumption-verifier
      - name: Build bounded QEMU runner
        run: docker compose --env-file "$RECOVERY_FIXTURE/compose.env" build
      - name: Detect the exact omitted verifier with the unchanged native oracle
        timeout-minutes: 125
        run: |
          set -euo pipefail
          docker compose --env-file "$RECOVERY_FIXTURE/compose.env" run --rm fixture
      - name: Remove the ephemeral read credential
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/recovery-source-read-token"
          rm -f "$RECOVERY_FIXTURE/input/source-token"
      - name: Retain the distinct mutation-control evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: management-recovery-epoch-${{ github.run_id }}-${{ github.run_attempt }}-verifier-omission-control
          path: /var/tmp/ac-recovery-vm-${{ github.run_id }}-${{ github.run_attempt }}-verifier-omission-control/output/
          if-no-files-found: error
          retention-days: 7
  acceptance:
    name: Management Recovery Epoch Acceptance
    needs: [acceptance-plan, recovery-epoch, verifier-omission-control]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every native scenario to succeed
        env:
          PLAN_RESULT: ${{ needs.acceptance-plan.result }}
          ACCEPTANCE_RESULT: ${{ needs.recovery-epoch.result }}
          MUTATION_CONTROL_RESULT: ${{ needs.verifier-omission-control.result }}
        run: |
          test "$PLAN_RESULT" = success
          test "$ACCEPTANCE_RESULT" = success
          test "$MUTATION_CONTROL_RESULT" = success
