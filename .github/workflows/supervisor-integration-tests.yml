name: Supervisor Integration Tests

'on':
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.event_name, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  worker-bridge:
    name: Worker processes and bridge
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UV_LOCKED: "1"
      AUTO_CODER_CI_TIMING_DIR: ${{ github.workspace }}/supervisor-integration-logs/timing
      AUTO_CODER_CI_TIMING_EXPECTED_INVOCATIONS: worker-bridge,worker-daemon
      PYTHONPATH: ${{ github.workspace }}/scripts
    steps:
      - &checkout
        name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - &python
        name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - &uv
        name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.7.22"
      - &dependencies
        name: Install locked test dependencies
        run: uv sync --locked --dev --extra test
      - name: Test real worker processes and management bridge
        timeout-minutes: 10
        run: |
          set -o pipefail
          AUTO_CODER_CI_TIMING_INVOCATION=worker-bridge \
          SUPERVISOR_RESULTS_PATH=supervisor-integration-logs/worker-bridge.json \
          uv run pytest -p supervisor_ci_results -q -vv \
            tests/test_worker_supervisor.py \
            tests/test_worker_supervisor_bridge.py \
            tests/test_worker_versions.py \
            tests/test_graceful_shutdown.py::test_forced_cancel_reaps_orphan_only_after_owned_thread_finishes \
            tests/test_graceful_shutdown.py::test_cancelled_async_wrapper_does_not_release_running_thread \
            tests/test_graceful_shutdown.py::test_cancelled_wrapper_before_submission_does_not_retain_unstarted_work \
            tests/test_graceful_shutdown.py::test_cancelled_wrapper_keeps_queued_executor_work_owned \
            tests/test_graceful_shutdown.py::test_rejected_executor_submission_does_not_retain_unstarted_work \
            tests/test_worker_management_bridge.py::test_real_unix_socket_observes_same_engine_and_read_does_not_heartbeat \
            tests/test_worker_management_bridge.py::test_graceful_receipt_requires_stopped_closed_and_settled \
            --junitxml=supervisor-integration-logs/worker-bridge.xml 2>&1 | tail -n 400
          AUTO_CODER_CI_TIMING_INVOCATION=worker-daemon \
          SUPERVISOR_RESULTS_PATH=supervisor-integration-logs/worker-daemon.json \
          uv run pytest -p supervisor_ci_results -q -vv -s -o timeout=60 \
            tests/test_worker_management_bridge.py::test_actual_daemon_uds_observes_admitted_drain_and_persists_receipt \
            --junitxml=supervisor-integration-logs/worker-daemon.xml 2>&1 | tail -n 400
      - name: Bind native worker result to the producing job
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          uv run python scripts/supervisor_native_evidence.py --profile worker \
            --inventory supervisor-integration-logs/worker-bridge.json \
            --inventory supervisor-integration-logs/worker-daemon.json \
            --output supervisor-integration-logs/receipt.json
      - &summarize-timing
        name: Summarize integration timing
        if: always()
        continue-on-error: true
        run: uv run python scripts/summarize_ci_timing.py supervisor-integration-logs/timing --output supervisor-integration-logs/timing-summary.json
      - &upload-worker
        name: Upload worker diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: supervisor-integration-worker-bridge-${{ github.run_id }}-${{ github.run_attempt }}
          path: supervisor-integration-logs/
          if-no-files-found: error

  prepare-management:
    name: Prepare Supervisor plan (management)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.shards.outputs.matrix }}
      artifact_name: supervisor-plan-management-${{ github.run_id }}-${{ github.run_attempt }}
    env: &management-env
      UV_LOCKED: "1"
      PYTHONPATH: ${{ github.workspace }}/scripts
    steps:
      - *checkout
      - *python
      - *uv
      - *dependencies
      - name: Configure complete management profile
        run: uv run python scripts/supervisor_ci_profiles.py configure --profile management-self-update --github-env "$GITHUB_ENV"
      - name: Find previous management native durations
        id: history
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run python scripts/supervisor_duration_artifacts.py find --profile management-self-update --github-output "$GITHUB_OUTPUT"
      - name: Restore optional management duration snapshot
        if: steps.history.outputs.name != ''
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: ${{ steps.history.outputs.name }}
          run-id: ${{ steps.history.outputs.run_id }}
          github-token: ${{ github.token }}
          path: supervisor-plan/management-self-update/history
      - name: Plan complete management collection
        id: shards
        env:
          SUPERVISOR_CI_RESULT_MODE: collect
        run: |
          set -euo pipefail
          uv run python scripts/supervisor_ci_profiles.py context --profile management-self-update --output supervisor-plan/management-self-update/context.json
          mapfile -t selectors < <(uv run python scripts/supervisor_ci_profiles.py args --profile management-self-update)
          uv run python scripts/plan_ci_shards.py \
            --context supervisor-plan/management-self-update/context.json \
            --duration-profile supervisor-plan/management-self-update/history/profile.json \
            --cold-start-estimate-seconds 120 \
            --output supervisor-plan/management-self-update/plan.json \
            --log-dir supervisor-plan/management-self-update/logs -- "${selectors[@]}"
          uv run python scripts/supervisor_ci_profiles.py matrix --profile management-self-update \
            --plan supervisor-plan/management-self-update/plan.json --github-output "$GITHUB_OUTPUT"
      - name: Publish immutable management plan
        uses: actions/upload-artifact@v7
        with:
          name: supervisor-plan-management-${{ github.run_id }}-${{ github.run_attempt }}
          path: supervisor-plan/management-self-update/
          if-no-files-found: error

  prepare-fresh-host:
    name: Prepare Supervisor plan (fresh host)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    outputs:
      matrix: ${{ steps.shards.outputs.matrix }}
      artifact_name: supervisor-plan-fresh-host-${{ github.run_id }}-${{ github.run_attempt }}
    env: &fresh-env
      UV_LOCKED: "1"
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/scripts
    steps:
      - *checkout
      - *python
      - *uv
      - *dependencies
      - &build
        name: Build the checked-out production image
        timeout-minutes: 25
        run: |
          uv run python scripts/prepare_opencode_image.py \
            --tag "auto-coder:supervisor-${{ github.sha }}" \
            --log-dir supervisor-integration-logs
      - &host-prerequisites
        name: Prepare privileged fresh-host prerequisites
        run: |
          if ! command -v strace >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y strace
          fi
          docker tag "auto-coder:supervisor-${{ github.sha }}" auto-coder:management-local-abc65544
          docker pull caddy@sha256:504a44d7d74bd2bc28a66afc4774912fc21223ca8a67734af1c54ab2f999b489
      - name: Configure complete fresh-host profile
        run: uv run python scripts/supervisor_ci_profiles.py configure --profile fresh-host --github-env "$GITHUB_ENV"
      - name: Find previous fresh-host native durations
        id: history
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run python scripts/supervisor_duration_artifacts.py find --profile fresh-host --github-output "$GITHUB_OUTPUT"
      - name: Restore optional fresh-host duration snapshot
        if: steps.history.outputs.name != ''
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: ${{ steps.history.outputs.name }}
          run-id: ${{ steps.history.outputs.run_id }}
          github-token: ${{ github.token }}
          path: supervisor-plan/fresh-host/history
      - name: Plan complete privileged collection
        id: shards
        env:
          SUPERVISOR_CI_RESULT_MODE: collect
        run: |
          set -euo pipefail
          uv run python scripts/supervisor_ci_profiles.py context --profile fresh-host --output supervisor-plan/fresh-host/context.json
          mapfile -t selectors < <(uv run python scripts/supervisor_ci_profiles.py args --profile fresh-host)
          # Return only the generated plan/collection files to the runner, even on failure.
          trap 'sudo chown -R "$(id -u):$(id -g)" supervisor-plan/fresh-host' EXIT
          sudo env "PATH=$PATH" "PYTHONPATH=$PYTHONPATH" \
            "GIT_CONFIG_COUNT=1" "GIT_CONFIG_KEY_0=safe.directory" "GIT_CONFIG_VALUE_0=$GITHUB_WORKSPACE" \
            "SUPERVISOR_CI_RESULT_MODE=collect" \
            "SUPERVISOR_REQUIRED_NODEIDS=$SUPERVISOR_REQUIRED_NODEIDS" \
            "$GITHUB_WORKSPACE/.venv/bin/python" scripts/plan_ci_shards.py \
            --context supervisor-plan/fresh-host/context.json \
            --duration-profile supervisor-plan/fresh-host/history/profile.json \
            --cold-start-estimate-seconds 120 \
            --output supervisor-plan/fresh-host/plan.json \
            --log-dir supervisor-plan/fresh-host/logs -- "${selectors[@]}"
          sudo chown -R "$(id -u):$(id -g)" supervisor-plan/fresh-host
          uv run python scripts/supervisor_ci_profiles.py matrix --profile fresh-host \
            --plan supervisor-plan/fresh-host/plan.json --github-output "$GITHUB_OUTPUT"
      - name: Publish immutable fresh-host plan
        uses: actions/upload-artifact@v7
        with:
          name: supervisor-plan-fresh-host-${{ github.run_id }}-${{ github.run_attempt }}
          path: supervisor-plan/fresh-host/
          if-no-files-found: error

  prepare-containers:
    name: Prepare Supervisor plan (containers)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    outputs:
      matrix: ${{ steps.shards.outputs.matrix }}
      artifact_name: supervisor-plan-containers-${{ github.run_id }}-${{ github.run_attempt }}
    env: &containers-env
      UV_LOCKED: "1"
      PYTHONPATH: ${{ github.workspace }}/scripts
      AUTOCODER_SUPERVISOR_IMAGE: auto-coder:supervisor-${{ github.sha }}
      AUTO_CODER_REQUIRE_SUPERVISOR_INTEGRATION: "1"
      AUTO_CODER_INTEGRATION_UV_CACHE_DIR: ${{ github.workspace }}/.cache/nested-preparation-uv
    steps:
      - *checkout
      - *python
      - *uv
      - *dependencies
      - *build
      - name: Configure complete isolated-container profile
        run: uv run python scripts/supervisor_ci_profiles.py configure --profile isolated-containers --github-env "$GITHUB_ENV"
      - name: Find previous container native durations
        id: history
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run python scripts/supervisor_duration_artifacts.py find --profile isolated-containers --github-output "$GITHUB_OUTPUT"
      - name: Restore optional container duration snapshot
        if: steps.history.outputs.name != ''
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: ${{ steps.history.outputs.name }}
          run-id: ${{ steps.history.outputs.run_id }}
          github-token: ${{ github.token }}
          path: supervisor-plan/isolated-containers/history
      - name: Plan complete container collection
        id: shards
        env:
          SUPERVISOR_CI_RESULT_MODE: collect
        run: |
          set -euo pipefail
          uv run python scripts/supervisor_ci_profiles.py context --profile isolated-containers --output supervisor-plan/isolated-containers/context.json
          mapfile -t selectors < <(uv run python scripts/supervisor_ci_profiles.py args --profile isolated-containers)
          uv run python scripts/plan_ci_shards.py \
            --context supervisor-plan/isolated-containers/context.json \
            --duration-profile supervisor-plan/isolated-containers/history/profile.json \
            --cold-start-estimate-seconds 120 \
            --output supervisor-plan/isolated-containers/plan.json \
            --log-dir supervisor-plan/isolated-containers/logs -- "${selectors[@]}"
          uv run python scripts/supervisor_ci_profiles.py matrix --profile isolated-containers \
            --plan supervisor-plan/isolated-containers/plan.json --github-output "$GITHUB_OUTPUT"
      - name: Publish immutable container plan
        uses: actions/upload-artifact@v7
        with:
          name: supervisor-plan-containers-${{ github.run_id }}-${{ github.run_attempt }}
          path: supervisor-plan/isolated-containers/
          if-no-files-found: error

  management-self-update:
    name: Supervisor management-self-update (shard ${{ matrix.shard }})
    needs: prepare-management
    runs-on: ubuntu-latest
    timeout-minutes: 65
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare-management.outputs.matrix) }}
    env:
      UV_LOCKED: "1"
      PYTHONPATH: ${{ github.workspace }}/scripts
      AUTO_CODER_CI_TIMING_DIR: ${{ github.workspace }}/supervisor-integration-logs/timing
      AUTO_CODER_CI_TIMING_EXPECTED_INVOCATIONS: management-self-update-shard-${{ matrix.shard }}
      AUTO_CODER_CI_TIMING_INVOCATION: management-self-update-shard-${{ matrix.shard }}
      SUPERVISOR_PROFILE: management-self-update
      SUPERVISOR_SHARD_ID: ${{ matrix.shard }}
      SUPERVISOR_PLAN_PATH: supervisor-plan/management-self-update/plan.json
      SUPERVISOR_RESULTS_PATH: supervisor-integration-logs/management-self-update-${{ matrix.shard }}.json
    steps:
      - *checkout
      - *python
      - *uv
      - *dependencies
      - name: Download immutable management plan
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.prepare-management.outputs.artifact_name }}
          path: supervisor-plan/management-self-update
      - name: Configure complete management profile
        run: uv run python scripts/supervisor_ci_profiles.py configure --profile management-self-update --github-env "$GITHUB_ENV"
      - name: Verify authenticated management self-update
        timeout-minutes: 55
        run: |
          set -euo pipefail
          uv run python scripts/supervisor_ci_profiles.py verify --profile management-self-update --plan "$SUPERVISOR_PLAN_PATH"
          mapfile -t selectors < <(uv run python scripts/supervisor_ci_profiles.py args --profile management-self-update)
          uv run python -m pytest -p scripts.ci_shard_plugin \
            "--ci-plan=$SUPERVISOR_PLAN_PATH" "--ci-shard=$SUPERVISOR_SHARD_ID" -q -vv \
            "${selectors[@]}" --junitxml="supervisor-integration-logs/management-self-update-$SUPERVISOR_SHARD_ID.xml"
      - name: Bind native management receipt
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          uv run python scripts/supervisor_native_evidence.py --profile management-self-update \
            --shard "$SUPERVISOR_SHARD_ID" --plan "$SUPERVISOR_PLAN_PATH" \
            --inventory "$SUPERVISOR_RESULTS_PATH" --output supervisor-integration-logs/receipt.json
      - *summarize-timing
      - name: Upload management diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: supervisor-integration-management-self-update-shard-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: supervisor-integration-logs/
          if-no-files-found: error

  fresh-host:
    name: Supervisor fresh-host (shard ${{ matrix.shard }})
    needs: prepare-fresh-host
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare-fresh-host.outputs.matrix) }}
    env:
      UV_LOCKED: "1"
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/scripts
      AUTO_CODER_CI_TIMING_DIR: ${{ github.workspace }}/supervisor-integration-logs/timing
      AUTO_CODER_CI_TIMING_EXPECTED_INVOCATIONS: fresh-host-shard-${{ matrix.shard }}
      AUTO_CODER_CI_TIMING_INVOCATION: fresh-host-shard-${{ matrix.shard }}
      SUPERVISOR_PROFILE: fresh-host
      SUPERVISOR_SHARD_ID: ${{ matrix.shard }}
      SUPERVISOR_PLAN_PATH: supervisor-plan/fresh-host/plan.json
      SUPERVISOR_RESULTS_PATH: supervisor-integration-logs/fresh-host-${{ matrix.shard }}.json
    steps:
      - *checkout
      - *python
      - *uv
      - *dependencies
      - *build
      - *host-prerequisites
      - name: Download immutable fresh-host plan
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.prepare-fresh-host.outputs.artifact_name }}
          path: supervisor-plan/fresh-host
      - name: Configure complete fresh-host profile
        run: uv run python scripts/supervisor_ci_profiles.py configure --profile fresh-host --github-env "$GITHUB_ENV"
      - name: Verify fresh initialization with host evidence
        timeout-minutes: 35
        run: |
          set -euo pipefail
          checkout_sha="$(git rev-parse HEAD)"
          uv run python scripts/supervisor_ci_profiles.py verify --profile fresh-host --plan "$SUPERVISOR_PLAN_PATH"
          mapfile -t selectors < <(uv run python scripts/supervisor_ci_profiles.py args --profile fresh-host)
          # Make root-produced native receipts and timing readable by the upload and verification steps.
          trap 'sudo chown -R "$(id -u):$(id -g)" supervisor-integration-logs' EXIT
          # Real kernel/proxy observations still run in a root interpreter.
          sudo env "PATH=$PATH" "PYTHONPATH=$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE/scripts" \
            "GIT_CONFIG_COUNT=1" "GIT_CONFIG_KEY_0=safe.directory" "GIT_CONFIG_VALUE_0=$GITHUB_WORKSPACE" \
            "AUTO_CODER_CI_TIMING_DIR=$AUTO_CODER_CI_TIMING_DIR" \
            "AUTO_CODER_CI_TIMING_INVOCATION=$AUTO_CODER_CI_TIMING_INVOCATION" \
            "AUTO_CODER_CI_TIMING_CHECKOUT_SHA=$checkout_sha" \
            "GITHUB_SHA=$GITHUB_SHA" \
            "GITHUB_WORKFLOW=$GITHUB_WORKFLOW" \
            "GITHUB_RUN_ID=$GITHUB_RUN_ID" \
            "GITHUB_RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT" \
            "GITHUB_JOB=$GITHUB_JOB" \
            "RUNNER_NAME=$RUNNER_NAME" \
            "SUPERVISOR_REQUIRED_NODEIDS=$SUPERVISOR_REQUIRED_NODEIDS" \
            "SUPERVISOR_RESULTS_PATH=$SUPERVISOR_RESULTS_PATH" \
            "SUPERVISOR_PROFILE=$SUPERVISOR_PROFILE" \
            "SUPERVISOR_SHARD_ID=$SUPERVISOR_SHARD_ID" \
            "SUPERVISOR_PLAN_PATH=$SUPERVISOR_PLAN_PATH" \
            "$GITHUB_WORKSPACE/.venv/bin/python" -m pytest -p scripts.ci_shard_plugin \
            "--ci-plan=$SUPERVISOR_PLAN_PATH" "--ci-shard=$SUPERVISOR_SHARD_ID" -q -vv \
            "${selectors[@]}" --junitxml="supervisor-integration-logs/fresh-host-$SUPERVISOR_SHARD_ID.xml"
      - name: Bind native fresh-host receipt
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          uv run python scripts/supervisor_native_evidence.py --profile fresh-host \
            --shard "$SUPERVISOR_SHARD_ID" --plan "$SUPERVISOR_PLAN_PATH" \
            --inventory "$SUPERVISOR_RESULTS_PATH" --output supervisor-integration-logs/receipt.json
      - *summarize-timing
      - name: Upload fresh-host diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: supervisor-integration-fresh-host-shard-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: supervisor-integration-logs/
          if-no-files-found: error

  operator-upgrade:
    name: Operator upgrade production-origin Docker
    runs-on: ubuntu-latest
    timeout-minutes: 85
    env:
      UV_LOCKED: "1"
      AUTO_CODER_CI_TIMING_DIR: ${{ github.workspace }}/supervisor-integration-logs/timing
      AUTO_CODER_CI_TIMING_EXPECTED_INVOCATIONS: operator-upgrade
      SUPERVISOR_PROFILE: operator-upgrade
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/scripts
      SUPERVISOR_REQUIRED_NODEIDS: '["tests/test_management_bootstrap_upgrade_container.py::test_disposable_operator_prepare_apply_status_real_docker","tests/test_management_bootstrap_upgrade_container.py::test_disposable_operator_failure_fences_real_docker[lost-stop]","tests/test_management_bootstrap_upgrade_container.py::test_disposable_operator_failure_fences_real_docker[lost-start]","tests/test_management_bootstrap_upgrade_container.py::test_disposable_operator_failure_fences_real_docker[postlaunch-proxy-failed]","tests/test_management_bootstrap_upgrade_container.py::test_disposable_operator_failure_fences_real_docker[retained-unresolved-work]","tests/test_management_bootstrap_upgrade_container.py::test_disposable_operator_failure_fences_real_docker[predecessor-generation]","tests/test_management_bootstrap_upgrade_container.py::test_disposable_operator_failure_fences_real_docker[predecessor-management-generation]","tests/test_management_bootstrap_upgrade_container.py::test_disposable_operator_failure_fences_real_docker[host-process-interrupted]"]'
    steps:
      - *checkout
      - *python
      - *uv
      - *dependencies
      - *build
      - name: Verify operator prepare/apply/status with disposable Docker
        timeout-minutes: 65
        run: |
          if ! command -v strace >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y strace
          fi
          docker tag "auto-coder:supervisor-${{ github.sha }}" auto-coder:management-local-abc65544
          docker pull caddy@sha256:504a44d7d74bd2bc28a66afc4774912fc21223ca8a67734af1c54ab2f999b489
          checkout_sha="$(git rev-parse HEAD)"
          # Use the exact production-origin image, unmodified host commands,
          # ephemeral Docker state and the required no-skip result inventory.
          trap 'sudo chown -R "$(id -u):$(id -g)" supervisor-integration-logs' EXIT
          sudo env "PATH=$PATH" "PYTHONPATH=$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE/scripts" \
            "GIT_CONFIG_COUNT=1" "GIT_CONFIG_KEY_0=safe.directory" "GIT_CONFIG_VALUE_0=$GITHUB_WORKSPACE" \
            "AUTO_CODER_CI_TIMING_DIR=$AUTO_CODER_CI_TIMING_DIR" \
            "AUTO_CODER_CI_TIMING_INVOCATION=operator-upgrade" \
            "AUTO_CODER_CI_TIMING_CHECKOUT_SHA=$checkout_sha" \
            "GITHUB_SHA=$GITHUB_SHA" \
            "GITHUB_WORKFLOW=$GITHUB_WORKFLOW" \
            "GITHUB_RUN_ID=$GITHUB_RUN_ID" \
            "GITHUB_RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT" \
            "GITHUB_JOB=$GITHUB_JOB" \
            "RUNNER_NAME=$RUNNER_NAME"
            "SUPERVISOR_PROFILE=$SUPERVISOR_PROFILE" \
            "SUPERVISOR_REQUIRED_NODEIDS=$SUPERVISOR_REQUIRED_NODEIDS" \
            "SUPERVISOR_RESULTS_PATH=$GITHUB_WORKSPACE/supervisor-integration-logs/operator-upgrade.json" \
            "$GITHUB_WORKSPACE/.venv/bin/python" -m pytest -p supervisor_ci_results -q -vv -o timeout=240 \
            tests/test_management_bootstrap_upgrade_container.py \
            --junitxml=supervisor-integration-logs/operator-upgrade.xml
      - name: Bind native operator upgrade receipt
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          uv run python scripts/supervisor_native_evidence.py --profile operator-upgrade \
            --inventory supervisor-integration-logs/operator-upgrade.json \
            --output supervisor-integration-logs/receipt.json
      - *summarize-timing
      - name: Upload operator upgrade diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: supervisor-integration-operator-upgrade-${{ github.run_id }}-${{ github.run_attempt }}
          path: supervisor-integration-logs/
          if-no-files-found: error

  isolated-containers:
    name: Supervisor isolated-containers (shard ${{ matrix.shard }})
    needs: prepare-containers
    runs-on: ubuntu-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare-containers.outputs.matrix) }}
    env:
      UV_LOCKED: "1"
      AUTO_CODER_CI_TIMING_DIR: ${{ github.workspace }}/supervisor-integration-logs/timing
      AUTO_CODER_CI_TIMING_EXPECTED_INVOCATIONS: isolated-containers-shard-${{ matrix.shard }}
      AUTO_CODER_CI_TIMING_INVOCATION: isolated-containers-shard-${{ matrix.shard }}
      AUTO_CODER_INTEGRATION_UV_CACHE_DIR: ${{ github.workspace }}/.cache/nested-preparation-uv
      PYTHONPATH: ${{ github.workspace }}/scripts
      AUTOCODER_SUPERVISOR_IMAGE: auto-coder:supervisor-${{ github.sha }}
      AUTO_CODER_REQUIRE_SUPERVISOR_INTEGRATION: "1"
      SUPERVISOR_PROFILE: isolated-containers
      SUPERVISOR_SHARD_ID: ${{ matrix.shard }}
      SUPERVISOR_PLAN_PATH: supervisor-plan/isolated-containers/plan.json
      SUPERVISOR_RESULTS_PATH: supervisor-integration-logs/isolated-containers-${{ matrix.shard }}.json
    steps:
      - *checkout
      - *python
      - *uv
      - *dependencies
      - *build
      - name: Download immutable container plan
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.prepare-containers.outputs.artifact_name }}
          path: supervisor-plan/isolated-containers
      - name: Configure complete isolated-container profile
        run: uv run python scripts/supervisor_ci_profiles.py configure --profile isolated-containers --github-env "$GITHUB_ENV"
      - name: Verify isolated Supervisor containers
        timeout-minutes: 40
        run: |
          set -euo pipefail
          uv run python scripts/supervisor_ci_profiles.py verify --profile isolated-containers --plan "$SUPERVISOR_PLAN_PATH"
          mapfile -t selectors < <(uv run python scripts/supervisor_ci_profiles.py args --profile isolated-containers)
          uv run python -m pytest -p scripts.ci_shard_plugin \
            "--ci-plan=$SUPERVISOR_PLAN_PATH" "--ci-shard=$SUPERVISOR_SHARD_ID" -q -vv \
            "${selectors[@]}" --junitxml="supervisor-integration-logs/isolated-containers-$SUPERVISOR_SHARD_ID.xml"
      - name: Bind native container receipt
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          uv run python scripts/supervisor_native_evidence.py --profile isolated-containers \
            --shard "$SUPERVISOR_SHARD_ID" --plan "$SUPERVISOR_PLAN_PATH" \
            --inventory "$SUPERVISOR_RESULTS_PATH" --output supervisor-integration-logs/receipt.json
      - *summarize-timing
      - name: Upload container diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: supervisor-integration-isolated-containers-shard-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: supervisor-integration-logs/
          if-no-files-found: error

  supervisor-integration:
    name: Supervisor Integration Tests
    if: always()
    runs-on: ubuntu-latest
    needs:
      - worker-bridge
      - prepare-management
      - prepare-fresh-host
      - prepare-containers
      - management-self-update
      - fresh-host
      - operator-upgrade
      - isolated-containers
    steps:
      - *checkout
      - *python
      - *uv
      - *dependencies
      - name: Download original management plan
        if: needs.prepare-management.outputs.artifact_name != ''
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.prepare-management.outputs.artifact_name }}
          path: evidence/plans/management-self-update
      - name: Download original fresh-host plan
        if: needs.prepare-fresh-host.outputs.artifact_name != ''
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.prepare-fresh-host.outputs.artifact_name }}
          path: evidence/plans/fresh-host
      - name: Download original container plan
        if: needs.prepare-containers.outputs.artifact_name != ''
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.prepare-containers.outputs.artifact_name }}
          path: evidence/plans/isolated-containers
      - name: Download all current-run native diagnostic artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: supervisor-integration-*
          path: evidence/shards
          merge-multiple: false
      - name: Require every integration group to succeed
        env:
          REQUIRED_RESULTS: ${{ toJSON(needs) }}
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONPATH: ${{ github.workspace }}/scripts
        run: uv run python scripts/validate_supervisor_aggregate.py
      - name: Update optional native duration profiles
        continue-on-error: true
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts
        run: uv run python scripts/supervisor_duration_artifacts.py update
      - name: Upload management duration profile
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: supervisor-duration-management-self-update-${{ github.run_id }}-${{ github.run_attempt }}
          path: supervisor-duration/management-self-update/profile.json
          if-no-files-found: warn
      - name: Upload fresh-host duration profile
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: supervisor-duration-fresh-host-${{ github.run_id }}-${{ github.run_attempt }}
          path: supervisor-duration/fresh-host/profile.json
          if-no-files-found: warn
      - name: Upload container duration profile
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: supervisor-duration-isolated-containers-${{ github.run_id }}-${{ github.run_attempt }}
          path: supervisor-duration/isolated-containers/profile.json
          if-no-files-found: warn
      - name: Upload native gate and timing diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: supervisor-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: supervisor-integration-logs/
          if-no-files-found: warn
