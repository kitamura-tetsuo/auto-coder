name: Supervisor Integration Tests

'on':
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supervisor-integration:
    name: Supervisor Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      UV_LOCKED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.7.22"

      - name: Install locked test dependencies
        run: uv sync --locked --dev --extra test

      - name: Test real worker processes and management bridge
        timeout-minutes: 10
        run: |
          uv run pytest -q -vv \
            tests/test_worker_supervisor.py \
            tests/test_worker_supervisor_bridge.py \
            tests/test_worker_versions.py \
            tests/test_worker_management_bridge.py::test_real_unix_socket_observes_same_engine_and_read_does_not_heartbeat \
            tests/test_worker_management_bridge.py::test_graceful_receipt_requires_stopped_closed_and_settled
          # Isolate the production daemon composition from long-lived process
          # fixture state while retaining its complete UDS/terminal oracle.
          uv run pytest -q -vv -s -o timeout=60 \
            tests/test_worker_management_bridge.py::test_actual_daemon_uds_observes_admitted_drain_and_persists_receipt

      - name: Verify authenticated management self-update
        timeout-minutes: 25
        run: |
          uv run pytest -q -vv -m supervisor_integration \
            tests/test_management_self_update_integration.py \
            tests/test_management_self_update_failures.py \
            tests/test_management_fresh_host_integration.py \
            --junitxml=supervisor-integration-logs/management-self-update.xml

      - name: Build the checked-out production image
        timeout-minutes: 25
        run: |
          uv run python scripts/prepare_opencode_image.py \
            --tag "auto-coder:supervisor-${{ github.sha }}" \
            --log-dir supervisor-integration-logs

      - name: Verify fresh initialization with host evidence
        timeout-minutes: 15
        run: |
          if ! command -v strace >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y strace
          fi
          docker tag "auto-coder:supervisor-${{ github.sha }}" auto-coder:management-local-abc65544
          # Root is confined to these disposable-container tests on the
          # ephemeral runner: it reads kernel namespace and proxy ownership
          # evidence and traces execve; the child gets no added privileges.
          sudo env "PATH=$PATH" "PYTHONPATH=$GITHUB_WORKSPACE/src" \
            "$GITHUB_WORKSPACE/.venv/bin/python" -m pytest -q -vv -o timeout=240 \
            tests/test_management_fresh_host_integration.py::test_real_docker_published_listener_is_owned_by_replacement \
            tests/test_management_fresh_host_integration.py::test_real_docker_listener_rejects_mismatched_container_address \
            tests/test_management_fresh_host_integration.py::test_real_docker_listener_rejects_changed_container_inspection \
            tests/test_management_fresh_host_integration.py::test_real_listener_accepts_only_mount_order_changes \
            tests/test_management_fresh_end_to_end.py \
            --junitxml=supervisor-integration-logs/fresh-initialization.xml
          python3 - supervisor-integration-logs/fresh-initialization.xml <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          suites = list(root.iter('testsuite'))
          assert sum(int(s.get('tests', 0)) for s in suites) == 7, 'expected all host tests'
          assert all(int(s.get('skipped', 0)) == 0 for s in suites), 'host tests must not skip'
          PY

      - name: Verify isolated Supervisor containers
        timeout-minutes: 40
        env:
          AUTOCODER_SUPERVISOR_IMAGE: auto-coder:supervisor-${{ github.sha }}
          AUTO_CODER_REQUIRE_SUPERVISOR_INTEGRATION: "1"
        run: |
          uv run pytest -q -vv -m supervisor_integration \
            tests/test_supervisor_container_integration.py \
            tests/test_worker_network_integration.py \
            tests/test_management_beta_deploy_container.py \
            tests/test_beta_runtime_smoke_container.py \
            --junitxml=supervisor-integration-logs/results.xml

      - name: Upload integration diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: supervisor-integration-${{ github.run_attempt }}
          path: supervisor-integration-logs/
          if-no-files-found: ignore
