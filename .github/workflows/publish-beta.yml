name: Publish Beta

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-tested-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: uv sync --dev --extra test
      - run: bash scripts/test.sh -m "not opencode_live"
      - name: Establish clean build identity
        run: |
          uv run python -c 'from auto_coder.build_identity import resolve_build_identity,serialize_build_identity; from pathlib import Path; r=resolve_build_identity("."); assert r.state == "clean" and r.source_revision == "${{ github.sha }}"; Path(".agent-tmp/build-identity.json").write_text(serialize_build_identity(r))'
          echo "BUILD_IDENTITY_B64=$(base64 -w0 .agent-tmp/build-identity.json)" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          build-args: |
            AUTO_CODER_SOURCE_REVISION=${{ github.sha }}
            AUTO_CODER_BUILD_IDENTITY_B64=${{ env.BUILD_IDENTITY_B64 }}
          tags: |
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          provenance: true
      - name: Verify and publish tested image
        run: |
          IMAGE=ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          EXPECTED=$(uv run python -c 'import json; print(json.load(open(".agent-tmp/build-identity.json"))["version"])')
          test "$(docker run --rm --entrypoint python "$IMAGE" -c 'import importlib.metadata; print(importlib.metadata.version("auto-coder"))')" = "$EXPECTED"
          test "$(docker run --rm "$IMAGE" --version | sed -n 's/^auto-coder, version //p')" = "$EXPECTED"
          OBSERVATION=$(docker run --rm --entrypoint python "$IMAGE" -m auto_coder.build_provenance)
          test "$(echo "$OBSERVATION" | jq -r '.distribution_version.value')" = "$EXPECTED"
          test "$(echo "$OBSERVATION" | jq -r '.source_revision.value')" = "${{ github.sha }}"
          test "$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE")" = "${{ github.sha }}"
          docker push "$IMAGE"
