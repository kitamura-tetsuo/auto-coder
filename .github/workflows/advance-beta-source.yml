name: Advance Beta Source

on:
  workflow_dispatch:
    inputs:
      expected_previous_sha:
        description: "Exact previously observed beta source SHA (empty only to create)"
        required: false
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: advance-beta-source
  cancel-in-progress: false

jobs:
  advance-beta-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Select and reconcile the verified beta source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          uv run python -m auto_coder.beta_source_selection
          --repository '${{ github.repository }}'
          --operation-id 'r${{ github.run_id }}'
          --expected-previous-sha '${{ inputs.expected_previous_sha }}'
