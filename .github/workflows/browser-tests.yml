name: Browser Tests

'on':
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.event_name, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  browser-tests:
    name: Browser Tests
    # Pin a stable apt source during the Ubuntu 26.04 latest-image rollout.
    # Keep real Chromium installation, preflight and all browser tests required.
    runs-on: ubuntu-24.04
    env:
      # Absolute and workspace-rooted so browser installation stays
      # discoverable even though the pytest test harness rewrites `HOME` to a
      # fresh temporary directory for most individual tests.
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.7.22"

      - name: Sync dependencies with uv
        run: |
          uv sync --locked --dev --extra test

      - name: Install Playwright Chromium
        run: |
          uv run playwright install --with-deps chromium

      - name: Preflight - verify a real headless Chromium launches
        run: |
          uv run python scripts/browser_preflight.py

      - name: Run browser-marked tests
        env:
          # Turn tests/support/browser_launch.py's environment-tolerant
          # `pytest.skip(...)` fallback into a hard failure here: a missing or
          # broken browser must fail this check, never report success by
          # skipping the tests it exists to run.
          AUTO_CODER_REQUIRE_BROWSER: "1"
        run: |
          uv run pytest -m browser -vv

      - name: Upload browser test diagnostics
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-test-diagnostics-${{ github.run_attempt }}
          path: |
            htmlcov/
            .pytest_cache/
          if-no-files-found: ignore
