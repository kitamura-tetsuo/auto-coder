name: Promote Release

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release-channel
  cancel-in-progress: false

jobs:
  promote-current-beta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Validate and promote current beta without rebuilding
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          DIGEST=$(docker buildx imagetools inspect "$IMAGE:beta" --format '{{json .Manifest.Digest}}' | tr -d '"')
          SOURCE_SHA=$(docker buildx imagetools inspect "$IMAGE:beta" --format '{{json .Image}}' | jq -er '.config.Labels["org.opencontainers.image.revision"]')
          python scripts/deployment_artifacts.py require-release-sha "$SOURCE_SHA"

          TESTED_DIGEST=$(docker buildx imagetools inspect "$IMAGE:tested-beta-$SOURCE_SHA" --format '{{json .Manifest.Digest}}' | tr -d '"')
          python scripts/deployment_artifacts.py require-tested-beta "$DIGEST" "$TESTED_DIGEST"

          if HISTORY_DIGEST=$(docker buildx imagetools inspect "$IMAGE:release-$SOURCE_SHA" --format '{{json .Manifest.Digest}}' 2>/dev/null | tr -d '"'); then
            python scripts/deployment_artifacts.py require-release-history "$DIGEST" "$HISTORY_DIGEST"
          else
            docker buildx imagetools create --prefer-index=false --tag "$IMAGE:release-$SOURCE_SHA" "$IMAGE@$DIGEST"
            HISTORY_DIGEST=$(docker buildx imagetools inspect "$IMAGE:release-$SOURCE_SHA" --format '{{json .Manifest.Digest}}' | tr -d '"')
            python scripts/deployment_artifacts.py require-release-history "$DIGEST" "$HISTORY_DIGEST"
          fi

          docker buildx imagetools create --prefer-index=false --tag "$IMAGE:release" "$IMAGE@$DIGEST"
          RELEASE_DIGEST=$(docker buildx imagetools inspect "$IMAGE:release" --format '{{json .Manifest.Digest}}' | tr -d '"')
          python scripts/deployment_artifacts.py require-release-postcondition "$DIGEST" "$RELEASE_DIGEST"
