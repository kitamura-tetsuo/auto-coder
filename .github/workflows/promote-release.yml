name: Promote Release

on:
  workflow_dispatch:
    inputs:
      memo:
        description: Optional operator memo preserved in the release catalog
        required: false
        default: ""
        type: string

permissions:
  contents: write
  actions: read
  packages: write

concurrency:
  group: release-channel
  cancel-in-progress: false

jobs:
  promote-current-beta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Promote and publish the immutable catalog entry
        env:
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.RELEASE_CATALOG_TOKEN || secrets.GITHUB_TOKEN }}
          PROMOTION_MEMO: ${{ inputs.memo }}
        run: |
          set -Eeuo pipefail
          uv run auto-coder deployment promote-release \
            --repository "${{ github.repository }}" \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}"
