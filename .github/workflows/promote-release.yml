name: Promote Release

on:
  workflow_dispatch:
    inputs:
      digest:
        description: Existing tested beta manifest digest (sha256:...); use an older digest to roll back
        required: true

permissions:
  contents: read
  packages: write

jobs:
  promote-existing-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate and promote without rebuilding
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ inputs.digest }}
        run: |
          case "$DIGEST" in sha256:[0-9a-f][0-9a-f]*) ;; *) echo "Invalid digest" >&2; exit 2;; esac
          docker buildx imagetools inspect "$IMAGE@$DIGEST"
          docker buildx imagetools create --tag "$IMAGE:release" "$IMAGE@$DIGEST"
          test "$(docker buildx imagetools inspect "$IMAGE:release" --format '{{json .Manifest.Digest}}' | tr -d '"')" = "$DIGEST"
