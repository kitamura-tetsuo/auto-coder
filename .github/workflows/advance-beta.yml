name: Advance Beta

on:
  workflow_run:
    workflows: [Publish Beta]
    types: [completed]

permissions:
  actions: read
  contents: read
  packages: write

concurrency:
  group: advance-beta-channel
  cancel-in-progress: false

jobs:
  advance-latest-successful:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Reject an out-of-order older successful run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -Eeuo pipefail
          LATEST_SUCCESSFUL_RUN=$(gh api "repos/${{ github.repository }}/actions/workflows/publish-beta.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].id')
          python scripts/deployment_artifacts.py require-latest-successful-run "$RUN_ID" "$LATEST_SUCCESSFUL_RUN"
          DIGEST=$(python scripts/deployment_artifacts.py inspect-digest "$IMAGE:sha-$SOURCE_SHA")
          docker buildx imagetools create --tag "$IMAGE:tested-beta-$SOURCE_SHA" "$IMAGE@$DIGEST"
          docker buildx imagetools create --tag "$IMAGE:beta" "$IMAGE@$DIGEST"
