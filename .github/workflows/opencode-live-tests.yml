name: OpenCode Live Tests

'on':
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  opencode-live-tests:
    name: OpenCode Live Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Sync dependencies with uv
        run: |
          uv sync --dev --extra test

      - name: Install pinned OpenCode CLI
        run: |
          npm install -g opencode-ai@1.18.31

      - name: Run opencode_live-marked tests
        run: |
          uv run pytest -m opencode_live -vv

      - name: Upload OpenCode live test diagnostics
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: opencode-live-test-diagnostics-${{ github.run_attempt }}
          path: |
            htmlcov/
            .pytest_cache/
          if-no-files-found: ignore
