name: OpenCode Live Tests

'on':
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  opencode-live-tests:
    name: OpenCode Live Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Sync dependencies with uv
        run: |
          uv sync --dev --extra test

      - name: Install pinned OpenCode CLI
        run: |
          npm install -g opencode-ai@1.18.31

      - name: Block the models.dev catalog fetch for deterministic config-only providers
        run: |
          echo "0.0.0.0 models.opencode.ai" | sudo tee -a /etc/hosts

      - name: Diagnose config-only provider resolution directly
        run: |
          set -x
          mkdir -p /tmp/diag-home/.config/opencode /tmp/diag-repo
          cd /tmp/diag-repo && git init -q && git config user.email t@t.com && git config user.name t && git commit -q --allow-empty -m init
          cat > /tmp/diag-home/.config/opencode/opencode.json <<'EOF'
          {
            "$schema": "https://opencode.ai/config.json",
            "provider": {
              "fakeprov": {
                "npm": "@ai-sdk/openai-compatible",
                "options": {"baseURL": "http://127.0.0.1:9999/v1"},
                "models": {"fake-model": {"name": "fake-model", "tool_call": true, "cost": {"input": 0, "output": 0}, "limit": {"context": 128000, "output": 8192}}}
              }
            }
          }
          EOF
          echo "::group::opencode debug config"
          HOME=/tmp/diag-home opencode debug config --print-logs --log-level DEBUG 2>&1 || true
          echo "::endgroup::"
          echo "::group::whoami/env"
          whoami
          echo "HOME=$HOME"
          echo "npm_config_prefix=$(npm config get prefix 2>&1)"
          node -e "console.log(process.version)"
          echo "::endgroup::"
        continue-on-error: true

      - name: Run opencode_live-marked tests
        env:
          AUTOCODER_OPENCODE_GIT_DEBUG_LOG: ${{ github.workspace }}/opencode-git-debug.log
          AUTOCODER_OPENCODE_VERBOSE_DEBUG: "1"
        run: |
          uv run pytest -m opencode_live -vv

      - name: Print git-wrapper debug log (non-read-only decisions only)
        if: always()
        run: |
          echo "::group::opencode-git-debug.log (deny / allow-unprotected-target only)"
          grep -v '"decision": "allow-read-only"' opencode-git-debug.log 2>/dev/null || echo "(no non-read-only decisions logged)"
          echo "::endgroup::"

      - name: Upload OpenCode live test diagnostics
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: opencode-live-test-diagnostics-${{ github.run_attempt }}
          path: |
            htmlcov/
            .pytest_cache/
            opencode-git-debug.log
          if-no-files-found: ignore
