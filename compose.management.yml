services:
  management:
    image: ${AUTO_CODER_IMAGE}@${MANAGEMENT_DIGEST}
    entrypoint: ["python", "-m", "auto_coder.management.bootstrap_supervisor"]
    command: ["--config", "/bootstrap/config.json"]
    init: false
    restart: unless-stopped
    stop_grace_period: 30m
    environment:
      PYTHONUNBUFFERED: "1"
      AUTO_CODER_WORKER_REGISTRY: >-
        {"workers":[
          {"target_id":"release-worker","supervisor_instance_id":"release-worker","channel":"release","repository":"${RELEASE_REPOSITORY:?Release repository is required}","bridge_address":"${RELEASE_WORKER_BRIDGE_ADDRESS:?Release private address is required}","bridge_port":${RELEASE_WORKER_BRIDGE_PORT:?Release private port is required},"bridge_secret_file":"/run/secrets/release_worker_bridge"},
          {"target_id":"beta-worker","supervisor_instance_id":"beta-worker","channel":"beta","repository":"${BETA_REPOSITORY:?Beta repository is required}","bridge_address":"${BETA_WORKER_BRIDGE_ADDRESS:?Beta private address is required}","bridge_port":${BETA_WORKER_BRIDGE_PORT:?Beta private port is required},"bridge_secret_file":"/run/secrets/beta_worker_bridge"},
          {"target_id":"beta-agent-table-worker","supervisor_instance_id":"beta-agent-table-worker","channel":"beta","repository":"kitamura-tetsuo/agent-table","bridge_address":"${BETA_AGENT_TABLE_WORKER_BRIDGE_ADDRESS:?Agent Table private address is required}","bridge_port":${BETA_AGENT_TABLE_WORKER_BRIDGE_PORT:?Agent Table private port is required},"bridge_secret_file":"/run/secrets/beta_agent_table_worker_bridge"}
        ]}
    secrets:
      - release_worker_bridge
      - beta_worker_bridge
      - beta_agent_table_worker_bridge
      - source_evidence_read
    networks:
      default: {}
      management_private: {}
    volumes:
      - ./runtime/management/bootstrap:/bootstrap:ro
      - ./runtime/management/child-state:/management-child-state
      - ./runtime/management/oauth:/management-oauth
      - ./runtime/management/operations:/management-operations
      - ./runtime/management/policy:/management-policy:ro
      - ./runtime/management/versions:/management-versions:ro
    ports:
      - "127.0.0.1:${MANAGEMENT_PORT}:${MANAGEMENT_PORT}"
    # Deliberately no Docker socket, privileged mode, or worker runtime mounts.

secrets:
  release_worker_bridge:
    file: ${RELEASE_WORKER_BRIDGE_SECRET_FILE:?Release credential file is required}
  beta_worker_bridge:
    file: ${BETA_WORKER_BRIDGE_SECRET_FILE:?Beta credential file is required}
  beta_agent_table_worker_bridge:
    file: ${BETA_AGENT_TABLE_WORKER_BRIDGE_SECRET_FILE:?Agent Table credential file is required}
  source_evidence_read:
    file: ${AUTO_CODER_SOURCE_EVIDENCE_TOKEN_FILE:?Read-only source-evidence credential file is required}

networks:
  default: {}
  management_private:
    external: true
    name: ${AUTO_CODER_PRIVATE_NETWORK:?Existing private Docker network is required}

