- description: Aggregate no-application purpose has no normative owner
  vars: &base
    parent_implemented_independently: false
    parent_specification: '{"issue_number":1856,"title":"Preview","requirements":[{"requirement_id":"REQ-001","text":"Coordinate projection and presentation."}]}'
    direct_child_specifications: '[{"issue_number":1857,"title":"Projection","requirements":[{"requirement_id":"REQ-001","text":"Apply the draft, capture its projection, and return that projection."}]},{"issue_number":1858,"title":"Presentation","requirements":[{"requirement_id":"REQ-001","text":"Present the supplied projection."}]}]'
    objective_evidence: '[{"issue_number":1856,"state":"ANCHORED","original_text":"Preview a draft without applying it.","source_identity":"issue:1856:creation:v1","current":{"status":"PRESENT","text":"Preview a draft without applying it."}},{"issue_number":1857,"state":"ANCHORED","original_text":"Produce a draft projection.","source_identity":"issue:1857:creation:v1","current":{"status":"PRESENT","text":"Produce a draft projection."}},{"issue_number":1858,"state":"ANCHORED","original_text":"Present a supplied projection.","source_identity":"issue:1858:creation:v1","current":{"status":"PRESENT","text":"Present a supplied projection."}}]'
    durable_decomposition_baseline: (none)
    prior_applied_decomposition_outcomes: (none)
  assert:
    - type: is-json
    - type: javascript
      value: |
        const r = JSON.parse(output); const f = r.findings?.find(x => x.category === 'objective_conflict');
        return r.verdict === 'BLOCKED' && f && /without applying it/.test(f.explanation) && f.affected_issues.some(x => x.issue_number === 1856 && x.requirement_ids.length === 0);

