    direct_child_specifications: '[{"issue_number":1857,"title":"Projection","requirements":[{"requirement_id":"REQ-001","text":"Load the stored draft and return its projection without applying or writing it to live state."}]},{"issue_number":1858,"title":"Presentation","requirements":[{"requirement_id":"REQ-001","text":"Present exactly the projection supplied by child 1857."}]}]'
    objective_evidence: '[{"issue_number":1856,"state":"ANCHORED","original_text":"Preview a stored draft without applying it.","source_identity":"issue:1856:creation:v1","current":{"status":"PRESENT","text":"Preview a stored draft without applying it."}},{"issue_number":1857,"state":"ANCHORED","original_text":"Produce a projection from a stored draft.","source_identity":"issue:1857:creation:v1","current":{"status":"PRESENT","text":"Produce a projection from a stored draft."}},{"issue_number":1858,"state":"ANCHORED","original_text":"Present a supplied projection.","source_identity":"issue:1858:creation:v1","current":{"status":"PRESENT","text":"Present a supplied projection."}}]'
  assert:
    - type: is-json
    - type: javascript
      value: |
        const r = JSON.parse(output); return r.verdict === 'READY' && r.remediation === 'NONE' && r.findings.length === 0;

