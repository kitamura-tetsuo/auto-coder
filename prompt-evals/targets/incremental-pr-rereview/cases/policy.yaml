tests:
- vars:
    id: fixed-original-oracle-converges
    title: Original production-boundary oracle is now protected
    requirement: ReviewController.validate must enforce the authorization guard, and committed regression coverage must exercise
      that production boundary.
    prior_gap_status: OPEN
    prior_resolution_evidence: ''
    scope_context: 'The fixed Objective is to preserve authorization validation. REQ-001 is the sole implementation contract.

      '
    current_evidence: 'The current patch retains the authorization guard and adds a committed regression that enters through
      ReviewController.validate, attempts an unauthorized operation, and proves rejection and unchanged durable state.

      '
    review_demand: (No claimed-addressed review threads for this run.)
  assert:
  - type: is-json
  - type: javascript
    value: const r=JSON.parse(output); const gaps=r.test_oracle_gaps||[]; return r.result==='PASS' && (r.findings||[]).length===0
      && gaps.length===1 && gaps[0].gap_id==='TOG-original-oracle' && gaps[0].status==='RESOLVED' && Boolean(gaps[0].resolution_evidence);
- vars:
    id: unrelated-variant-and-parent-demand-are-not-blockers
    title: Unrelated reviewer expansion after the original oracle was fixed
    requirement: ReviewController.validate must enforce the authorization guard, and committed regression coverage must exercise
      that production boundary.
    prior_gap_status: RESOLVED
    prior_resolution_evidence: tests/test_review_controller.py exercises the exact production authorization boundary and proves
      rejection with unchanged state.
    scope_context: 'The fixed Objective is to preserve authorization validation. REQ-001 is the sole implementation contract.
      A parent tracking issue mentions a future audit-export feature only as coordination context.

      '
    current_evidence: 'The authorization guard and its exact production-boundary regression are unchanged. This correction
      does not touch audit export or alternate batch variants, and current evidence shows no violation of REQ-001.

      '
    review_demand: 'A reviewer suggests additionally testing an unrelated batch variant and implementing the parent issue''s
      future audit-export feature.

      '
  assert:
  - type: is-json
  - type: javascript
    value: const r=JSON.parse(output); const blocking=(r.test_oracle_gaps||[]).filter(g=>g.status==='OPEN'); return r.result==='PASS'
      && (r.findings||[]).length===0 && blocking.length===0;
- vars:
    id: correction-induced-material-defect-blocks
    title: Corrective diff removes the required production guard
    requirement: ReviewController.validate must enforce the authorization guard, and committed regression coverage must exercise
      that production boundary.
    prior_gap_status: RESOLVED
    prior_resolution_evidence: tests/test_review_controller.py previously exercised the exact production authorization boundary.
    scope_context: 'The fixed Objective is to preserve authorization validation. REQ-001 is the sole implementation contract.

      '
    current_evidence: 'The corrective diff deletes the authorization check from ReviewController.validate. An unauthorized
      caller now reaches the durable mutation and changes state. The changed test replaces the unauthorized production-boundary
      case with an authorized happy-path assertion, so it remains green while this exact REQ-001 behavior is violated.

      '
    review_demand: (No claimed-addressed review threads for this run.)
  assert:
  - type: is-json
  - type: javascript
    value: const r=JSON.parse(output); const findings=r.findings||[]; return r.result==='NEEDS_FIX' && findings.length>0 &&
      findings.some(f=>(f.requirement_ids||[f.requirement_id]).includes('REQ-001') && /authorization|unauthorized/i.test(JSON.stringify(f)));
