    behavior:
      - "Timer-driven and PR-woken producer maintenance performs update and Jules-session housekeeping without pulling, resetting, checking out, cleaning, merging, rebasing, cherry-picking, or otherwise repairing the monitored checkout."
      - "An idle daemon preserves branch or detached-HEAD identity, HEAD, index, tracked edits, untracked files, and an external in-progress Git operation across recurring maintenance intervals."
      - "Checkout synchronization remains inside explicit Issue and PR branch-processing boundaries: BranchManager uses switch_to_branch(..., pull_after_switch=True), and checkout, origin branch pull, or branch-verification failure makes branch entry fail."

## Strong-Model Adversarial Validation Before PR Merge

  adversarial_validation_before_merge:
    description: "Executes a strong-model adversarial review on green PRs to falsify the implementation against the issue specification oracle and trigger corrective regression fixes before merge."
    implementation: |
      run_adversarial_validation, parse_adversarial_validation_response,
      build_adversarial_validation_context, extract_changed_test_files,
      format_adversarial_validation_comment in src/auto_coder/adversarial_validator.py,
      _handle_pr_merge, _get_adversarial_validation_eligibility,
      _get_codex_review_state in src/auto_coder/pr_processor.py,
      resolve_issue_oracles, get_linked_issues_context in src/auto_coder/issue_context.py,
      get_pr_changed_file_count in src/auto_coder/util/gh_cache.py,
      create_adversarial_validation_backend_manager in src/auto_coder/cli_helpers.py,
      backend_adversarial_validation in src/auto_coder/llm_backend_config.py
    configuration:
      - "[backend_adversarial_validation]: Configures order / default / model for the strong adversarial reviewer in ~/.auto-coder/llm_config.toml."
      - "ENABLE_ADVERSARIAL_VALIDATION / pr_adversarial_validation (AutomationConfig): Toggle feature on/off (default: True, overridable via AUTO_CODER_ENABLE_ADVERSARIAL_VALIDATION env var or pr_adversarial_validation setting)."
      - "MAX_ADVERSARIAL_VALIDATIONS / [adversarial_validation].max_reviews (AutomationConfig): Specifies maximum adversarial review executions for a PR (default: None for unlimited, overridable via AUTO_CODER_MAX_ADVERSARIAL_VALIDATIONS env var). When reached on a green PR, adversarial validation is skipped and PR proceeds to merge."
    behavior:
      - "Runs after normal CI / GitHub Actions checks are green and before merge eligibility."
      - "Maximum Adversarial Reviews Gating: When MAX_ADVERSARIAL_VALIDATIONS (or [adversarial_validation].max_reviews) is configured and the PR has reached or exceeded that count of adversarial review runs, further validation is skipped and the green PR proceeds directly to merge."
      - "Issue Eligibility: Eligibility and validation context share one verified-oracle resolver for candidates found in PR body, title, or branch metadata. A PR with no candidate Issue is outside validation scope and continues through other merge requirements without a validation result. A candidate that is missing, unavailable, or resolves to another PR fails closed instead of being treated as intentionally Issue-less."
      - "Codex Review Ordering: For Issue-backed PRs, a Codex GitHub review summary from chatgpt-codex-connector[bot] must reach Code Review / Completed before adversarial validation starts. A summary that is still running defers the PR to a later processing iteration without a fixed delay. Comment lookup uses a strict, cache-revalidated REST path so API failures or stale cached summaries cannot be mistaken for absent/completed review activity."
      - "Optional Codex Stage: If no Codex review summary exists, adversarial validation runs normally. A Completed summary is sufficient even without a +1 reaction and regardless of whether its reviewed commit differs from the current head."
      - "Review Feedback Ordering: Strict tri-state review-thread checks prevent adversarial validation and merge until actionable feedback is resolved. A review-thread API error is distinct from an empty thread list and fails closed. After observing a Completed Codex summary, Auto-Coder performs a fresh second thread check before starting adversarial validation, closing the completion/finding TOCTOU window; validation remains pinned to the current PR head."
      - "Changed-Head Finding Revalidation: An unresolved finding published by the authenticated adversarial-reviewer App for an older head remains merge-blocking but does not prevent independent validation of a current head that has no applicable verdict, even when the configured adversarial-review count limit has been reached. Reviewer identity matching is case-insensitive and treats the App slug and its trailing [bot] login form as equivalent, so GraphQL thread authors match the authenticated reviewer identity. Revalidation does not require an implementation-agent reply or commit attribution, and only an ADDRESSED disposition validated against the still-current exact head may resolve the old thread; unchanged heads retain feedback-delivery deduplication and ordinary unresolved-thread gating."
      - "Fail-Closed Design: PASS is only produced for an explicitly parsed, internally consistent PASS with 0 blocking findings; all empty, malformed, contradictory, or inconclusive responses block PR merge."
      - "Parse Failure Diagnostics: Empty responses, invalid JSON, schema violations, contradictions, and unrecognized formats remain fail-closed and are logged with PR/attempt/backend/model context, a redacted 2,000-character preview, and the structured LLM interaction-log path."
      - "Review Anchor Boundary: Anchor lines are positive JSON integers or null. Positive decimal strings from an LLM are normalized to integers, while booleans, non-positive values, fractions, and malformed strings produce a structured schema ERROR. Validation execution and parse errors remain processing errors, and any published COMMENT is identified as an error diagnostic rather than a successful adversarial review."
      - "Full Effective Response Retention: The structured LLM interaction log retains the redacted combined CLI response (stdout and stderr), while normal operational and trace logs remain bounded."
      - "PR Result Publishing and Versioned SHA Deduplication: Publishes the parsed validation status, summary, structured findings, requested dynamic check, and parse diagnostic to the PR conversation for the exact validator version and validated head SHA. Before invoking the reviewer, Auto-Coder reads that durable comment: the same SHA is not sent to the same validator version again, a saved PASS proceeds to merge checks, and a saved non-PASS remains blocked until the PR head or validator version changes, except that a new material reply to an unresolved change-provenance clarification makes the same SHA eligible for independent revalidation. The exact clarification discussion is fingerprinted in the resulting review so unchanged replies do not repeatedly rerun validation. Failure to read prior comments fails closed without invoking the LLM. Raw CLI event streams are excluded from every comment field, individual fields are bounded, requirement coverage is summarized by status with bounded non-passing IDs, and oversized reports are bounded globally. Codex uses its dedicated final-message output for the validator response, while compatibility JSONL parsing consumes stdout only. If a nested container cannot start Codex's read-only bwrap sandbox, a non-LLM preflight enables a no-approval fallback only inside the disposable detached validation worktree."
      - "Implementer Change-Provenance Clarification: When every applicable Issue requirement is VERIFIED or justified IRRELEVANT but the reviewer cannot establish why one or more material changed files or related groups belong to the PR, the result is an INCONCLUSIVE clarification blocker rather than an Issue requirement violation. The authoritative review publishes exactly one aggregated thread listing all unexplained groups and asks whether each is directly intentional, mechanically generated from an intentional change, or unrelated/accidental, including the causal reason for intentional/generated changes. Publication prefers a supported nested-review line anchor on an unexplained file, falls back to any represented changed-file line, and uses the dedicated reviewer App's separate file-level review-comment endpoint when binary, large, or unsupported diffs expose no line anchor. An unanswered thread blocks PASS and merge without requesting code changes or a new commit and is not duplicated on unchanged processing. A material marked reply enables same-SHA revalidation; the reply remains an unverified navigation aid, and the reviewer must independently verify it against repository evidence. Verified provenance can resolve the thread and allow same-SHA PASS. Resolution and verdict publication are recoverable as one transition: after an apparent App publication failure, Auto-Coder first re-reads the authoritative fingerprinted verdict and keeps the thread resolved if the expected result is already durable; otherwise it reopens the thread, with failed reopen attempts durably recorded for startup reconciliation. If delayed visibility exposes a saved PASS only on the next cycle while the provenance thread is unresolved, that PASS forces same-SHA revalidation and resolution instead of bypassing the thread gate. A STILL_VALID or INCONCLUSIVE disposition remains non-PASS and publishes its concrete rationale and evidence both in the existing clarification thread and in the authoritative review summary; both publications use the dedicated reviewer GitHub App identity and never fall back to the ordinary GitHub credential. Accidental or contradicted changes are explicitly identified for removal or correction."
      - "Dedicated GitHub App Review Publishing: Fresh validation verdicts are published as native reviews from the separately configured auto-coder-reviewer GitHub App, pinned to the validated head SHA. PASS maps to APPROVE, NEEDS_FIX maps to REQUEST_CHANGES, and other outcomes map to COMMENT. Authentication, head-race, or publication failures block further processing without falling back to the normal user credential."
      - "Codex Structured Output Handling: For no-edit `codex --json` reviewers, requests the final assistant payload through Codex's dedicated `--output-last-message` file while retaining the JSONL stdout and stderr diagnostics in the full interaction log. If no final payload is written, strict JSONL parsing remains the compatibility fallback; failed, incomplete, or contaminated fallback streams remain blocked."
      - "Codex Usage-Limit Diagnostics: Successful Codex JSONL item payloads are reviewer evidence and are excluded from usage-marker detection, preventing source code or command output containing phrases such as `usage limit` from causing false backend rotation. Explicit top-level error events and stderr diagnostics remain eligible limit signals."
      - "Single-PR Metadata Completeness: REST PR normalization retains nested head/base refs and SHAs plus author identity, so `process-issues --only <PR>` uses the same merge and isolated-worktree validation inputs as normal candidate enumeration."
      - "Oracle Acquisition Required for Eligible PRs: An Issue-backed PR fails closed (BLOCKED) if its linked specification or acceptance criteria cannot be acquired after validation starts; an intentionally Issue-less PR is skipped rather than assigned a validation status."
      - "Backend Independence: Uses independently configured strong model without silently falling back to the general implementation backend."
      - "File-Aware Bounded Evidence: Fetches the authoritative changed-file count independently from raw diff evidence. PRs with more than 300 changed files require human review and are BLOCKED from automatic merge; a missing authoritative count also fails closed. For PRs within that limit, splits diffs by file, prioritizes complete small patches so an early large file cannot make later implementation or test files invisible, and enforces a hard evidence-size limit. A count mismatch remains explicit unverified evidence. The complete internal unverified-file set is represented in bounded prompts by its count, SHA-256 digest, and path sample. Git C-style quoted paths are decoded, while unparseable headers fail closed."
      - "Explicit Issue Contract: A directly linked Issue with a Markdown heading exactly named Requirements uses only valid REQ-NNN entries in that section as its normative manifest. Requirement IDs may be plain text or Markdown inline code, including a colon inside or immediately after the backticks. Source IDs and text are preserved, with #issue/REQ-NNN disambiguation when linked Issues reuse an ID. Parent Issues and all prose outside that section remain reviewer context only. Duplicate, malformed, or empty explicit contracts fail closed; an Issue without the section uses legacy extraction on its direct body only, and prompts identify explicit, legacy, or mixed manifest mode."
      - "Coverage-Gated PASS: Every authoritative manifest entry receives the existing fail-closed coverage treatment. Reviewer output must provide a VERIFIED or justified IRRELEVANT coverage entry with evidence for every exact manifest ID; missing, duplicated, unknown, VIOLATED, or UNVERIFIED IDs prevent PASS regardless of any boolean completeness claim. Unknown IDs and VIOLATED entries without concrete findings fail closed as schema/contradiction ERRORs instead of being silently ignored or downgraded to finding-free INCONCLUSIVE. Every partial or unavailable per-file patch is also recorded explicitly, so a model PASS is deterministically converted to INCONCLUSIVE while any material file evidence or Issue requirement remains incomplete."
      - "Demonstrated-Finding Verdict Precedence: Only a counterexample classified DEMONSTRATED and referencing an exact stable ID from the deterministic Issue requirement manifest, with a reachable state/action path, required behavior, actual conflicting behavior, and implementation or focused dynamic-check evidence, is normalized to NEEDS_FIX. Unknown or invented finding IDs are rejected deterministically. Explicitly UNVERIFIED suspicions cannot be re-promoted by any top-level label (including PASS) and remain INCONCLUSIVE; coverage and infrastructure failures still fail closed."
      - "Independent Finding Lifecycle and Requirement Coverage: Requirement coverage is evaluated per stable Issue ID, while review-thread disposition is evaluated only against that thread's recorded concrete counterexample. Fixing one path resolves its thread even if another path keeps the same requirements VIOLATED; the new path receives a current finding, and an old finding is reopened only if its own counterexample regresses. Every demonstrated finding requires both a concrete root-defect identity and an independently actionable correction/test-oracle identity; omission fails schema validation closed. Grouping uses these structured identities rather than byte equality of reviewer prose, and preserves all requirement-specific path, evidence, contract, counterexample, and oracle descriptions. Equivalent sibling paths may share both identities only when their root failure, correction, and test oracle match and every affected path is enumerated; materially different corrections remain separate. Review summaries omit resolved dispositions but retain the current rationale and evidence for unresolved STILL_VALID and INCONCLUSIVE dispositions, because ordinary dispositions are not otherwise republished into their existing threads."
      - "Specification-Gap Separation: Material reachable behaviors that require a new policy absent from the authoritative linked Issue are represented as structured specification gaps, never findings or new verdicts. Defined requirements continue to receive complete coverage and retain verdict precedence; insufficient evidence for a defined behavior remains INCONCLUSIVE/BLOCKED rather than becoming a gap. Human-facing reviews distinguish gaps from defects, state that no policy was selected, and preserve neutral candidate options only as non-authoritative discussion."
      - "Specification-Gap Merge and Repair Gates: PASS may coexist with specification gaps, but automatic merge requires PASS, no findings, and no gaps. A gap-only PASS receives a COMMENT rather than an approval and remains manually mergeable. When findings coexist, normal repair continues while the repair prompt expressly forbids implementing candidate policies or mutating/creating Issues solely for a gap; durable same-SHA reports remain blocked from automatic merge."
      - "Convergent Incremental Rereview Policy: The initial review remains a broad, full-coverage, fail-closed falsification pass over the complete Issue contract. After NEEDS_FIX and a new head, the persistent reviewer classifies every prior blocker as fixed, still violated, or regressed; revalidates requirements affected by prior blockers, corrective changes, shared invariants, or potentially invalidated evidence; and inspects the corrective change for related regressions or symptom-masking workarounds. A previous VERIFIED or IRRELEVANT status may be carried forward only after confirming that the corrective changes do not invalidate its implementation, tests, scope, or other evidence; the rereview must emit every stable requirement ID again with evidence identifying the prior head and non-impact basis. Uncertain impact remains UNVERIFIED/INCONCLUSIVE. It does not restart unrestricted exploration: a newly noticed defect can block at any iteration only when supplied evidence demonstrates a reachable violation that is material to an explicit Issue requirement. Low-impact boundaries, speculative robustness, hardening opportunities, and test-only improvements do not restart the repair loop unless they meet that material standard."
      - "Bounded Adjacent-Counterexample Exploration: After confirming a violation, the reviewer examines at most eight additional candidate boundaries sharing its requirement, transition, lifecycle invariant, root cause, or authoritative-data boundary. It bundles independently demonstrated sibling cases by structured root/correction identity, distinguishes sibling manifestations from independent defects, and discards unsupported suspicions rather than turning them into blocking findings."
      - "Evidence Recovery and Scoped Uncertainty: Initially supplied patch evidence is a navigation hint rather than the decision authority. The reviewer makes at most eight explicit recovery attempts through current-repository inspection, current-PR retrieval, focused execution, or tests; records recovered, unavailable, and irrelevant evidence; and scopes each attempt to materially dependent requirement IDs. Independently recovered current-head evidence can satisfy file coverage. Every requirement left UNVERIFIED in an INCONCLUSIVE result must have its own scoped recovery attempt and decision-critical gap, while gaps for already VERIFIED or IRRELEVANT requirements are rejected and cannot satisfy another requirement's contract. INCONCLUSIVE is requested only after useful bounded recovery is exhausted and must name the smallest concrete decision-critical gap, while unaffected requirement coverage remains intact."
      - "Invariant-Oriented Repair: Corrective prompts require the implementation agent to repair the shared correctness invariant rather than only the example and to evaluate adjacent transitions, authoritative sources, restart/persistence, ambiguous provider results, ordering/races, and strict regression coverage."
      - "Dynamic-on-Suspicion Contract: Supports dynamic test execution when requested by the reviewer; failure or inability to execute dynamic checks fails closed."
      - "Exact-Head Dynamic Evidence: Requested adversarial checks execute directly in the detached validation worktree through its test script, with repository HEAD asserted before and after execution. A known SHA mismatch is a merge-blocking ERROR, an unverifiable SHA is INCONCLUSIVE, and neither kind of invalid evidence may resolve an existing material test-oracle gap or review thread."
      - "Material Gap/Thread Convergence: Trusted current-head evidence closes a persisted material test-oracle gap when either the validator explicitly returns the same scoped gap as RESOLVED/INVALID with resolution evidence or an exact representing review thread receives an evidence-backed ADDRESSED disposition. This includes same-head recovery after the thread was already resolved and excluded from claimed-thread classification. Proven semantic closure is persisted before thread resolution even when an unrelated provenance gate keeps the overall verdict INCONCLUSIVE. GitHub's resolved UI state alone is never closure evidence; persistence failure aborts validation before thread projection, leaving the prior OPEN checkpoint recoverable at the same head."
      - "Requires demonstrated, reachable behavioral counterexamples: `Given state S, when reachable action A occurs, then specification requires R, but implementation demonstrably produces X`; test gaps, hardening opportunities, and assumption-dependent suspicions do not independently block."
      - "When NEEDS_FIX is determined:"
        - "Blocks PR merge."
        - "Publishes the concrete findings to the PR conversation without checking out or modifying the local PR branch."
        - "For a PR associated with an existing Codex Cloud task, sends the complete bounded validation report to that task as a follow-up fix request. Delivery is recorded with a validator-version and head-SHA marker so a saved NEEDS_FIX result can be delivered after restart without being resent on every processing loop."
        - "For other PRs, the PR author or other recipient remains responsible for applying the correction. After a new commit and green CI, Auto-Coder validates the new head SHA and only merges after PASS."

## Cloud Implementation Agent Review-Thread Address-Without-Resolve Protocol

  review_thread_address_without_resolve:
    description: "When Auto-Coder delegates unresolved GitHub PR review-thread feedback to a cloud implementation agent, the agent must fix and explain, never resolve the thread itself; a later independent validation pass owns the resolve decision."
    implementation: |
      REVIEW_ADDRESSED_MARKER, reply_claims_review_addressed
      in src/auto_coder/review_feedback_marker.py,
      issue.action, pr.adversarial_validation_fix,
      codex_cloud.continuation, codex_cloud.ci_review_repair_details
      in src/auto_coder/prompts.yaml
    behavior:
      - "Applies to every prompt that delegates unresolved PR review feedback to a cloud implementation agent (issue-to-PR implementation, Codex Cloud continuation/CI-repair resumes, and the adversarial-validation fix-forward prompt), regardless of which reviewer authored the original finding (Codex GitHub review, Auto-Coder's adversarial reviewer, or any other automated or human reviewer)."
      - "Each of these prompts explicitly instructs the agent to inspect and address actionable review feedback but never to resolve, close, or otherwise mark the corresponding GitHub review thread as resolved; that decision is reserved for a later independent validation pass."
      - "For each thread the agent believes it has successfully addressed, it must reply directly in that same thread with a concise explanation of the implementation change and the validation/regression-test evidence, ending the reply with the stable, versioned marker `<!-- auto-coder-review-addressed:v1 -->` on its own line. The agent must add the marker only when it is actually confident the finding was corrected; if it cannot fix or verify a finding, it leaves the thread unresolved and omits the marker."
      - "Addressing one thread never implies any other unresolved thread was addressed; each claimed resolution is independent and must be posted to its own thread."
      - "`reply_claims_review_addressed()` in src/auto_coder/review_feedback_marker.py detects the marker via a versioned regex and never infers an addressed claim from unrestricted natural-language phrases such as 'fixed', 'done', or 'resolved' alone."
      - "This protocol only changes the cloud-agent instruction and the addressed-claim marker; it does not itself resolve threads, change the existing unresolved-review-thread merge gate, or decide whether a claimed-addressed reply is actually correct."

## Independent Review-Thread Completion Validation

  review_thread_completion_validation:
    description: "A fresh backend_adversarial_validation run also independently adjudicates any unresolved review thread an eligible automated reviewer authored and a cloud implementation agent explicitly claimed as addressed, and Auto-Coder resolves the thread only when that independent verdict, evidence, and the still-current PR head all confirm it."
    implementation: |
      ReviewThreadDisposition, VALID_REVIEW_THREAD_DISPOSITION_STATUSES,
      run_adversarial_validation(claimed_review_threads_section=...),
      parse_adversarial_validation_response (thread_dispositions parsing)
      in src/auto_coder/adversarial_validator.py,
      ClaimedReviewThread, ReviewThreadClassification, classify_review_threads,
      render_claimed_review_threads_section, resolve_addressed_review_threads,
      RESOLVER_EXPLANATION_MARKER
      in src/auto_coder/review_thread_validation.py,
      ClaimedReviewThreadGateState, _resolve_eligible_review_thread_ids,
      _get_claimed_review_thread_state
      in src/auto_coder/pr_processor.py,
      ReviewThreadComment, ReviewThread.comments, resolve_review_thread,
      reply_to_review_thread in src/auto_coder/util/gh_cache.py,
      pr.adversarial_validation ($claimed_review_threads, thread_dispositions
      output schema) in src/auto_coder/prompts.yaml
    configuration:
      file: "~/.auto-coder/config.toml or repository-scoped config.toml"
      example: |
        [github]
        pr_review_allowlist = [199175422, 123456789]
    behavior:
      - "Before the merge-gate unresolved-review-thread check skips validation, Auto-Coder fetches every review thread with its full comment list (stable numeric author identity ID, informational login, and body) via GraphQL and classifies each unresolved thread: a thread counts as 'claimed' only when its root author's stable identity ID is in the effective repository-scoped `[github].pr_review_allowlist` AND at least one reply carries the `auto-coder-review-addressed:v1` marker. Login and display-name strings never influence authorization. Missing, malformed, unconfigured, empty, or non-allowlisted identity data fails closed to an ordinary unresolved blocker."
      - "`[github].pr_review_allowlist` accepts only positive integer GitHub identity IDs; strings, booleans, zero, negative values, and other malformed values raise configuration validation errors instead of being coerced. Repository-specific config lists replace the global list through the standard partial-override precedence."
      - "When every unresolved thread is claimed (or there are none), merge processing proceeds to a fresh adversarial validation run instead of being skipped; the run's prompt includes a 'Claimed-Addressed Review Threads' section listing each claimed thread's ID, original finding (the root comment), and full chronological discussion (including the implementation agent's rationale)."
      - "Adversarial-validation response parsing supports both Codex JSONL events and Claude CLI stream-json events. Claude streams must begin with system/init and contain exactly one successful terminal result; malformed, truncated, or failed streams fail closed without treating event metadata as the validator verdict."
      - "Every PR-processing entry point uses the same claimed-aware merge transition workflow. A quick/single-PR pass cannot bypass independent validation or re-delegate claimed-addressed threads, and when claimed and ordinary unresolved threads coexist only the ordinary blockers are included in repair delegation."
      - "The validator returns one independent disposition per claimed thread in a `thread_dispositions` list: `ADDRESSED` (the original defect is demonstrably gone on the current head), `STILL_VALID` (it remains), or `INCONCLUSIVE` (the evidence cannot establish either safely). The prompt explicitly forbids deriving ADDRESSED merely from the implementation agent's claim, a GitHub `outdated` state, a moved/deleted diff line, a passing test alone, or a pushed commit alone; every disposition requires a concrete rationale and evidence grounded in the current implementation."
      - "Thread dispositions are parsed leniently and independently of the PR-level verdict: a malformed or incomplete entry is dropped (logged) without failing the PR-level PASS/NEEDS_FIX/INCONCLUSIVE/BLOCKED result, and a thread may be ADDRESSED while the PR itself is NEEDS_FIX for an unrelated defect, or vice versa."
      - "Resolution is fail-closed end to end (`resolve_addressed_review_threads`): it acts only on dispositions whose status is exactly ADDRESSED, ignores an ADDRESSED disposition for any thread ID that was not among this run's claimed threads, re-fetches the PR's current head SHA and refuses to resolve anything if it no longer equals the validated head, then for each remaining thread first posts a resolver explanation reply (marked with `RESOLVER_EXPLANATION_MARKER`, distinguishable from the implementation agent's own addressed claim) and only calls the `resolveReviewThread` GraphQL mutation if that reply succeeded; a failed reply, a failed or unconfirmed resolve mutation, or a head-verification failure leaves that thread unresolved without affecting any other thread's resolution."
      - "Stale-resolution BLOCKER/CLEARED comments are authoritative only when their author matches the login proven by Auto-Coder's active GitHub credential; exact lookalike markers from humans or implementation agents are ignored. A resolved thread with a truncated comment list has incomplete latest-marker evidence regardless of which marker is visible, so merge processing fails closed without attempting an automatic unresolve from that partial page."
      - "Every resolution-time head comparison and stale-marker head comparison uses a strict direct REST lookup that bypasses the shared GitHub GET cache. A stale-marker scan that performs a head comparison repeats that authoritative lookup after scanning all threads and requires the same head SHA, so a push from H1 to H2 during the scan fails closed without mutation. A missing, malformed, failed, or changed authoritative lookup cannot validate a resolution or dismiss an H1 blocker."
      - "Before attempting a stale-resolution rollback, Auto-Coder durably records a fail-closed rollback-transition state. A later run reconciles that transition only when the strict GitHub lookup returns the exact thread once with an explicit boolean resolved state: an unresolved thread advances to marker cleanup without another unresolve, while a still-resolved thread retries rollback under the existing durable guard; missing, duplicate, malformed, or failed lookup evidence remains blocking. After confirmed rollback, a failed CLEARED-marker reply becomes marker-cleanup-only state, and if both that reply and cleanup-state persistence fail, the pre-mutation transition remains available for this reconciliation. Resolve and unresolve mutations are accepted only when GitHub returns the exact requested thread ID and the expected literal resolved state."
      - "`_merge_pr`'s existing pre-merge safeguard re-fetches the authoritative GitHub review-thread state after any resolution and before merging, so automatic merge proceeds only when no unresolved thread remains (claimed-but-unresolved threads included) and every other merge gate also passes."

## Selective Promptfoo prompt-regression CI

  selective_prompt_regression:
    description: "Provides selective, human-only advisory prompt evaluations without changing ordinary CI or repair decisions."
    implementation: |
      prompt-evals/registry.json, prompt-evals/run_prompt_evals.py,
      .github/workflows/prompt-regression.yml,
      .github/workflows/prompt-regression-report.yml
    behavior:
      - "The active Prompt Regression (Advisory) workflow runs on pull-request opened, synchronize, and reopened events and on workflow_dispatch. It is separate from PR Tests and must never be configured as a required check. Before activation, an authorized operator must recheck branch protection and rulesets and remove any legacy prompt-regression required context; this repository does not mutate those server-side controls or bypass permissions. Deploy the controller-side advisory isolation first, then activate these workflows."
      - "The versioned registry associates stable target IDs with dot-addressable production prompt dependencies, target-local Promptfoo configuration, and corpus globs."
      - "CI compares dependency values between the pull request base and head, so independent prompt changes select only their targets while a declared shared dependency selects all and only its dependents."
      - "Target config and corpus changes select their owner; selector, registry, and either active evaluation/reporting workflow change selects every target, while unrelated changes select none and malformed selection metadata fails closed."
      - "No selected target and selected targets with no executable cases are NOT_RUN with a reason before credentials or Promptfoo are needed. Fork PRs are also NOT_RUN because provider credentials are never exposed to untrusted PR content; selected nonempty same-repository work with missing credentials is ERROR."
      - "PASS requires at least one fully completed case and all assertions passing; complete semantic failures are MISMATCH; selection, preparation, authentication, provider, transport, timeout, cancellation, runner, parsing, missing-result, and partial-execution failures are ERROR; intentional absence is NOT_RUN. ERROR takes precedence over partial semantic evidence. The direct runner keeps nonzero exits for MISMATCH and operational errors."
      - "PR runs evaluate the event's exact base/head commits. Manual workflow_dispatch accepts optional base and head refs, defaults head to the dispatched revision and base to that resolved head's first parent, and fails rather than substituting another revision. Reports include both full SHAs and upstream run/attempt identity."
      - "Every terminated evaluation is followed by the trusted Prompt Regression Advisory Report workflow. Actions summaries and the prompt-regression-report artifact retain structured outcomes and evidence. Authoritatively associated MISMATCH/ERROR attempts receive one immutable top-level github-actions[bot] PR comment per upstream run attempt; PASS/NOT_RUN-only attempts do not. Delivery denial or uncertainty is diagnostic only and is not blindly retried."
      - "The report marker and identity bind repository, PR, head SHA, upstream run ID/attempt, and evaluation workflow path. Reporting runs only default-branch code with a write token, validates GitHub API provenance and destination, and treats downloaded report/model values solely as display data; evaluation itself has contents-read permission only."
      - "Promptfoo and its Node tooling remain isolated in CI and are not Auto-Coder application dependencies."

## Provider-aware unresolved review repair

Actionable unresolved review threads keep merge blocked and are routed through the
provider-aware durable `cloud.csv` association to the existing originating cloud
session. Jules and Codex Cloud therefore receive repair feedback through the same
`CloudTaskClientBase.send_followup` contract, targeting the existing PR and its
current head branch, fetched from a cache-bypassing authoritative GitHub lookup
immediately before transport. Per-finding local and PR-side receipts prevent
redelivery, while new findings remain eligible. A durable pending reservation is
written before transport; if an accepted request cannot be confirmed in either
receipt store, later runs suppress speculative duplicate delivery and report the
indeterminate state explicitly. Provenance-clarification threads remain excluded.
Missing or ambiguous ownership, unsupported providers, rejected requests, and
transport failures produce an explicit failed processing outcome rather than a
successful defer.

## Durable GitHub Entity Invalidations

  durable_github_entity_invalidations:
    description: "Coalesces webhook notifications into durable authoritative reevaluations keyed by GitHub entity identity."
    implementation: |
      DurableInvalidationQueue, EntityIdentity in src/auto_coder/entity_invalidation.py,
      invalidate_entity, _enqueue_pending_invalidations, _worker_loop in src/auto_coder/automation_engine.py,
      process_github_payload in src/auto_coder/webhook_server.py
    behavior:
      - "Relevant webhook deliveries persist only repository, entity type (issue or pr), and entity number; payload snapshots are not queued as authority."
      - "Notifications received while an entity is dirty or waiting in the worker queue coalesce into its current generation; only a notification received after a worker begins processing advances the generation and forces one subsequent authoritative reevaluation."
      - "Dirty and in-flight records use SQLite durability. Startup recovers interrupted work before workers enter steady-state processing."
      - "A record is completed only after authoritative fetching and the resulting eligibility or processing decision; failures and cancellation return it to the dirty set."
      - "GitHub delivery identifiers are persisted for deduplication, preventing a redelivery from advancing the entity generation or causing duplicate processing by itself."
      - "Webhook arrival order never selects the state used for a decision: semantically redundant or out-of-order notifications coalesce by identity, and the worker reads the current authoritative entity only after claiming that identity."
      - "GitHub issue, pull request, review, comment, review-thread, workflow, check, and commit-status events use an explicit material-action mapping; unsupported actions do not schedule work."
      - "Supported workflow, job, check, suite, and status deliveries are atomically persisted before HTTP acknowledgement; intake performs no GitHub lookup and malformed supported deliveries fail closed."
      - "CI deliveries retain only correlation identities and deduplicate by repository/delivery UUID. SHA-only obligations are correlated later with complete REST pagination and remain pending after lookup failure or restart."
      - "Known PR and unresolved SHA scopes advance durable observation epochs immediately, then coalesce with a two-second quiet window capped ten seconds after the first event; newer activity during an in-flight reevaluation is retained as one follow-up."
      - "Delivery UUID, event type, and action are retained with each affected entity for duplicate-delivery diagnostics, while signature verification and configured-repository scoping occur before invalidation."
      - "Steady-state GitHub work discovery is event-driven: the maintenance scheduler never enumerates candidate Issues or pull requests, while invalidations wake a dedicated consumer and each worker fetches authoritative entity state."
      - "Each process startup performs one fail-closed, cache-bypassing REST reconciliation of every currently open Issue and pull request before webhook-driven steady state begins. The scan emits stable identities through the same durable invalidation queue as webhooks and preserves the shared creation-anchored Issue stabilization deadline; it neither processes snapshots directly nor repeats on a timer. Partial enumeration keeps startup explicitly not reconciled and prevents steady-state loops from starting, while invalidation generations preserve newer concurrent webhook changes."
      - "A typed, definitely-not-sent governor deferral during a worker's strict authoritative refresh is retained on the same durable entity identity with its reason, API origin, generation, and an independent retry lower bound. The bound is no earlier than one second after handling, the governor deadline, the existing retry guard, or Issue stabilization; webhook and generic wakes cannot bypass it, restart recovery preserves it, and eligibility automatically wakes the ordinary strict-refresh path without holding worker or implementation capacity."
      - "A successful strict PR response must identify the requested pull request. Empty or mismatched metadata remains a visible malformed-authority error and leaves its reevaluation pending; only an authoritative 404 can represent absence."

## Event-driven urgent Issue admission

  urgent_issue_admission:
    description: "Reconsiders a newly urgent Issue immediately through the shared durable implementation admission boundary (Issue #1767)."
    implementation: |
      urgent_admission in DurableInvalidationQueue and Candidate,
      process_github_payload in src/auto_coder/webhook_server.py,
      _worker_loop and _process_single_candidate_unified in src/auto_coder/automation_engine.py
    behavior:
      - "Only an exact `issues.labeled` transition for `urgent` records the durable urgent-admission obligation; the webhook snapshot is a wakeup source and workers perform cache-bypassing authoritative reads before evaluation."
      - "Urgent processing uses the ordinary specification, hierarchy, relationship, authorization, ownership, routing, quota, duplicate-execution, and dispatch path. Urgency changes only whether the single emergency capacity lane may be atomically selected by the shared implementation-slot repository."
      - "An authoritative pre-admission read must still show the Issue open and urgent. Removing `urgent` before admission prevents the stale event from authorizing emergency capacity."
      - "When capacity alone defers an urgent transition, its durable obligation returns to the dirty set and retries without another webhook; operational failures receive the same retry treatment. Non-capacity rejection completes the evaluated obligation."
      - "Coalescing and delivery deduplication key obligations by repository and stable Issue number, while durable implementation ownership prevents duplicate or concurrent deliveries from producing another logical owner or execution."

## Durable manual CI dispatch idempotency

  dispatch_claim_store:
    description: "Makes the manual CI `workflow_dispatch` boundary idempotent using a durable, restart-surviving claim store instead of the `@auto-coder` label or process-local state (Issue #1791)."
    implementation: |
      DispatchClaimStore, DispatchIdentity, DispatchOutcome, ClaimResult, get_dispatch_claim_store in src/auto_coder/dispatch_claim_store.py,
      WorkflowDispatchResult, trigger_workflow_dispatch, _classify_dispatch_exception in src/auto_coder/util/github_action.py,
      dispatch admission block in _handle_pr_merge in src/auto_coder/pr_processor.py
    behavior:
      - "A manual CI dispatch identity is the tuple of repository, pull-request number, authoritative PR head SHA observed for the dispatch decision, and the exact workflow identifier; a different head SHA or workflow identifier is a different identity and is never blocked by another identity's claim."
      - "Before invoking the external workflow_dispatch operation, Auto-Coder atomically acquires a durable SQLite-backed claim for the identity (DispatchClaimStore.try_acquire_claim, using a BEGIN IMMEDIATE transaction); concurrent workers racing for the same identity see exactly one acquisition succeed."
      - "Any failure, corruption, or uncertainty while connecting to, locking, reading, or writing the claim store fails closed: acquisition is denied and no workflow_dispatch call is made."
      - "Once a claim is durably recorded, controller restart, process crash, timeout, connection loss, or any outcome that does not prove GitHub rejected the request keeps that identity dispatch-suppressing; only a definitively rejected outcome (DispatchOutcome.REJECTED) makes the identity dispatchable again — accepted and indeterminate claims remain suppressing indefinitely."
      - "trigger_workflow_dispatch returns a WorkflowDispatchResult carrying one of three observable outcomes (ACCEPTED, REJECTED, INDETERMINATE) instead of a boolean; it is truthy only when ACCEPTED. Only a completed HTTP round trip with a 4xx client-error status is classified REJECTED; transport failures, timeouts, and 5xx responses are classified INDETERMINATE."
      - "Dispatch admission and duplicate suppression never read, add, remove, retain, or otherwise depend on the `@auto-coder` label; the label continues to serve its unrelated lifecycle-locking purpose."
      - "The in-process `_active_monitors` set remains only a same-process optimization to avoid redundant monitor threads; it is not the correctness oracle for dispatch admission, since it does not survive controller restart."
      - "Automatic processing of a newly created Issue is scheduled no earlier than 60 seconds after its GitHub creation time. Mutations coalesce without extending that deadline, and the post-deadline decision uses a fresh authoritative fetch; explicit operator processing remains immediate."

## Legacy `@auto-coder` label semantic inertness

  legacy_auto_coder_label_semantic_inertness:
    description: "Makes the exact retired `@auto-coder` label semantically inert at webhook invalidation, label-to-prompt selection, and semantic PR-label resolution, without removing it as a lifecycle processing lock (Issue #1792)."
    implementation: |
      LEGACY_AUTO_CODER_LABEL, filter_legacy_auto_coder_label, remove_legacy_auto_coder_label in src/auto_coder/label_manager.py,
      get_semantic_labels_from_issue filtering, resolve_pr_labels_with_priority in src/auto_coder/label_manager.py,
      _resolve_label_priority filtering in src/auto_coder/prompt_loader.py,
      _is_legacy_auto_coder_label_change, process_github_payload in src/auto_coder/webhook_server.py,
      issue/PR label extraction in src/auto_coder/issue_processor.py, src/auto_coder/pr_processor.py, src/auto_coder/gemini_client.py
    behavior:
      - "A `labeled` or `unlabeled` GitHub webhook delivery whose changed label name is exactly `@auto-coder` never creates, enqueues, or advances a durable entity invalidation, regardless of who made the change; every other label change, including near-misses such as `auto-coder` or `@auto-coder-old`, continues through the normal invalidation and delivery-deduplication path unaffected."
      - "Before entity labels are supplied to any label-to-prompt selector, interpolated into any LLM prompt label list or label variable, or supplied to semantic PR-label resolution (`get_semantic_labels_from_issue`, `resolve_pr_labels_with_priority`, `_resolve_label_priority`), every exact raw `@auto-coder` label is removed from that consumer's input set, before normalization, alias lookup, fuzzy matching, priority ordering, or string rendering."
      - "A configured alias, label-prompt mapping, or PR-label mapping that names `@auto-coder` directly can never select a prompt template or propagate a semantic label from it, because the label is excluded from the input set before any lookup occurs."
      - "Two authoritative entity states that are identical except that one carries the exact `@auto-coder` label produce identical label-derived LLM prompt content, prompt-template selection, and propagated semantic PR labels."
      - "This filtering never adds, removes, renames, or otherwise mutates an existing `@auto-coder` label on GitHub, and never changes matching, normalization, alias, priority, or propagation semantics for any other label."

## Retired processing-label lifecycle lock

- id: retired-auto-coder-lifecycle-lock
  description: "Retires the exact `@auto-coder` label as a processing lifecycle lock (Issue #1793)."
  behavior:
    - "Issue, pull-request, provider dispatch, CI monitoring, recovery, merge, completion, and cleanup paths neither inspect nor mutate exact `@auto-coder`; historical labels remain untouched."
    - "Lifecycle admission and ownership continue to use the existing durable implementation-slot, active-execution, provider-session, CloudRun, attempt, and workflow-dispatch claim state. Label presence cannot grant or deny work or establish recovery success."
    - "The lock-only `--check-labels`, `CHECK_LABELS`, and `AUTO_CODER_LABEL` controls are removed. The general `--disable-labels`, `DISABLE_LABELS`, and `GitHubClient.disable_labels` controls remain available for semantic label mutations."
    - "Manual workflow dispatch remains protected by its durable repository/PR/head-SHA/workflow claim and fails closed when that claim cannot be established."

specification-review-regression-fixtures:
  description: >-
    Stable, offline prompt regressions exercise production specification-review
    prompt construction and structured response parsing with deterministic provider
    substitutes and semantic finding oracles.
  fixtures:
    - source: kitamura-tetsuo/auto-coder#1774
      revision: before-serial-review-corrections
      authoritative-role: child
      required-semantic-defects:
        - stale-individual-completion-authority-after-title-or-body-edit
        - undefined-child-edit-to-parent-decomposition-identity-invalidation
      guarantees:
        - one-analysis-invocation-must-cover-both-defects
        - blocked-verdict-alone-is-insufficient
        - wording-order-and-extra-findings-are-not-fixed
        - corrected-decomposition-identity-requirement-is-excluded

codex-authoritative-recovery-observations:
  description: "Read-only, identity-bound Codex execution and GitHub publication evidence (Issue #1863)."
  implementation: "CodexObservationService and immutable evidence types in src/auto_coder/codex_observation.py; structured task-details parsing in src/auto_coder/codex_wham_client.py; fresh strict REST readers in src/auto_coder/util/gh_cache.py."
  behavior:
    - "Observations retain repository, Issue, attempt, provider task, backend, environment, base branch, read generation, and activity generation; stale concurrent reads cannot replace a newer observation."
    - "Only current_assistant_turn.id and turn_status, corroborated by latest-turn metadata and without pending newer user work, establish recovery-eligible completion; unavailable, malformed, contradictory, or mismatched evidence is UNKNOWN."
    - "GitHub publication discovery completely reads fresh Issue relationships, known durable run PRs, and repository open PRs, then verifies every candidate; incomplete reads fail closed rather than proving absence."
    - "Open, closed, merged, absent, ambiguous, and unavailable publication evidence remain distinct, and every operation is read-only."

immutable-release-catalog-records:
  description: "Persists complete release preparation metadata in create-only annotated Git tag refs (Issue #1848)."
  implementation: "ReleaseCatalog in src/auto_coder/release_catalog.py and `auto-coder deployment release-catalog prepare|read`."
  behavior:
    - "A strict version-1 JSON record binds lowercase repository, original Actions run identity/time, derived JST tag, actual image source commit, GHCR image digest, and inert memo text."
    - "The exact refs/tags/release-<JST time>-r<run ID> ref points to an annotated tag object that directly targets the recorded commit; readers reject lightweight, nested, malformed, cross-repository, and schema-drifted data."
    - "Preparation validates before mutation, creates refs without update or deletion, reuses only an identical binding, and reports success only after a fresh exact-ref read validates all data."
    - "Unavailable or malformed reads never prove absence; ambiguous and conflicting writes are reconciled by exact-ref validation and cannot overwrite a winner."
    - "These commands make only Git tag-object and ref requests and do not publish Releases, alter branches, build images, or mutate GHCR."

dated-release-publication:
  description: "Publishes a dated GitHub Release after a verified immutable-image promotion (Issue #1849)."
  implementation: "The manually dispatched Promote Release workflow invokes the replay-safe ReleasePromotion service under the shared release-channel lock."
  behavior:
    - "An optional memo is preserved verbatim as inert record data; artifact SHA and digest are always derived from the pinned beta digest and its image metadata."
    - "The run-ID-qualified JST tag records the original workflow request time, while GitHub displays publication time separately; the public notes expose the SHA, digest, immutable image history reference, run link, tag, and memo."
    - "A repeated attempt is reconciliation-only: an existing publication is read-only, and a prepared entry can be published only while its history, image revision, and current release channel still match."
    - "Catalog entries are historical records, not a current-deployment cursor. Find the dated entry under GitHub Releases and copy its `release-...JST-r...` tag."
    - "Set optional `RELEASE_CATALOG_TOKEN` when the built-in token cannot create a tag or Release, including source commits that change workflows; grant that credential repository contents and workflow-write authorization required by GitHub. Registry login continues to use `GITHUB_TOKEN`."

validated-release-channel-restore:
  description: "Restores the GHCR release distribution tag from one explicit durable catalog or legacy history identity (Issue #1850)."
  implementation: "The manually dispatched Rollback Release workflow invokes ReleaseRestore under the repository-wide release-channel concurrency group."
  operator_sequence:
    - "Open the repository's GitHub Releases page, choose the intended dated non-draft/non-prerelease entry using its memo and source identity, and copy its exact tag, for example `release-20260907T174912JST-r123`."
    - "The timestamp in that example is the original workflow request second displayed in JST (UTC+09:00), and `r123` is the recorded Actions run ID; it is not the editable Release publication time."
    - "Choose Actions -> Rollback Release -> Run workflow, paste that exact value into `release_tag`, and leave `release_sha` empty. The workflow never selects previous, next, or latest relatively."
    - "For a pre-catalog image, instead leave `release_tag` empty and enter its complete 40-character lowercase commit in `release_sha`. This alternative uses only `release-<SHA>` GHCR history and does not require or create catalog metadata."
  behavior:
    - "Exactly one input must be nonempty. URLs, abbreviated SHAs, digests, shell-like text, missing tags, and ambiguous dual inputs fail before any channel write; invalid catalog input never falls back to SHA history."
    - "Catalog restore requires an exact eligible GitHub Release, its strict version-1 annotated Git tag and direct commit target, matching immutable GHCR history digest, and matching source revision read from the image digest. Prepared-only, draft, prerelease, lightweight, nested, mismatched, or unavailable evidence is rejected regardless of editable title, body, memo, or target_commitish."
    - "The durable Git tag/Release and GHCR evidence are sufficient after Actions logs and artifacts expire. Repeating a restore can be a verified no-op and never creates another catalog entry."
    - "Only the mutable `:release` distribution tag is written to the pinned digest and freshly read back. Failure or unavailable read-back is reported as uncertain without a compensating write; beta, history, source, Releases, Git refs, builds, and running containers remain untouched. A confirmed tag restoration is not confirmation that any container restarted or updated."
runtime_coordination_locks:
  summary: Repository state coordination locks live outside configuration and durable state.
  behavior:
    - Locks use AUTO_CODER_RUNTIME_ROOT/locks/<owner>/<repo>, defaulting to ~/.auto-coder/runtime/locks/<owner>/<repo>.
    - Stable identities include the resolved state path, coordination purpose, and logical key.
    - Shared-state processes must use one physical runtime tree and consistent canonical state paths.
  documentation: docs/runtime-locks.md

short-objective-contract-policy:
  description: "Keeps a concise Issue purpose separate from the normative implementation contract (Issue #1860)."
  behavior:
    - "New non-trivial Issues use one Objective section with one or two short outcome sentences; detailed behavior and acceptance coverage remain in explicit Requirements."
    - "Issue decomposition inspects code and contracts before fixing child boundaries, exposes every proposed Objective before creation, and stops rather than guessing between materially different purposes."
    - "Review response preserves an existing Objective verbatim, rejects adjacent demands, and requires user direction before any purpose-changing Issue mutation; legacy Issues are neither inferred nor rejected for lacking Objective."
    - "Production Issue, label, cloud, PR implementation, correction, initial review, rereview, and dynamic follow-up prompts receive one shared policy: Objective is scope evidence while current explicit Requirements are the sole merge-blocking contract."
    - "Objective-only omissions use supported specification-gap or clarification channels and never become invented REQ IDs, automatic Issue edits, or implicit code and test obligations."

github-pending-work-scheduler:
  description: "Connects the durable GitHub pending-work store to the daemon lifecycle so retained obligations resume automatically after admission or startup, rather than only being observable through direct store manipulation (Issue #1920)."
  documentation: "src/auto_coder/github_pending_work.py"
  behavior:
    - "`AutomationEngine` owns a `PendingWorkScheduler` (one per process) that runs as its own supervised task inside `start_automation`, started before startup reconciliation so restart-surviving obligations are never orphaned by a fresh enumeration."
    - "A semantic stage (e.g. startup reconciliation, Issue/PR evaluation, publication) registers a `StageHandler` (`dispatch`/`recover`) with the scheduler via `register_handler(stage, handler)`; an obligation for an unregistered stage is left retained and reported as blocked rather than discarded or completed."
    - "The scheduler wakes on the earliest due deadline or an explicit `wake()` call (e.g. an admission-change notification) instead of polling tightly; a due-but-not-actionable obligation waits at least one poll interval (default 1s) before the next attempt, never a zero-delay loop."
    - "Obligations track a `status` of waiting or running. Dispatch claims a row as running before invoking its handler; a controller that stops (crash or graceful shutdown) while a claim is running leaves that row running, and the next scheduler start routes it through the handler's `recover()` entry instead of a fresh `dispatch()` or treating it as complete."
    - "A stage handler's error result re-defers only its own still-unfinished effects through the existing throttle/admission-deferral accounting in `PendingWorkStore.defer()`; completing one effect never discharges an independent sibling effect."
    - "`auto-coder pending-work list` and `auto-coder pending-work retry --repository --entity --stage [--revision]` expose the store for operators: list is read-only, and retry clears only the selected obligation's retry deadline and throttle count (REQ-007) without touching confirmed effect receipts or any other obligation; the retried dispatch still goes through the shared governor."
    - "`AutomationEngine.get_status()` includes a `pending_work` snapshot (repository, entity, stage, revision, reason, status, next-eligible time, unfinished effects, and whether it is blocked and why) for daemon status visibility."
    - "A preflight-schema database (no `status` column) is migrated in place on open; its rows default to waiting so pre-existing retained work is preserved rather than dropped."

resumable-startup-reconciliation:
  description: "A deferred or throttled startup GitHub scan retains recoverable work and retries automatically instead of terminating the daemon (Issue #1921)."
  documentation: "src/auto_coder/automation_engine.py"
  behavior:
    - "`start_automation` registers a `startup-reconciliation` stage handler with the pending-work scheduler (immediately after creating its task, before any await) and runs the first startup attempt inline: open-PR ownership discovery, then strict Issue/PR enumeration."
    - "A `GitHubRequestError` from that attempt (a local admission deferral or an actual GitHub throttle, authentication, or forbidden response) does not terminate the daemon: it is retained as a durable pending-work obligation keyed by a stable repository-scoped identity (`WorkIdentity(repo_name, \"startup\", \"startup-reconciliation\")`, stable across restarts), and the already-running pending-work scheduler retries it independent of the ordinary worker pool. Any other exception is a genuine defect and continues to propagate and stop the daemon, unchanged from before."
    - "The ordinary worker pool, producer loop, and invalidation loop do not start until startup reconciliation succeeds; `start_automation` waits on that outcome (or on shutdown) without blocking the event loop, so webhook receipt, status reporting, and graceful shutdown remain responsive while recovery is incomplete."
    - "Every retry -- whether the inline first attempt or a scheduler-driven dispatch/recover -- performs a complete fresh open-PR-ownership discovery and Issue/PR enumeration; a later-page failure is never combined with an earlier successful page as partial success."
    - "Open-PR ownership discovery failure (deferred or throttled) is no longer silently swallowed: `ImplementationSlotRepository.reconcile(discover_open_prs=True)` propagates it so the same durable obligation covers both ownership discovery and entity enumeration, preserving existing owners until discovery completes."
    - "On success, any pending-work obligation retained for this repository's startup-reconciliation identity is cleared (superseded or its effect completed), so a later timer never repeats a full repository enumeration merely because time passed; `AutomationEngine.get_status()['pending_work']` continues to expose an incomplete cycle's reason and next-eligible time via the existing pending-work snapshot."

resumable-validation-publication:
  description: "Issue specification/decomposition BLOCKED publication (the diagnostic findings comment and the associated `implementation-ready` withdrawal) resumes its unfinished effects durably and independently after a GitHub operational failure or a controller restart, without duplicate delivery (Issue #1923)."
  documentation: "src/auto_coder/specification_validation_lifecycle.py, src/auto_coder/automation_engine.py"
  behavior:
    - "`SpecificationValidationLifecycle.apply_blocked` / `apply_inherited_blocked` durably complete the diagnostic comment and readiness-withdrawal effects independently, one at a time, via `PendingWorkStore.complete_effect(WorkIdentity(repository, \"issue:<number>\", \"validation-publication\", decision.identity.key), effect)` as each succeeds (or was already durably confirmed by an earlier partial run) -- `complete_effect` now has a real production caller for both the `diagnostic` and `readiness-withdrawal` effect names used by the store's own test fixtures."
    - "A `GitHubRequestError` raised while applying a BLOCKED decision (standalone or inherited) is never reported as the durable `BLOCKED` terminal outcome: the candidate-processing call site (`AutomationEngine._defer_validation_publication`) retains exactly the still-unfinished effects (as read from the durable `SpecificationValidationStore` decision, not a single undifferentiated flag) as a `DEFERRED` obligation on the `validation-publication` pending-work stage, and wakes the scheduler."
    - "The standalone diagnostic comment's currentness check no longer requires the `implementation-ready` label to still be present: a label already removed by this same result's own completed withdrawal effect must not hide a still-missing diagnostic comment behind a stale label-presence check. Label *removal* itself, and the inherited (parent) diagnostic and withdrawal, keep the full original label/decomposition-set currentness check, since a parent's BLOCKED result is authoritative only for a specific decomposition set."
    - "`AutomationEngine` registers a `_ValidationPublicationStageHandler` for the `validation-publication` stage (alongside the existing `startup-reconciliation`, `pr-processing`, and `issue-processing` handlers) so both dispatch (governed retry) and recover (post-restart) resume through the real production path: refetch the current Issue (and, for an inherited result, the current authoritative parent/decomposition set), recompute the specification identity fresh, and only proceed when it still matches the retained obligation's revision -- an edited Issue, changed hierarchy, or new readiness submission supersedes the obligation instead of authorizing a stale mutation."
    - "A superseded or already-fully-completed obligation is discarded or cleared without any further GitHub mutation; a decision no longer `BLOCKED` (e.g. re-validated as READY) also supersedes rather than reapplying withdrawal effects."

repository-hygiene-enforcement:
  description: "Checks the complete tracked repository state at commit and in PR CI while keeping disposable agent work untracked."
  documentation: docs/repository-hygiene.md
  behavior:
    - "PR Tests runs the repository hygiene checker against HEAD in the existing Lint & Type Check job."
    - "Pre-commit runs the checker against the complete staged index, including when no Python filenames are passed."
    - "Disposable work belongs under .agent-tmp/, maintained scripts under scripts/, and regression tests under tests/; root-level Python files are prohibited."
    - "Git ignore rules and local hooks supplement tracked-state CI checks; server-side enforcement depends on separately configured branch protection or repository rulesets."

merge-operation-state:
  description: "Durable state for one PR's approval-then-merge mutation sequence, modeling automatic approval and merge as independent effects with per-attempt ownership and correlated delivery receipts so a restart, duplicate notification, or stale in-flight result can never re-post an approval, re-merge, or silently discard evidence that a mutation already happened (Issue #1937, merge-recovery 1/3)."
  documentation: "src/auto_coder/merge_operation_state.py"
  behavior:
    - "`MergeOperationStore` (SQLite, `~/.auto-coder/merge_operation_state.db` by default) keys operations on `MergeOperationIdentity(api_origin, repository, pr_number)` and tracks, per operation: the expected head SHA, merge method, approval credential role, reviewer identity, a generation counter, and an `OperationStatus` (waiting, running, operationally_blocked, superseded, merge_confirmed)."
    - "Approval and merge are tracked as independent `EffectRecord`s with an `EffectState` of not_needed, not_attempted, running, confirmed_unsent, confirmed_rejected, confirmed_complete, or delivery_unknown; completing or waiting on approval alone never marks the operation merge_confirmed -- only merge reaching confirmed_complete (with approval not_needed or confirmed_complete) does."
    - "`get_or_create` is idempotent for the same expected head: a duplicate notification, a different entry point, a restart, or a merge-method/credential/reviewer metadata refresh never resets effects, deadlines, generation, or receipts. A genuinely new expected head bumps the generation and returns any not-yet-confirmed-complete effect to not_attempted while leaving the prior generation's history and receipts untouched."
    - "`reserve_attempt` grants at most one execution right per effect at a time (no duplicate mutation permission across entry points/threads); it is refused while the effect is already running, already confirmed_complete, delivery_unknown (awaiting explicit reconciliation), or the operation is operationally_blocked/superseded/merge_confirmed."
    - "Every reservation is stamped with a fresh `attempt_id` and the operation's current `generation`; `record_confirmed_complete` / `record_confirmed_unsent` / `record_confirmed_rejected` / `record_delivery_unknown` / `defer_local` all verify the caller still owns that exact `(attempt_id, generation)` pair before mutating current state -- a stale attempt (superseded by a newer head) is recorded only to the append-only `merge_operation_attempt_history` table and never overwrites the current effect, deadline, or receipt."
    - "Confirmed-complete receipts (`EffectReceipt`) carry a `ConfirmationSource` (own_response vs. state_observation) plus review ID/reviewer identity/target head for approval and merge commit SHA/target head for merge -- never tokens, Authorization headers, or raw request/response bodies."
    - "`recover_after_restart` reclassifies any effect left `running` (a controller that stopped between reserving an attempt and recording its outcome) as `delivery_unknown`; such an effect is not auto-retryable until an explicit reconciliation call resolves it, and is not converted to any other state merely by cancellation, timeout, requeue, or repeated recovery passes."
    - "`defer_local` implements the REQ-006 deadline floor: the new deadline is never earlier than `now + MIN_LOCAL_RETRY_INTERVAL_SECONDS` (1s), any `retry_after_seconds`, an explicit governor deadline, or the previously retained deadline, whichever is latest; a real throttle response only spends one retry per distinct `throttle_attempt_id` (duplicate redelivery is free), a purely local (pre-send) deferral never spends a retry, and one real throttle plus `MAX_THROTTLED_RETRIES_AFTER_FIRST` (3) further automatic attempts are tolerated before the operation becomes `operationally_blocked` with `throttle_retries_exhausted`."
    - "`operationally_block` durably records an authentication/forbidden failure; `manual_reset_effect` is the explicit operator escape hatch that clears a block/rejection/exhaustion for one selected effect only, without touching its receipt or its sibling effect."
    - "All persistence failures (reservation, receipt recording, reopening the store) raise `MergeOperationPersistenceError` rather than reporting success or silently degrading; existing rows are left intact, and no token/Authorization/secret/request-body value is ever persisted or logged -- new diagnostics go through loguru to stdout and the existing rotating log files, matching the rest of the codebase."
    - "This stage owns only the state model and its persistence boundary: interpreting real GitHub approval/merge responses, wiring this into normal PR processing, and connecting it to the pending-work scheduler are explicitly out of scope here and are owned by later child issues under #1936."

merge-operation-adapter:
  description: "Production GitHub adapter that turns one real approval or merge HTTP exchange into a correlated MergeOperationStore outcome -- confirmed complete, a typed deferral, an operational block, a definitive rejection, or an indeterminate delivery -- never a fabricated receipt or a guessed unsent (Issue #1938, merge-recovery 2/3)."
  documentation: "src/auto_coder/merge_operation_adapter.py"
  behavior:
    - "`attempt_approval`/`attempt_merge` reserve exclusive execution rights via `MergeOperationStore.reserve_attempt` before sending anything; a refused reservation (effect already not_needed/confirmed_complete/delivery_unknown/confirmed_rejected, or the operation blocked/superseded/merge_confirmed) returns `already_satisfied` with zero wire calls."
    - "Before posting a new approval, `attempt_approval` lists every page of `GET /pulls/{number}/reviews` via `get_ghapi_client()` and looks for the configured reviewer identity's *last decisive* review (ignoring COMMENTED/PENDING); if it is APPROVED with `commit_id` equal to the operation's expected head, the approval effect is satisfied via `ConfirmationSource.STATE_OBSERVATION` (the review id/principal/head is recorded) and no POST is sent. A different principal, a different head, a later CHANGES_REQUESTED/DISMISSED verdict, or a failed/partial page listing are never treated as valid approval evidence, and a listing failure is classified and recorded like any other mutation failure without ever reaching the POST."
    - "A fresh approval POST (`event=APPROVE`, `commit_id=<expected head>`) is confirmed complete via `ConfirmationSource.OWN_RESPONSE` only when the response carries a non-empty review id, `state == \"APPROVED\"`, and `commit_id` equal to the expected head; any other 2xx body (wrong head, missing id/state) is recorded `delivery_unknown` rather than fabricated into a receipt."
    - "A merge PUT is confirmed complete via `ConfirmationSource.OWN_RESPONSE` only when the response reports `merged: true` with a non-empty merge commit SHA; a 2xx body that fails either check is recorded `delivery_unknown`, never treated as a confirmed rejection."
    - "`reconcile_approval`/`reconcile_merge` are explicit, read-only entry points that only ever act on an effect currently `delivery_unknown` (otherwise `no_reconciliation_needed`); they never send a mutating request. `reconcile_approval` re-runs the same all-pages review lookup and only ever moves the effect forward to `confirmed_complete` on a positive match -- an unreachable/partial listing or the absence of a currently valid approval (including one later dismissed) leaves `delivery_unknown` completely unchanged, preserving the original mutation's uncertainty rather than guessing it. `reconcile_merge` performs one fresh authoritative `GET /pulls/{number}` and resolves to `confirmed_complete` only when `merged: true`, the PR's current head still equals the expected head, and `merge_commit_sha` is non-empty -- an external actor's merge counts, a different (later) head's merge does not, an open/unmerged/unreadable observation never flips the effect back to unsent, and a squash/rebase merge commit SHA is never compared against the head SHA."
    - "HTTP fault classification for both effects: 401/403 without throttle evidence -> `operationally_block` (authentication_failure/forbidden); 429, 403 with throttle evidence (remaining=0/valid Retry-After/secondary-rate-limit body), or any other real-throttle classification -> a real-throttle `defer_local` (spends one of the store's tolerated automatic retries); a local Governor admission refusal (e.g. mutation-spacing) -> a local, zero-spend `defer_local` carrying the Governor's own retry deadline; a mutation 5xx or any unwrapped transport/body-read exception -> `record_delivery_unknown`; a synchronous merge PUT's 409 -> `record_confirmed_unsent` (the mutation was rejected, never applied) followed by `store.supersede()` so the operation cannot be retried against the stale head; 405, 422 without throttle evidence, and any other unclassified 4xx -> `record_confirmed_rejected` as a cause-unspecified definitive rejection, never treated as license to try another method, endpoint, or credential."
    - "Exactly one mutating request (POST review or PUT merge) is ever sent per `attempt_*` call, plus only the review-listing GETs REQ-003 requires; no hidden internal retry, fallback method/CLI/endpoint/credential, or extra diagnostic GET is ever issued by this module."
    - "This module is adapter-only and intentionally unwired: it is not called from `pr_processor.py`'s normal merge path, `PendingWorkScheduler`, or any other production entry point in this issue -- that wiring, along with re-verifying merge-time approval validity, is owned by a later child issue under #1936. It performs no CI/review-pass judgment, provider repair, or Issue/session lifecycle mutation."

execution-scoped-structured-diagnostic-traces:
  description: "Versioned, execution-scoped structured diagnostic events and a read-only snapshot API, so dashboard/consumer code can distinguish independent evaluations, async jobs, and scheduler resumptions of the same Issue/PR without changing automation behavior (Issue #1944, diagnostic-traces 1/n under #1943)."
  documentation: "src/auto_coder/execution_trace.py"
  behavior:
    - "`TraceCollector` (`get_trace_collector()`) is a process-local singleton distinct from the existing category/message `TraceLogger`; every `StructuredEvent` (schema version 1) carries repository, item type/number, process-run id, execution id, execution-start sequence, its own event sequence, origin, stage id, display label, `EventKind` (execution-started, stage-started, stage-result, execution-finished), timestamp, and an optional explicit `Outcome` plus a deep-copied facts dict -- a missing outcome stays `None`/unknown, never a manufactured success."
    - "`start_execution(repository, item_type, item_number, origin, ...)` always mints a fresh opaque execution id and returns an `ExecutionHandle` context manager; two evaluations of the same item with identical attempt/head/timestamp get distinct execution ids and are ordered only by their atomically-allocated publication sequence."
    - "Scope propagation is explicit: `current_scope()`/`bind_scope()` (and the `run_with_scope` helper) carry an `ExecutionScope` across asyncio tasks and into worker threads, since `contextvars` already isolates concurrent tasks/threads from each other but does not auto-propagate into new threads. A late event explicitly re-scoped to an earlier execution keeps that execution's identity and original start sequence rather than being attributed to whichever evaluation started most recently."
    - "`ExecutionHandle.__exit__` always emits exactly one `execution-finished` event (unless `finish()` already did) and restores the enclosing scope even after an exception or `asyncio.CancelledError`, deriving the outcome from an explicit `set_outcome()` call, else `FAILED`/`CANCELLED`/`UNKNOWN` as appropriate; `Outcome` also distinguishes completed, accepted-handoff, deferred, skipped, blocked, and superseded so a bare completion event never by itself asserts an Issue is implemented or a PR is published/merged/cleaned up."
    - "Both the event buffer and the companion per-execution metadata map are bounded (`max_events`/`max_executions`); eviction increments `events_dropped`/`executions_dropped` and `get_snapshot()` reports `events_truncated`/`execution_metadata_truncated` rather than presenting a falsely-complete history. A fresh `TraceCollector` instance (new process run id) starts with empty history and never resurrects a prior run's executions."
    - "`get_snapshot()` returns an immutable `TraceSnapshot` whose events and facts are deep-copied on the way out (and were already deep-copied on the way in), so mutating a returned event's facts, or a facts dict passed in earlier, never alters retained evidence."
    - "Previously unseen stage identifiers, labels, and fact keys pass through unchanged (no dashboard-side registration needed). `record_legacy_or_raw()` ingests externally-shaped records (e.g. old Queue/Worker-style entries): records missing execution identity are marked `legacy=True`, and records with a missing/mismatched `schema_version` are marked `supported=False` -- neither is silently promoted into a valid, successful execution event. The existing category-based `TraceLogger` is untouched and remains fully usable during this staged migration."
    - "Recording, scope management, retention, and snapshot reads never authorize work or change business return values/exceptions: `_publish()` catches and loguru-logs any internal recorder failure (e.g. a broken sink) and continues without raising, so a traced operation's result and exception behavior are identical whether the recorder is healthy or failing."
    - "Out of scope here: instrumenting production Issue/PR routes, wiring this into the dashboard UI, persisting/replaying traces, or reconciling durable provider/PR state -- this stage owns only the shared event model and collection boundary."

issue-production-execution-trace-instrumentation:
  description: "Production emission of execution-scoped structured diagnostic events (from execution_trace.py, Issue #1944) into real Issue admission, validation, dispatch, and resumption boundaries, so a dashboard can see actual Issue processing decisions instead of only Dispatch.mode (Issue #1945, diagnostic-traces 2/n under #1943)."
  documentation: "src/auto_coder/automation_engine.py, src/auto_coder/issue_processor.py"
  behavior:
    - "`AutomationEngine._process_single_candidate_unified` opens a fresh top-level `ExecutionScope` (origin threaded from the caller: `durable-invalidation-worker`, `capacity-refill-intake`, `batch-scan-worker`, `explicit-single-target`, `issue-pending-work-resumption`, `pr-pending-work-resumption`, `merge-operation-resumption`, or `stale-provider-session-reassignment`) whenever it is not already nested inside a matching (repository, item_type, item_number) scope; a recursive dispatch into a *different* Issue (e.g. a container parent's open child) always gets its own fresh execution, while a same-item re-entry (e.g. the `generation_serialized` owner-slot retry) keeps participating in the caller's execution. `_ValidationPublicationStageHandler._run` opens its own `validation-publication-resumption` execution independently, since it never calls `_process_single_candidate`."
    - "`_map_candidate_result_outcome` derives the execution-finished `Outcome` only from fields the boundary itself already set (`target_outcome`, `capacity_deferred`/`refill_retry_required`, `error`, `success`); anything it cannot classify from real evidence stays `UNKNOWN` rather than defaulting to success."
    - "Stage-result events are recorded at reached admission/validation boundaries -- author admission, parent-Issue reconciliation, creation stabilization, hierarchy/readiness admission, normative-contract checking, decomposition/individual validation result consumption (including a dependent child's own `issue.decomposition-gate-observed` record when it merely observes a parent's already-decided job), container-parent completion, and dispatch-route selection (`local`/`cloud`/`high-score-cloud`) -- using the actual outcome/reason the boundary already computed, never a re-derived guess."
    - "`AutomationEngine._traced_validation_job` gives every decomposition/individual validation job submitted through `_schedule_parent_validations` its own fresh execution scope (decomposition keyed to the parent, with the reviewed member-issue-number set as a fact; individual keyed to the reviewed child) instead of inheriting the ambient scope that `ValidationScheduler.submit`'s `contextvars.copy_context()` would otherwise carry into the worker-pool thread; its outcome maps the lifecycle's `READY`/`BLOCKED`/`ERROR` verdict, and validation disabled by configuration is recorded as an explicit `SKIPPED` job rather than silently absent evidence."
    - "issue_processor.py records dispatch-selection (`issue.dispatch.selection`, stage-started) and each provider's actual submission outcome: Jules and Claude Routine as `ACCEPTED_HANDOFF` on a returned session id or `FAILED`/`DEFERRED` on an exception/usage-limit; Codex Cloud distinguishes `ACCEPTED_HANDOFF`, duplicate-dispatch `SKIPPED`, `DEFERRED` (usage limit, definitely-not-submitted), and `UNKNOWN` (indeterminate submission) using the real `CodexSubmissionOutcome`. Local implementation records branch preparation, and derives the commit/push stage's outcome from `commit_and_push_changes`'s own returned message (`COMPLETED`/`SKIPPED`/`FAILED`) rather than assuming success. `_create_pr_for_issue` records `issue.pr-publication` as `COMPLETED` only when a PR number/URL was actually obtained (new or pre-existing), and `BLOCKED`/`FAILED` on a validation failure or GhApi error -- the unconditional `result.success = True` the engine sets after any dispatch branch never overrides these boundary-level records."
    - "Every new recording call site is wrapped so a diagnostic-recorder failure (an exception from `start_execution`/`record_event` itself, not merely an internal bug the collector already guards against) is caught and loguru-logged rather than propagating into the admission/dispatch/validation decision it describes; on a `start_execution` failure the wrapped business call still runs untraced."
    - "Out of scope here: PR-owned processing (a separate child issue), dashboard rendering, and exhaustive coverage of every internal branch of the ~1000-line unified candidate-processing function -- the boundaries above are the representative, most-reached admission/dispatch/validation decision points, not a claim that literally every nested early-return is individually instrumented."

pr-production-execution-trace-instrumentation:
  description: "Production emission of execution-scoped structured diagnostic events (from execution_trace.py, Issue #1944) into real PR recovery, CI-observation, review/adversarial-validation, mergeability/merge, repair-delegation, and resumption boundaries, so a dashboard can see actual PR processing decisions instead of inferring them from a Merging/Fixing category (Issue #1946, diagnostic-traces 3/n under #1943)."
  documentation: "src/auto_coder/pr_processor.py, src/auto_coder/util/github_action.py, src/auto_coder/automation_engine.py"
  behavior:
    - "PR executions reuse the same generic `AutomationEngine._process_single_candidate_unified` top-level `ExecutionScope` opening as Issues (keyed by `(repository, item_type=\"pr\", item_number)`), so `worker`/`batch-scan-worker`/`capacity-refill-intake`/`durable-invalidation-worker`/`explicit-single-target`/`pr-pending-work-resumption`/`merge-operation-resumption` origins and the `_map_candidate_result_outcome` execution-finished outcome already apply to PRs without PR-specific changes; this stage adds the PR-side *stage-result* evidence inside that scope, plus explicit evidence for the two resumption handlers' own pre-dispatch exits."
    - "`_PrProcessingStageHandler._run` and `_MergeOperationResumeHandler.__call__` record `pr.strict-refresh` (`DEFERRED`) on a `GitHubRequestError` refreshing the PR, and `pr.pending-work-resume-refresh` / `pr.merge-operation-resume-refresh` (`SUPERSEDED`, with expected/current head facts) when the current head no longer matches the deferred obligation/operation, before ever calling `_process_single_candidate` -- so a changed-head rejection is visible as superseded rather than silently discarded or reported as a merge."
    - "`pr_processor._record_pr_stage` (used throughout `process_pull_request`/`_handle_pr_merge`/`_merge_pr`/`_start_mergeability_remediation`) records each reached boundary's actual result under the ambient scope: unsafe-branch/empty-PR/stale-Jules recovery, admission (`@auto-coder` label skip), provider-ownership wait (Jules), mergeability remediation (delegated/success/deferred/failed/degrading, mirroring the existing `Remediation` trace-logger categories), manual CI dispatch (claim skip/deferred/accepted-handoff/failed), review-thread gating (blocked/failed) and its cloud repair delegation, adversarial validation (disabled/skipped/deferred-on-Codex-review/blocked/failed/superseded-attempt/completed, keyed to the examined head), the pre-merge head-refresh (`SUPERSEDED` on a changed head), and cleanup (best-effort `COMPLETED`)."
    - "`util.github_action._check_github_actions_status` records `pr.ci-observation` immediately after `observe_ci` returns, preserving `ObservationAvailability` distinctly rather than collapsing it into a boolean: incomplete/superseded evidence records `UNKNOWN`/`SUPERSEDED` (never a failure or a pass), `known_empty` records `DEFERRED`, and a complete observation's derived pending/failing/success maps to `DEFERRED`/`BLOCKED`/`COMPLETED` -- each with the observed head, `cycle_id`, and `invalidation_epoch` as facts."
    - "`_merge_pr`/`_finalize_merge_success`/`_handle_definitive_merge_rejection` record `pr.merge-delivery` only from each boundary's own confirmed result: `COMPLETED` exclusively inside `_finalize_merge_success` (a durably confirmed merge), `DEFERRED` for an indeterminate/retryable adapter outcome or incomplete approval, and `FAILED` for a definitive rejection exhausted without an allowed alternate method -- an operation starting or an accepted cloud/Jules conflict-repair handoff (`pr.repair-delegation`, `ACCEPTED_HANDOFF`) is never itself recorded as a merge or repair success."
    - "Every new recording call site is wrapped so a diagnostic-recorder failure is caught and loguru-logged rather than propagating into the PR admission/CI/review/merge/repair decision it describes; on a `start_execution`/`record_event` failure the wrapped business call still runs untraced."
    - "Out of scope here: dashboard rendering, `adversarial_validator.py`'s internal analysis steps (only its call site's verdict is recorded), and exhaustive coverage of every internal branch of `pr_processor.py`'s ~5000-line PR pipeline -- the boundaries above are the representative, most-reached recovery/observation/gating/merge decision points, not a claim that literally every nested early-return is individually instrumented."

dashboard-detail-observed-execution-projection:
  description: "The `/dashboard/detail/{item_type}/{item_number}` detail view is rendered from the shared schema-version-1 diagnostic snapshot (execution_trace.py, Issue #1944) instead of a hand-maintained Issue/PR workflow graph and category/message-based session inference, so it shows observed processing rather than inferred or asserted current state (Issue #1947, diagnostic-traces 4/n under #1943)."
  documentation: "src/auto_coder/dashboard.py, src/auto_coder/dashboard_detail.py"
  behavior:
    - "`init_dashboard(app, engine, repo_name)` scopes every detail view to exactly one repository (the dashboard's own configured `repo_name`), so two repositories sharing an item number never mix evidence; an unsupported `item_type` or non-positive `item_number` is reported as an invalid/unresolved target and never falls back to another item's data."
    - "Executions for the selected item are ordered by `ExecutionSummary.start_sequence` (`dashboard_detail.executions_for_item`), never by wall-clock timestamp, head SHA, attempt number, or list index; `resolve_selected_execution` looks up a pinned execution by its exact id. In `FOLLOW_LATEST` mode the view always shows the execution with the greatest retained start sequence and switches automatically as new executions start; a user-chosen (`PINNED`) execution keeps that identity across new arrivals, and if it is later evicted by bounded retention the page reports `pinned_evicted` explicitly rather than silently substituting whatever execution now occupies its former index."
    - "`build_observed_path_diagram` renders only the selected execution's own events, strictly in event-sequence order, one Mermaid node per event (keyed by position so repeated stage ids stay distinct) using that event's own label/kind/outcome; edges are labeled `observed order`, never an inferred control-flow/causal edge. `escape_for_mermaid_label` allow-lists a small safe character set and numeric-HTML-escapes everything else, so quotes, brackets, arrows, semicolons, newlines, and HTML/script tags in event data can never break out of a quoted label to inject a node, edge, directive, or executable content. 'Copy Mermaid Code' always copies the diagram currently rendered for the selected execution (read from a per-refresh holder, never a stale closure)."
    - "The Observed Evidence panel (`evidence_rows`) and Decision Log list stage-result/execution-finished events verbatim: each row keeps its own producing event, observation timestamp, and explicit `Outcome` (rendered as the literal enum value, defaulting to the literal string `unknown` -- never coerced from a missing/falsy field into success or failure), plus its recorded facts rendered by `format_fact_value` without boolean-to-verdict coercion (`None` renders as an explicit `(not recorded)` marker, not an empty/omitted value). Evidence from different executions or revisions is never merged into one row. The Decision Log is newest-event-first within the selected execution."
    - "Events with no execution identity (`execution_id is None`) -- both structured events recorded before any execution scope was open and pre-migration `TraceLogger` text entries -- are shown in a separate 'Unscoped / legacy diagnostic evidence' section, individually marked `supported`/`unsupported schema` where applicable, and are never assigned a guessed execution or a successful outcome."
    - "`refresh_details` reads only local snapshots (`TraceCollector.get_snapshot`, `TraceLogger.get_logs`) on open, on its 1-second `ui.timer`, and on every navigation click -- no GitHub/provider request or work-admission/mutation call is made from the detail view. A snapshot-read failure leaves the previously rendered view in place and marks the status banner stale (with the last successful local-refresh time) rather than presenting it as fresh or as an empty history; a re-entrancy guard keeps overlapping refreshes from applying out of order, and the page's timer is deactivated via `Client.on_disconnect` when the client disconnects."
    - "Each periodic/navigation refresh separates observing the snapshot from invalidating the rendered projection (Issue #1978): navigation, identity, diagram, evidence, decision-log, and legacy sections each compare a signature of their own relevant inputs against the last render and leave their container untouched when unchanged, so an unchanged snapshot never clears/rebuilds any section, moves the document scroll position, or resets table pagination/Follow-latest/pinned selection. When only a section's content changes (not its shape), the Mermaid diagram and the evidence/decision-log/legacy tables are patched in place via NiceGUI's reactive `content`/`rows` props instead of being destroyed and recreated, so newly observed evidence becomes visible without forcing the viewport back to the page origin or losing a table's current pagination page; only an actual shape change (e.g. a section's first content, or toggling to/from empty) clears and rebuilds that one section."
    - "Out of scope here: reimplementing CI/validation/merge policy in the UI, a new authoritative current-state projection for every durable subsystem, persistent cross-restart history/replay, or an overview-page redesign."

role-aware-issue-structural-assessment:
  description: "Deterministic, side-effect-free structural assessment of a supplied Issue snapshot against an explicitly supplied tracking-parent or implementation-child role, forbidding tracking-parent Requirements (Issue #1951)."
  documentation: "src/auto_coder/role_structural_assessment.py"
  behavior:
    - "`assess_role_structure(manifest, body, role)` takes an existing `NormativeIssueManifest`, the exact Issue body it was built from, and an explicit role (`tracking_parent` or `implementation_child`); it performs no LLM call, GitHub request, mutation, or durable-state write, and never infers the role from Requirements presence, title, informal tracking sentences, or a default."
    - "An unknown, missing, or contradictory role, a non-manifest, or a non-string body returns `ERROR` with no defects, distinct from a Issue structural defect."
    - "A tracking parent is `BLOCKED` with reason `parent_requirements_forbidden` when its body contains any authored Markdown heading titled Requirements (case-insensitive, any of 1-6 `#`, optional trailing closing hashes) anywhere, including an empty section, or any authored REQ-NNN declaration line (plain, bulleted, numbered, checkboxed, or backticked) anywhere in the body, including under Context or Child Issues; renaming the heading alone never rescues a remaining declaration."
    - "Fenced code blocks, indented code blocks, blockquote lines, and HTML comments are treated as non-authored examples and are skipped for both heading and declaration detection; authored text after such a region ends is inspected normally, and ordinary references such as `#123/REQ-001` never match."
    - "A tracking parent is `BLOCKED` with reason `parent_objective_required` when its body has zero, more than one, or an empty authored Objective section (same heading recognition, title Objective); an intact, long Objective is never rejected for exceeding the short-authoring recommendation. Independently detected Requirements and Objective defects are both reported rather than short-circuited."
    - "An implementation child is `BLOCKED` with reason `child_requirements_invalid` whenever the supplied manifest's explicit Requirements contract is absent or invalid (missing, empty, duplicate IDs, malformed entries); a valid contract is `VALID` regardless of title wording. This role performs no Objective check."
    - "A valid tracking parent's manifest requirements remain empty (no fabricated implementation contract), and an invalid child's declarations are never exposed as trusted Requirements; results never mutate the supplied body or manifest."

contract-free-parent-production-lifecycle-admission:
  description: "Wires the role-aware structural assessment (Issue #1951) and Objective-coverage decomposition analyzer (Issue #1952) into `DecompositionValidationLifecycle`'s durable production decision, so a real contract-free tracking parent reaches ordinary Objective-evidence acquisition and set analysis instead of being excluded by a stale all-manifests-valid prerequisite (Issue #1953)."
  documentation: "src/auto_coder/decomposition_validation_lifecycle.py"
  behavior:
    - "`DecompositionValidationLifecycle.decide` gates durable baseline/Objective-evidence capture on each supplied member's own role-aware structural validity (`assess_role_structure`, parent assessed as `tracking_parent`, each child as `implementation_child`) rather than requiring every member, parent included, to carry a valid implementation Requirements manifest; a structurally valid contract-free parent with one nonempty Objective now reaches the durable history baseline, per-member Objective-anchor capture, and the `objective_conflict` integrity check on the same path as a legacy parent that happened to carry Requirements."
    - "A structurally invalid family (a forbidden parent Requirements declaration, a missing/duplicate/empty parent Objective, or an invalid child Requirements contract) still skips evidence capture and reaches the analyzer directly, which reports the same `invalid_issue_structure` `BLOCKED` finding it always did; this change only widens which structurally valid families receive durable Objective evidence, it does not relax any structural defect."
    - "An assessment `ERROR` (unavailable or contradictory role evidence) fails the decision closed as `ERROR` with a diagnostic reason rather than being treated as a structural defect or silently defaulting to unvalidated analysis."

mention-only-pr-ownership-exclusion:
  description: "Prevents an ordinary PR cross-reference or mention from acquiring Issue implementation ownership through startup discovery or lifecycle fallback paths, while preserving explicitly established ownership (Issue #1989)."
  implementation: "extract_lifecycle_directive_issue_references, extract_lifecycle_branch_issue_number in src/auto_coder/issue_context.py; ImplementationSlotRepository.resolve_owner, _lifecycle_issue_owner_for_pr, _validated_lifecycle_issue_reference, _native_connection_issue_owner in src/auto_coder/implementation_slots.py; GitHubClient.has_linked_pr in src/auto_coder/util/gh_cache.py."
  behavior:
    - "`ImplementationSlotRepository.resolve_owner` for a PR candidate no longer consults the broad review-context resolver (`resolve_issue_oracles`); it only recognizes a repository-local PR-body closing directive (`close(s|d|ing)`, `fix(es|ed)`, `resolve(s|d|ing)`, optionally `owner/name#N`), an Issue-bearing head-branch marker, or a live GitHub native connection (`get_connected_prs`) to an Issue that is already an active owner. Bare `#N`, `Issue #N`, `Related issue: #N`, and other mention/relates prose are never consulted and cannot create or change ownership."
    - "A qualified `owner/name#N` directive naming a foreign repository is excluded without ever reading a same-numbered local Issue, so it cannot be rebound to one; an unreadable required Issue lookup raises `ImplementationOwnerResolutionError` instead of silently discarding or fabricating an owner, while a confirmed non-Issue (pull request) reference is excluded quietly."
    - "The native-connection check is bounded to Issue owners already tracked in the slot store, so `_record_open_pr_memberships` (startup discovery, run before reconciliation) can attach an open PR to an existing owner's durable `implementation_prs` only via this restricted evidence, never via a title/body mention; already-recorded `implementation_prs` and provider-session membership are untouched by this filtering."
    - "`GitHubClient.has_linked_pr` now reports only a currently open PR from `get_connected_prs(..., strict=True)`; the previous title/body substring fallback (e.g. matching bare `#N`) is removed entirely, and an unavailable native-connection lookup raises so its sole caller (`issue_processor.handle_stale_jules_issue_sessions`) defers that session's stale-Jules replacement instead of treating the failure as either a found or a missing linked PR."

## Mandatory production-to-view dashboard observability regressions

Dashboard observability is protected by deterministic tests in the ordinary PR
shards and by a documented `scripts/test.sh` invocation. The maintained coverage
inventory maps processing, validation, resumption, CI, merge, and asynchronous
origins to concrete collected tests. Joined regressions execute production entry
points, consume the real structured collector snapshot through the mounted detail
view, and independently assert business outcomes. Negative controls reject missing
emissions, scope reattribution, evidence coercion, and false completion while the
generic renderer continues to accept new or repeated stages without a node map.

Two inventory rows previously cited pre-existing tests that never actually
exercised the diagnostic trace they were listed against: validation-publication
resumption pointed at a durable-effect test that does not touch `TraceCollector`,
and asynchronous PR adversarial validation pointed at a test that mocks out
`_handle_pr_merge` (the function that emits `pr.adversarial-validation`) entirely.
`tests/test_dashboard_observability.py::TestNewOriginCoverage` now drives both
production handlers for real and reads their diagnostic trace back, and the
inventory keeps the original citations alongside the new ones since they still
cover the durable-effect/business-behavior contract. The same file's
`TestOutcomeMatrixCoverage` also adds the previously-unexercised `known_empty`,
`partial`, `throttled`, and `superseded` CI-availability values, ordinary-cloud
routing to the Claude Routine and Codex Cloud backend types, corrective work
accepted without a repair claim, and queued-vs-disabled-vs-blocked validation;
`TestJoinedProductionToView` and `TestAdditionalNegativeAndMutationControls` add
production-to-mounted-view coverage for PR/merge-operation resumption, an
accepted handoff without PR publication, a validation job as its own execution,
two concurrently processed Issues never sharing or swapping execution identity,
and unavailable CI evidence reaching the mounted view as an explicit `unknown`
outcome rather than a coerced boolean.
