# Client Features Documentation

## Read-only implementation-slot snapshots

`ImplementationSlotRepository.snapshot()` exposes an immutable, typed view of
the repository instance's selected durable implementation-owner store. A known
snapshot reports the effective store path, repository, observation time,
configured normal limit, logical-owner rows, recorded execution/PR/provider
membership, admission flags, and normal/emergency occupancy derived from one
complete state image. Missing legacy fields retain their documented absence or
empty/default meaning without migration.

Observation never creates or repairs the state or coordination files, performs
lifecycle cleanup, probes liveness, or contacts an external service. It acquires
an existing coordination lock only non-blockingly; contention and invalid or
unreadable projected state return a typed unavailable result with a source-aware
diagnostic and no fabricated occupancy or successful-observation timestamp.

## Failed Cloud submission capacity recovery

Ordinary and difficult-Issue Cloud dispatch tries the remaining configured Cloud
candidates after a confirmed pre-submission rejection. If every candidate rejects
submission (including unavailable quota), dispatch returns a deferred outcome
without retrying the exhausted Cloud backends through the local fallback.
After its execution ends, the Issue releases its slot atomically only if no other
execution, provider session, or implementation PR remains. This also applies to
an existing empty reservation retried by the current dispatch. Accepted tasks,
indeterminate submissions, and unreadable submission journals retain ownership.
The dashboard records `issue.cloud-submission-slot-release` with `slot_released`
to distinguish recovered capacity from ownership retained for other work.

## Declaration-complete specification validation

Before standalone, child, or decomposition validation is admitted, Auto-Coder
enumerates the repository's current open Issues and reconciles every supported
`Parent-Issue` declaration belonging to the affected family. Native membership
is then re-read as the downstream authority, and a repeated declaration-aware
pass fences concurrent additions or body changes. Unrelated malformed metadata
does not veto a family, while malformed metadata on a native member fails the
family closed. Validation waits for every discovered member's original
creation-plus-60-seconds deadline through durable invalidations; linking and
editing do not create a sliding delay.
## PR priority in live durable processing

The live worker queue serves discovered PRs before waiting Issue and dependency
work, including PRs handed off by Codex Cloud recovery after startup. Equal
priorities retain arrival order. Restart recovery uses the same ordering and
preserves durable generations and delivery coalescing. Running work is not
interrupted; PR priority takes effect at the next worker boundary.
The dashboard queue snapshot exposes this service order and priority (PR: 1,
Issue/dependency: 0); queued work is not an observed processing execution.

## Muse prompt-file transport

Every local Muse task is rendered in full and delivered to `muse exec` through
exactly one adapter-owned `--prompt-file`.  Each invocation uses a distinct,
owner-only regular file outside the target worktree and Git metadata; the file
is finalized before launch, remains available until the child exits, and is
removed on every handled outcome.  Conflicting configured prompt sources fail
before launch, while model, mode, authentication, workspace, session arguments,
and the existing Git-state audit remain unchanged.  Prompt contents are never
placed in process arguments, environment values, shell intermediaries, or
diagnostics.

## Antigravity prompt stdin transport

Local Antigravity tasks use its explicit finite `--input-format text` mode and
deliver the existing stripped, `@`-escaped task through UTF-8 stdin followed by
EOF. This applies to backend aliases, edit/no-edit options, and explicit
continuations while preserving output formatting and result assembly. Configured
positional/print prompt sources and non-text input formats fail before launch.

## Codex prompt stdin transport

Local Codex executions use non-interactive `codex exec` and provide the exact
prepared task payload through finite UTF-8 stdin with `-` as the prompt operand.
This applies to initial calls, explicit `exec resume` continuations, and the
one-shot exec fallback owned by the persistent MCP client. Configuration,
permission flags, environment, output streaming, session evidence, and final
message capture remain intact; configured competing input sources fail before
the task process starts.

## Finite subprocess stdin delivery

`CommandExecutor.run_command()` accepts optional finite text input and delivers
its exact UTF-8 bytes followed by EOF through a private pipe. A managed writer
runs concurrently with stdout and stderr readers so large input and output
cannot deadlock each other, while timeouts and callback interruption retain
control of process cleanup. Input preparation and incomplete delivery fail the
command explicitly, and payload input is rejected for pseudo-terminal runs so
the existing interactive terminal contract remains unambiguous.

## Webhook-first durable CI reconciliation

If another CI delivery arrives while its SHA-to-PR lookup is running, the older
lookup result is discarded and the newer durable correlation retains its quiet
window for retry. This expected supersession does not terminate the invalidation
controller, apply stale PR membership, or prevent other ready PR batches from
being promoted. The pending correlation survives restart.
If a companion controller does fail, supervisor cancellation waits for owned
local work to finish and then propagates, preventing cancelled workers from
continuing or leaving daemon shutdown waiting forever. Explicit graceful drains
still finalize the owned operation's result through their existing checkpoints.

Manual workflow dispatch now publishes a durable repository, pull request,
exact-head and workflow watch before making the external request.  CI webhook
bursts advance that obligation through the shared two-second quiet window,
while a retained 300-second deadline provides targeted missed-event recovery
across restart.  The shared invalidation controller promotes due watches into
the normal pull-request evaluation path; no per-PR polling thread, run-appearance
timeout, or monitor-owned merge path remains.  Dispatch claims remain a separate
suppressing safety record when observations are missing or unavailable.

## Causally scoped CI observation snapshots

Transport-independent CI reads produce immutable snapshots scoped to the API
origin, repository, pull request, exact head SHA, source representation, a fresh
opaque read-cycle identity, and the captured relevant-invalidation epoch.
Workflow facts preserve workflow, run, and explicit attempt identities; check
facts preserve App and check identities plus only explicitly available workflow
associations. Human-readable names and timestamps are diagnostic metadata and
never execution identity.

Availability distinguishes complete known facts, complete known-empty facts,
partial evidence, unavailable reads, throttled reads, and superseded reads.
Unavailable current reads may retain previous facts only as non-authoritative
diagnostics and never turn missing evidence into an empty or passing result.
Unknown attempts and associations remain unresolved, while exact higher attempts
at the same head are distinct activity and fence late older completions.

One bounded in-memory slot authorizes reuse only inside the same active read-only
phase and exact scope, request representation, and epoch. Every phase and read
uses a new opaque identity independent of durable queue generations. A newer
read, relevant invalidation, head or phase change, mutation boundary, governor
wait, or external/LLM work fences earlier reads. Late completions can occupy only
a bounded diagnostic slot and cannot overwrite current facts. Persisted
diagnostics after restart require a fresh authoritative cycle before reuse.
Constructing, publishing, or reusing these observations has no GitHub or provider
side effects and does not itself compute the required-check verdict.

Production GitHub CI integration targets check runs and workflow runs by exact
head and retrieves all pages as one complete observation. Identical authenticated
representations coalesce inside candidate-selection phases; phases do not survive
mutation or external-work boundaries. Deployment approval is a separate serialized
policy consumer which freshly revalidates the run attempt and pending environment
set before submitting an approval, and remembers confirmed or indeterminate delivery.

## Git-state repository hygiene inspection

The standalone `scripts/check_repository_hygiene.py` checker validates either the
complete Git index (the default) or the checked-out HEAD tree.  It reads the explicit
root-file allowlist from that same selected Git state, rejects every tracked root file
outside the boundary, always rejects root-level Python and `.agent-tmp` paths, and
ignores untracked or working-tree-only artifacts.  Invalid policies, conflicted index
states, and unavailable Git states fail closed without modifying the repository.

## Human-only semantic prompt-regression evidence

Semantic prompt-regression Actions executions are classified by verified
repository workflow-path provenance and excluded from PR admission, waiting,
merge, deployment approval, and automatic repair decisions. Their generated
reports are non-actionable only when an exact versioned identity from
`github-actions[bot]` is verified against the represented workflow run and PR;
copied markers, unresolved provenance, ordinary CI, and human instructions keep
their normal authority. The active selective evaluator publishes immutable,
per-attempt human reports through trusted default-branch reporting code, while
deterministic prompt tests continue to run and fail normally in PR Tests.

## Maintained operational scripts

The repository keeps maintained standalone Python utilities under `scripts/`.
The TCP proxy retains its three-argument command-line interface there, and the
comprehensive `make type-check` entry point runs its checker from that location.
Jules session tests protect the automatic pull-request mode and preserve the
caller-provided GitHub repository and starting branch at the HTTP boundary.

## Codex Cloud initial PR publication contract

Every initial Codex Cloud Issue route uses a provider-specific prompt carrying
the complete current Issue, canonical Issue URL, attempt, configured backend,
and actual base branch. The task must implement and validate the Issue, publish
from a unique task branch (never the shared `work` branch), include an explicit
closing reference, and verify the real GitHub PR. Prepared text or a local
commit is not publication; inability to publish must be reported with the
observed blocker, while Auto-Coder continues to treat its independent GitHub
observation as authoritative. Other providers and existing-PR repair prompts
retain their separate ownership contracts.

## Codex Cloud initial PR recovery

The continuously running service recovers repository-scoped accepted Codex
Cloud runs and polls each coherent current Issue attempt independently.  A
fresh completed current-turn observation with complete negative GitHub PR
evidence starts a durable 120-second grace period.  If a fresh pre-send check
still finds no matching PR, the service sends the existing task one exact
`Create PR` message with QA mode disabled.  A crash-safe claim permits at most
one such automatic POST per task, including rejected or indeterminate sends.

Only a verified matching GitHub PR counts as publication.  Open PRs discovered
by polling are handed to the ordinary durable PR-processing queue without a
webhook; publication remains monotonic, and accepted/indeterminate reminders
continue observation without minting a replacement task or reminder budget.

## Process-local specification-validation diagnostics

Standalone intake, normal and explicit worker processing, retained-owner
reevaluation, pending-work resumption, and parent/direct-child scheduling route
individual specification jobs through the same structured diagnostic boundary.
Each producer owns a validation execution, and every waiting caller records an
observation referencing the exact decision identity. READY, BLOCKED, ERROR,
cancellation, and disabled bypass evidence remains distinct. The bounded trace is
observational and process-local; it neither changes validation behavior nor
provides restart-readable review history.

## Durable per-Issue Objective anchors

Every supported individual or complete direct-child-set specification review
captures one repository-and-Issue-number-scoped Objective anchor once the
reviewed member is structurally valid for its role (Issue #1953): a contract-free
tracking parent needs only its required Objective, not a valid implementation
Requirements manifest, while a direct child still needs its own valid explicit
Requirements contract; the set as a whole reaches Objective-evidence capture only
once every member, parent included, passes its own role-aware structural check.
The first valid individual baseline takes precedence for legacy migration;
otherwise the first admitted current snapshot wins atomically.
Anchored text and explicit legacy absence survive edits, relationship changes,
concurrent review work, and restart. Individual and decomposition prompts receive
the immutable original state separately from the current structural extraction,
and Objective evidence never enters the normative Requirement manifest. Invalid,
unreadable, or unpersistable required evidence fails closed before semantic review.
Before semantic execution or cached-result reuse, an anchored current Objective is
compared literally after CRLF normalization and outer-whitespace trimming. Missing,
empty, duplicate, or changed text produces a structured `objective_conflict` and
in-place restoration guidance; legacy `UNANCHORED` Issues continue ordinary review.
With an intact anchor, semantic review uses its purpose only to detect concrete
outcome conflicts and reject adjacent scope, never to promote Objective prose into
Requirements.
Complete-set review preserves a distinct fixed purpose for the parent and every
direct child. It checks both each child's scope and whether their explicitly
contracted outcomes compose to the parent's purpose; tracking parents coordinate
missing ownership rather than receiving a final implementation pass. Set findings
support `objective_conflict` in addition to the Objective-coverage categories that
replaced the former explicit parent-Requirement oracles, and unchanged-purpose
restoration is an in-place repair.

## Native sibling dependency reconciliation

GitHub Issue lifecycle, native dependency, and sub-issue deliveries now create
a durable repository-scoped reevaluation obligation before acknowledgement.
The obligation conservatively rediscovers every open Issue (including body-only
declarations), coalesces duplicate deliveries, survives restart, and feeds each
identity through normal authoritative intake. Endpoint Issue numbers are used
only when their repository identity matches the monitored repository. Startup
performs the same open-Issue reconstruction, while creation-anchored
stabilization remains the only fixed eligibility delay.

After the Issue creation-stabilization window, production intake treats a
supported `Blocked-By:` line as the complete desired native GitHub incoming
dependency set. It first materializes declared parent relationships, requires
every dependency to be a distinct direct sibling Issue, validates the complete
family (including closed children) for cycles, and then reconciles GitHub using
stable Issue IDs with complete incoming/reverse pagination and authoritative
readback. Removing the declaration leaves native dependencies unmanaged, while
an explicitly empty declaration clears them for a supported child declaration.
A standalone Issue may carry an empty `Blocked-By:` to mean no sibling
prerequisites only when its parent declaration is absent and a strict GitHub
read confirms no native parent. Nonempty/malformed declarations, invalid parent
metadata, native children without supported parent declarations, and unavailable
parent reads do not receive this exception. This avoids indefinitely waiting for
an undeclared parent on otherwise eligible standalone Issues. The final dispatch
check emits `issue.sibling-dependency-gate` with completed (dependency check
satisfied), blocked (invalid), or deferred (waiting/unavailable); satisfaction
alone is not implementation completion.

Malformed, conflicting, non-sibling, nonexistent, pull-request, and cyclic
declarations are rejected before implementation ownership. A marked actionable
diagnostic is reused across retries, and readiness is withdrawn independently
from both the declaring child and its current authoritative parent. Operational
or ambiguous GitHub failures fail closed without asserting a specification
defect or withdrawing readiness. Valid open direct or transitive prerequisites
defer implementation (but not enabled semantic validation); only authoritative
closure satisfies them.

Issue numbers do not imply precedence. Independent eligible siblings may run
concurrently; numeric ordering is used only as a deterministic presentation
tie-breaker. Authors must express required order explicitly: every generated
child should accompany `Parent-Issue: #<parent>` with `Blocked-By:` (empty for a
dependency root, or comma-separated local references such as `#12, #34`).
Dependency metadata is structural and remains outside the child's normative
`## Requirements` section. Existing unannotated families use their reconciled
native dependency edges and receive no historical number-based backfill.

## Shared, secret-safe GitHub request boundary

The production GhApi/hishel boundary exposes a typed outcome for each actual
wire attempt and separately records local cache results. Outcomes retain HTTP
status, evidence-based authentication/throttling classification, provenance,
request and attempt identities, safe rate-limit metadata, and delivery
certainty. Optional admission and observation hooks operate at the transport
boundary, including cache revalidation, so a mutation can be refused before it
is sent. Diagnostics are emitted through the existing colored console and
bounded rotating-file loguru sinks without request payloads, credentials,
signed queries, GraphQL documents or arbitrary successful response bodies.
Controller-owned strict reads, startup and pagination reads, authentication
verification, reviewer GitHub App operations, Actions-secret publication, and
Actions artifact API requests use the same process-wide admission/observation
seam while retaining separate credentials and uncached authority semantics.
Every API-origin redirect hop is independently governed. Cross-origin artifact
downloads preserve their bytes but are excluded from GitHub quota observations,
and authorization is not forwarded by the redirecting HTTP client.

## Shared GitHub request pacing and cooldown

Each running controller applies one synchronized admission policy per normalized
GitHub API origin across repositories, clients, workers, and credential roles.
The local protective ceilings are one in-flight request, 300 network attempts per
rolling 60 seconds, 60 mutations per rolling 60 seconds, and 400 mutations per
rolling hour, with one second between mutation completion and the next mutation.
These are conservative local ceilings, not a guarantee of GitHub allowance.
Durable GitHub-dependent obligations preserve repository/entity, processing stage,
semantic revision, independent unfinished effects, and the next eligible time across
restart. Actual throttle retries are bounded to three retries after the first response;
local admission refusals do not spend this budget, while authentication, forbidden,
indeterminate-delivery, and exhausted work remain visible operational blocks. Manual
workflow dispatch claims use holder tokens so only the current holder can publish a
definite non-send/rejection outcome; stale holders cannot unlock or overwrite a newer
claim. The supported manual retry route is to change the semantic input revision or
remove the blocked row from ~/.auto-coder/github_pending_work.db after correcting the
operational cause; neither route bypasses the shared governor.

Fresh primary, secondary, and GraphQL throttle evidence closes the origin-wide
gate using Retry-After, reset, and exponential local cooldown evidence; cache-only
reads and non-GitHub origins do not consume or alter these budgets. Work that
cannot enter immediately receives a typed, definitely-not-sent deferral carrying
the reason and earliest known retry time, allowing webhook and local work to
continue without quota sleeper tasks.

The two kinds of deferral are separated at the request boundary. Deferrals the
governor imposes on itself -- one in-flight request, mutation spacing, and the
rolling attempt/mutation windows -- resolve without any GitHub cooperation, so a
request waits for its stated eligibility (bounded, currently 90 seconds) and is
then sent, rather than failing a concurrent worker's read. Throttle cooldowns and
unusable governor state are not waited out: they propagate immediately as typed
deferrals to the callers that own durable resumption for them. Exhausting the
wait budget emits a `wait_exhausted` governor diagnostic and re-raises the
original deferral.

Admission reservations, rolling budgets, mutation-completion spacing, throttle
episodes, and cooldown deadlines are durably recorded in the controller-wide
`~/.auto-coder/runtime/github/request_governor.sqlite3` store. Restart recovery
conservatively charges unresolved attempts and adds a recovery cooldown; corrupt,
incompatible, or unwritable state fails GitHub admission closed. Persisted records
are origin-scoped and contain no credentials or request content.

## Crash-safe Codex Cloud submission ownership

Initial Codex Cloud dispatch publishes a repository- and Issue-attempt-scoped
durable claim before invoking the remote-capable CLI. Claims retain the named
backend, effective environment, base branch, delivery outcome, and provider
task identity/URL when known. Accepted and indeterminate claims suppress
redispatch across workers and restarts. Accepted tasks are reported as handed
off only after the authoritative run journal and `cloud.csv` ownership
projection agree; missing projections are repaired without another submission,
while corrupt or contradictory ownership fails closed for operator attention.

## Bounded PR test shards

Each PR Tests shard runs the complete target-repository test script with a
180-second attempt deadline. A timed-out process group is terminated (with a
10-second TERM grace before KILL) and retried exactly once; ordinary failures,
cancellation, launch errors, and cleanup errors are not retried. Attempt logs
are retained separately, retry reports start clean, and an eight-minute Actions
step limit provides an independent safety boundary.

Shard output includes individual test names and emits Python thread stacks when
a test phase exceeds 30 seconds, so line-buffered collection cannot disguise a
later stalled test as the last completed file. Codex MCP fallback regressions
exercise finite stdin and real subprocess EOF and assert reader-thread cleanup;
unbounded mock streams must not leak busy readers into subsequent tests.
This is test infrastructure only: production processing, structured trace events,
and dashboard projections are unchanged.

## Release and beta deployment channels

Successful `main` builds publish one immutable GHCR image tagged by commit and
advance `beta`; failed builds cannot move that tag. The operator-only promotion
workflow derives and verifies the current tested `beta`, records its manifest
under the immutable `release-<SHA>` history tag, and advances `release` without
rebuilding. A separate rollback workflow accepts exactly one explicit target:
a validated dated GitHub Release tag, or a full SHA from pre-catalog immutable
history. It pins the selected digest and moves only `release` without rebuilding.
Registry reads validate concrete SHA-256 digests and fail closed on transport,
authentication, malformed-output, and ambiguous errors. Promotion creates an
immutable history tag only when the registry explicitly confirms it is absent;
creation uses an atomic conditional registry write, so an existing or
concurrently created history tag is validated and is never rewritten.
`compose.channels.yml` pins both
instances by digest and gives release and beta separate durable state, workspace,
cache, and log roots. Each externally deployed process records its channel and
artifact identity, disables internal package updates, and fails closed unless a
shared ownership registry assigns its repository to that channel. Repository
assignment is atomic and cannot change channels while the old channel's durable
implementation-slot state is active or unreadable.

This file documents the client-facing features and tools provided by auto-coder.

## Explicit single-target outcome reporting

`process-issues --only` reports the authoritative outcome of the requested target
as Success, Deferred, Skipped, Blocked, or Failed. The engine preserves the
resolved Issue/PR identity, structured outcome, actions, and reason even when a
non-successful target is absent from the legacy processed-item collections.
Missing or contradictory explicit results fail closed, and plain-number targets
retain their authoritatively resolved Issue or pull-request type.

## Repo-scoped feature-switch contract for optional pipeline gates

Auto-Coder exposes canonical, repo-scoped boolean feature settings for optional
pipeline gates and self-repair loops:
- `issue_specification_validation`: Controls whether individual Issue specification validation runs before implementation admission. Individual reviews perform ambiguity closure and next-review prediction; caller-reconciled child reviews additionally check material cross-Issue dependencies, propagation, invalidation, evidence reuse, and stale-result authority without treating related prose as normative.
- `issue_decomposition_validation`: Controls whether parent/child decomposition validation runs before sub-issue implementation admission.
- Decomposition reviews perform ambiguity closure and next-review prediction over
  the exact caller-supplied parent/direct-child set. They separately trace
  membership and member-content mutations through identities, individual and
  set evidence, invalidation, readiness, delayed completion, and implementation
  authority, including transitive parent/child graph consumers. These checks
  remain evidence constrained and do not turn implementation freedom, shared
  ownership, prose-only relationships, grandchildren, or hypothetical future
  lifecycles into blockers.
- `pr_adversarial_validation`: Canonical switch for pre-merge adversarial review validation.
- `pr_review_thread_gate`: Controls whether unresolved PR review threads gate PR processing and merge.
- `automatic_test_fix`: Controls whether automatic test-failure repair loops execute.

Each switch defaults to `true` when unconfigured. Effective values are resolved
with global-versus-repository precedence (`~/.auto-coder/<owner>/<repo>/config.toml`
overrides `~/.auto-coder/config.toml`).
Settings can be declared under the `[features]` table or at the top level of `config.toml`.
Configured values must strictly be booleans (`true` or `false`); any non-boolean
value raises an explicit configuration error identifying the invalid setting.
`AUTO_CODER_ENABLE_ADVERSARIAL_VALIDATION` remains supported as an environment-variable
compatibility override for `pr_adversarial_validation`, and
`AutomationConfig.ENABLE_ADVERSARIAL_VALIDATION` stays synchronized with the effective
`pr_adversarial_validation` value.

## Individual Issue specification validation kill switch

When `issue_specification_validation` is set to `false`, Auto-Coder completely
bypasses individual Issue specification validation at the candidate admission
boundary:
- No individual validation jobs are scheduled, joined, or executed for candidates.
- Candidates proceed directly through the remaining pipeline gates without
  requiring an individual specification validation READY verdict.
- Bypassing validation does not rewrite, delete, or convert existing durable
  specification records (such as BLOCKED, ERROR, or REISSUE_REQUIRED states).
- The bypass produces no synthetic validation records, PR/Issue comments, label
  mutations, or implementation attempt increments.
- Non-validation admission gates (author allowlist, implementation-ready label,
  open state, parent/child relationships, explicit sibling dependencies, and slot
  ownership) remain strictly enforced.
- Disabling individual validation does not consume scheduler capacity or block
  other enabled validation categories, such as parent/child decomposition validation.
- When the switch is re-enabled, the authoritative current generation resumes
  normal validation lifecycle enforcement.


## Parent/child decomposition validation kill switch

When `issue_decomposition_validation` is set to `false`, Auto-Coder completely
bypasses parent/child decomposition validation at candidate and parent processing
boundaries:
- No decomposition validation jobs are scheduled, joined, or executed for
  `implementation-ready` parent/child sets.
- Eligible child issues proceed through the remaining pipeline gates without
  requiring a READY decomposition verdict.
- Bypassing decomposition validation does not rewrite, delete, or convert
  existing durable decomposition-validation records (such as BLOCKED, ERROR,
  or REISSUE_REQUIRED states).
- Existing durable decomposition records do not block or authorize child
  implementation while the switch is disabled.
- The bypass produces no synthetic decomposition validation records, comments,
  label mutations, or implementation attempt increments.
- Non-decomposition admission rules (authoritative parent/child reconciliation,
  parent open state, child membership, sibling implementation ordering, parent
  `implementation-ready` eligibility, individual specification validation, and
  implementation slot ownership) remain strictly enforced.
- Disabling decomposition validation does not consume validation scheduler
  capacity or prevent enabled validation categories (such as individual Issue
  specification validation) from using the scheduler normally.
- When `issue_decomposition_validation` is re-enabled, Auto-Coder resumes the
  ordinary decomposition lifecycle using the authoritative current parent/child
  set identity, and existing durable evidence for the unchanged generation is
  again enforced.


## PR adversarial validation kill switch

Each adversarial-validation attempt binds repository-relative subprocesses to
its own detached worktree without changing the service process working
directory. The worktree HEAD is verified against the selected PR SHA before
evidence collection and at LLM and dynamic-check boundaries; unverifiable or
redirected execution fails closed. Concurrent attempts own and clean up only
their respective worktrees.

When `pr_adversarial_validation` is set to `false`, Auto-Coder completely bypasses
PR adversarial validation during PR candidate prioritization and merge-gate evaluation:
- No adversarial validation reviewer is invoked, scheduled, or executed for PRs.
- No new adversarial reviews, status comments, review threads, or attempt records
  are created, and attempt execution sequences are not incremented.
- Existing adversarial verdicts (such as `NEEDS_FIX` or `NEEDS_TESTS`) do not lower
  PR candidate priority, block internal merge eligibility, or trigger adversarial
  repair/re-review loops.
- Unresolved review threads authoritatively identified as originating from Auto-Coder's
  adversarial validator do not block internal merge eligibility through the generic
  review-thread gate.
- Existing adversarial review threads and published review verdicts remain unmodified,
  unresolved, and untouched on GitHub (they are not resolved, dismissed, deleted, or edited).
- Ordinary non-adversarial review threads (such as human reviewer comments) remain
  governed independently by `pr_review_thread_gate` and continue to block PR merge.
- Other independent PR gates (CI checks, GitHub branch protection, mergeability checks,
  auto-merge configurations, and mergeability remediation) remain strictly enforced.
- When `pr_adversarial_validation` is re-enabled, normal adversarial validation semantics
  resume for the exact current PR HEAD commit SHA; authoritative same-HEAD adversarial
  verdicts become active again, while verdicts for older HEADs do not become current.


## PR review thread gate kill switch

When `pr_review_thread_gate` is set to `false`, Auto-Coder completely bypasses
unresolved PR review-thread gating during PR processing and merge evaluation:
- Unresolved PR review threads do not block internal merge eligibility, lower
  PR candidate priority, or trigger automatic review-thread repair/reply cycles.
- Failure or unavailability of review-thread enumeration, GraphQL detail lookups,
  provenance resolution, or thread-gate evidence does not cause the PR to be
  deferred or failed solely because that evidence is unavailable.
- Review-thread lookup paths are avoided when no other independently enabled
  feature requires thread data; when another enabled feature (such as adversarial
  validation) requires thread data, it reads review threads according to its own contract.
- Disabling `pr_review_thread_gate` does not disable `pr_adversarial_validation`;
  if adversarial validation remains enabled, its authoritative current-HEAD verdict
  may still block or reprioritize the PR according to its own contract.
- Existing review threads remain unmodified, unresolved, and untouched on GitHub
  (they are not resolved, dismissed, deleted, or edited).
- GitHub branch protection, required approving reviews, required status checks,
  mergeability enforcement, and merge rejections returned by GitHub remain strictly enforced.
- When `pr_review_thread_gate` is re-enabled, normal review-thread gating resumes
  using the authoritative current review-thread state on GitHub without carrying
  forward fake resolutions from the disabled interval.


## Automatic test-failure repair loop kill switch

When `automatic_test_fix` is set to `false`, Auto-Coder completely disables
automatic repair loops for local test and GitHub Actions failures:
- Auto-Coder does not invoke an LLM/backend to repair local-test or GitHub Actions
  failures, does not start or continue automatic test-fix iterations, and does not
  create repair commits or pushes caused by those failures.
- Disabling automatic test fixing does not convert a failing, timed-out,
  unavailable, or otherwise non-passing test or check result into PASS, success,
  or mergeable state; observed test/check state continues to participate in PR
  eligibility according to existing non-repair policy.
- Repeated processing of a failing PR while automatic test fixing is disabled
  does not increment automatic test-fix attempt counters or consume MAX_FIX_ATTEMPTS
  budget solely because the disabled repair path was encountered.
- Disabling automatic test fixing does not disable execution or observation of
  tests or checks when required for merge eligibility or other workflows, and does
  not disable independent PR automation such as adversarial validation, review-thread
  gating, mergeability remediation, or auto-merge policy.
- Bypassing automatic repair does not discard, reset, revert, or destructively clean
  an existing workspace or branch state; it stops cleanly before repair-owned mutation.
- When `automatic_test_fix` is re-enabled, a failing PR resumes ordinary repair
  policy with its genuine configured attempt budget unaffected by the disabled interval.


## Durable reissue-required specification remediation

Individual Issue specification review treats decision-critical semantics delegated
only to existing/current behavior, authorization rules, repository conventions, or
external authorities as an underspecified contract. It also verifies that actor,
permission/capability, lifecycle, and ownership distinctions that change required
behavior are established and reachable from the normative Requirements rather than
invented by acceptance scenarios or contextual prose. Repository implementation and
tests may expose the impact of a gap but cannot repair its normative authority.
References to existing fields, named interfaces, or standards remain valid when the
Requirements themselves define enough observable semantics to decide correctness.

Specification validation has a durable repair-round circuit breaker. Individual
Issues and parent decomposition sets independently count distinct authoritative
contract generations whose trustworthy BLOCKED decision was applied as
`EDIT_IN_PLACE`. The `[validation].repair_round_limit` positive integer setting
defaults to `3`. Once exhausted, the next new generation is still reviewed and
may become READY, but another `EDIT_IN_PLACE` result is upgraded to terminal
`REISSUE_REQUIRED` with a machine-readable limit reason. Duplicate observations,
policy-only reruns, errors, stale results, READY results, and semantic reissue
decisions do not consume repair rounds; counts survive restart and remain tied to
the stable Issue or parent number.

Individual and parent/decomposition specification results carry a strict
remediation disposition in addition to their unchanged semantic verdict.
`READY` and `ERROR` use `NONE`; `BLOCKED` uses either `EDIT_IN_PLACE` or
`REISSUE_REQUIRED`. A current `REISSUE_REQUIRED` decision is durably recorded
against the stable repository/Issue number before GitHub side effects. The stop
survives edits, relabeling, validation generations, and controller restarts, so
that Issue (or parent set) cannot later authorize implementation. Stale or
withdrawn submissions cannot create the marker. Child-level terminal results
mark only the child and withdraw only its currently authoritative submitted
parent, leaving the parent and siblings unmarked.

Each stable Issue number also receives an immutable individual-review baseline
when its first valid authoritative title, body, and Requirement manifest enter
semantic analysis. Later reviews receive that baseline and the deduplicated
history of material BLOCKED outcomes actually applied to current submissions.
This evidence is used only after the current-contract analyzer independently
returns `BLOCKED`: responsibility-boundary expansion, unsafe decomposition, or
cumulative material drift selects `REISSUE_REQUIRED`, while a correction within
the baseline responsibility selects `EDIT_IN_PLACE`. History, Issue size,
difficulty, and mere textual change cannot turn `READY` or `ERROR` into
`BLOCKED`, and child-level reissue remains scoped to the child.

The specification-review regression corpus includes a provenance-preserving,
explicitly synthetic reconstruction of the historical `auto-coder#1790`
sequence. It records each supporting validation/supersession comment and treats
the sequence only as a negative remediation oracle: cumulative independent
ownership, urgency, label-resolution, prompt-selection, and logical-owner layers
must not be mistaken for endlessly local edits. The reconstructed prose is not
an exact GitHub snapshot and is not a normative source for production behavior.

Each stable parent Issue number likewise receives an immutable decomposition
baseline when its first valid authoritative parent and complete direct-child set
enter semantic analysis. The baseline preserves every stable Issue number,
title, body, and Requirement manifest exactly; later edits, membership changes,
readiness changes, and validation-policy changes do not rewrite it. Applied
material set-review outcomes are retained and supplied as non-normative evidence.
After the current-set analyzer independently returns `BLOCKED`, the reviewer
selects `REISSUE_REQUIRED` when the smallest safe remedy replaces the
parent/direct-child responsibility graph or accumulated applied repairs have
materially transformed it. Otherwise a same-graph correction remains
`EDIT_IN_PLACE`. Historical drift and simple size or membership changes cannot
create a blocker, change current Requirements, or alter a current `READY` /
`NONE` result. Set reissue marks only the stable parent; children remain subject
to their independent review lifecycles.

## Durable direct parent/child implementation exclusion

Every production Issue implementation admission obtains cache-bypassing native
parent and complete direct-child evidence while holding the shared durable slot
lock. Each composite hierarchy read is bracketed by cache-bypassing Issue revision
reads, and the revision must remain unchanged before the evidence can authorize
admission. A
present logical owner for either direct side rejects the new owner independently
of normal, explicit, forced, or emergency capacity. Operational or ambiguous
hierarchy reads fail closed and remain distinct from capacity and semantic
validation outcomes. Hierarchy-guarded records retain their pending marker and
admission evidence for their lifetime. Every later execution admission, including
restart recovery, writes its execution before a final hierarchy refresh and must
discard the guarded owner on conflict or changed evidence before it can return to
implementation dispatch. Once an admission has succeeded, later failed execution
attempts restore that established owner, including its executions, PRs, and provider
sessions; only the failed attempt is discarded. Unrelated Issues and siblings retain
existing concurrency.
## Graceful daemon shutdown

The long-running `process-issues` daemon handles both SIGINT and SIGTERM by
entering an observable draining state. Draining stops candidate admission and
capacity/provider dispatch, preserves queued and newly delivered webhook
invalidations for restart, and waits for already-started local synchronous LLM
or validation work to reach its durable completion boundary. Durable remote
provider work does not delay shutdown. A second SIGINT explicitly force-stops
the drain and is logged separately. Repository Compose services allow a
30-minute stop grace period, and the image's exec-form entrypoint delivers
Docker's SIGTERM directly to Auto-Coder.

## Implementation-ready Issue dispatch gate

This gate is the implementation-ready specification quality contract from
Issue #1730.  It is one shared production boundary rather than an optional
planning phase: standalone submissions require a current individual `READY`,
and parent submissions require both a current decomposition `READY` and a
current individual `READY` for the sequentially selected direct child.  No
parent Requirement is inherited by a child.  `BLOCKED` withdraws the relevant
submission and requires an explicit resubmission, whereas operational `ERROR`
preserves it for retry.  These checks cover daemon, explicit/urgent, local, and
cloud dispatch and precede implementation ownership and capacity admission.
They do not create `plan.md`/`tasks.md`, allocate implementation slots, relax
quota or routing policy, or permit sibling implementation in parallel.

Before classifying or snapshotting any readiness submission, Auto-Coder examines
every line-form `Parent-Issue`, `Parent_Issue`, or `Parent Issue` declaration,
rejects malformed, ambiguous, self-referential, contradictory, missing, PR, and
structurally rejected targets, and materializes one valid same-repository target
as the native GitHub parent. Transport, authorization, rate-limit, and service
failures remain retryable operational failures. The Issue and its native graph
are fetched again after reconciliation; body metadata is never used as a second
parenthood oracle by validation or implementation. Every authoritative direct
child, including closed children, is reconciled before a parent-set identity is
created. Explicit processing observes the same creation-anchored one-minute
stabilization window as webhook and startup recovery, and changed identities can
be validated while existing implementation ownership remains intact.

An Issue can enter implementation only while its current authoritative GitHub
snapshot contains the `implementation-ready` label. Auto-Coder checks this
cache-bypassing snapshot at the shared pre-dispatch boundary before reserving an
implementation slot, adding ownership, creating a branch, or starting any local
or cloud backend. The rule also applies to explicit `--only` and forced runs;
removing the label before dispatch makes the Issue ineligible again.

Semantic validation decisions are bound to the repository and Issue number, an
exact SHA-256 digest of the authoritative title and body, and a policy identity
covering the analyzer prompt, structured finding contract, provider route, and
model. Completed `READY` and `BLOCKED` decisions are durable across restarts;
transport or malformed-output `ERROR` decisions are never cached. Validation is
coalesced per identity and happens before implementation capacity is acquired.
Immediately before dispatch, Auto-Coder re-fetches the Issue and rejects stale
`READY` evidence if its text changed or readiness was withdrawn.

A current `BLOCKED` decision independently denies dispatch even if its GitHub
updates fail. Before publishing its single identity-marked actionable summary
and before removing `implementation-ready`, Auto-Coder re-fetches and compares
the generation. Consequently a late result cannot modify edited Issue text, and
an edit after label removal is not silently resubmitted; a user must explicitly
add `implementation-ready` again. Validator `ERROR` preserves the label and
publishes no specification-defect claim so a later attempt can retry.

When the submitted Issue has direct children, its `implementation-ready` label
submits the exact parent/direct-child specification set instead of authorizing a
standalone parent implementation. Auto-Coder binds decomposition decisions to
the repository and parent, stable direct-child membership, exact parent and child
title/body digests, and the effective decomposition prompt, result contract, and
provider/model route. Closed children remain generation members, so completing a
sibling does not invalidate a reusable durable `READY` decision.

Container parents are coordination-only specification sets and never enter an
implementation backend, including explicit, forced, urgent, local, cloud, and
recovery routes. Once the exact current decomposition and every exact current
child have reusable `READY` evidence and every direct child is closed, a final
cache-bypassing reconciliation closes the still-submitted parent directly. Any
identity or membership drift, reopened child, validation `ERROR`, or GitHub close
failure leaves completion observable and retryable without implementation fallback.
Parent relationships may be established only against an open same-repository
Issue, and an Issue that is already a child or already has children cannot be
made the middle of a nested hierarchy. Pre-existing nested hierarchies fail
closed until manually corrected.

Set and direct-child validation jobs are eagerly coalesced by exact identity and run
concurrently under one configurable positive `process_issues.validation_concurrency`
bound (default 2), independently of implementation capacity. Standalone validation
uses the same global bound. Validation completion order never changes sequential
sibling implementation order. A current set `BLOCKED` result removes readiness from the parent and
publishes one identity-marked set summary only after a fresh generation check;
`ERROR` preserves the submission and is retried. Once the set is `READY`, the
first eligible child in the existing sequential sibling order receives its own
exact-generation specification validation without requiring or receiving a
child `implementation-ready` label. Child `BLOCKED` similarly withdraws only a
still-current parent submission, while child `ERROR` preserves it. Immediately
before ownership and dispatch, both the live parent set and child identities are
re-fetched, and parent-label withdrawal, membership edits, or specification edits
fail closed.

Adversarial PR validation has a separate, instance-local
`process_issues.adversarial_validation_concurrency` bound (default 2; set it to 1
for serialized execution). Capacity is acquired only after CI, review, and prior-result
eligibility gates pass. It remains owned through isolated-worktree cleanup, durable
attempt finalization, publication, and merge authority checks. Duplicate local triggers
for one PR are coalesced, while durable attempt sequence fencing prevents an older
same-head result from gaining authority after any newer attempt starts.

## Adversarial implementation-readiness analysis

Auto-Coder exposes a provider-independent semantic analysis operation for an
Issue's authoritative normative manifest. It treats title, body, examples, and
optional parent context only as non-normative evidence, never reparses Markdown
to redefine Requirements, and does not inspect repository code. The operation
returns a strictly validated `READY`, `BLOCKED`, or fail-closed `ERROR` result.
Blocked findings use stable material-defect categories, exact affected
Requirement IDs, and (for false-success gaps) a concrete incorrect outcome and
the missing normative boundary.

## Adversarial parent/child decomposition analysis

Auto-Coder exposes a provider-independent set analysis for exactly one supplied
parent and its authoritative direct-child membership. The parent is a
contract-free tracking coordinator: before any model use, a shared role-aware
structural assessment (Issue #1951) deterministically rejects a forbidden parent
Requirements heading/declaration, a missing/duplicate/empty parent Objective, or
a missing/invalid child Requirements contract as `BLOCKED` with remediation
`EDIT_IN_PLACE` and `invalid_issue_structure` findings identifying the offending
member and source location; a structurally valid parent always contributes an
empty implementation-Requirements manifest and reaches ordinary semantic
analysis. It consumes each Issue's prebuilt normative Requirement manifest and
uses titles and bodies only as non-normative evidence. The strictly validated
result is `READY`, `BLOCKED`, or fail-closed `ERROR`; blockers identify supplied
Issue identities, one stable decomposition category, and the smallest necessary
contract clarification. A `missing_requirement_ownership` or
`decomposition_false_success` finding always references the parent with an
empty Requirement list and quotes the relevant supplied parent Objective text,
rather than citing a parent Requirement ID (parents never have one). The analysis
detects missing child ownership against the parent's fixed Objective, cross-Issue
contradictions, unstated dependencies, incompatible boundary semantics, and cases
where every child can pass while the parent's Objective still fails, without
imposing one-to-one ownership, internal implementation choices, or a final
independent parent implementation pass. Before verdict, it closes each material
ambiguity across directly related graph consumers, distinguishes membership
changes from member specification-generation changes, traces stale and reusable
individual/set evidence through readiness and authorization, and predicts other
defects already derivable after the proposed clarifications. This closure is
strictly bounded to the caller-supplied parent and complete direct-child set.

## Issue requirement-contract intake gate

The shared requirement contract also exposes a provider-independent normative
Issue manifest. It reports explicit-contract presence and structural validity,
and exposes exact, ordered `REQ-NNN` text only for a valid contract. Intake and
adversarial validation consume this same line-oriented manifest boundary;
missing contracts remain explicit in the manifest and invalid contracts expose
no trusted partial entries.

Before any implementation slot, label, branch, local backend, or cloud task is
started for an Issue, Auto-Coder validates an explicit Markdown
`## Requirements` section with the same deterministic parser used by adversarial
PR validation. Explicit contracts must contain only unique `REQ-NNN:` entries;
empty, malformed, and duplicate-ID contracts are rejected with an actionable
Issue comment. The intake gate bypasses the candidate-list cache and reads the
current Issue type and body in one authoritative snapshot. A versioned body
fingerprint prevents repeat scans from posting the same diagnostic, while an
edited body is evaluated again and can proceed normally once valid. Issues
without an explicit Requirements section continue to use legacy requirement
extraction.

## Structured PR processing outcomes

The dependency-bot processing policy (`IGNORE_DEPENDABOT_PRS`,
`AUTO_MERGE_DEPENDABOT_PRS`) is enforced by one shared decision
(`evaluate_dependency_bot_admission` in `src/auto_coder/pr_processor.py`) at
the common PR-processing boundary in
`AutomationEngine._process_single_candidate_unified_impl`, immediately after
the PR author-allowlist check and before any implementation reservation,
execution, or admission-related PR membership is created. This applies to
every PR-processing origin -- startup-discovered and webhook-invalidated
PRs, synchronous `run()` candidates, explicit single-target processing, and
pending-work/merge-operation resumption -- not only the optional prefilter
retained in `AutomationEngine._get_candidates` for priority scheduling. When
`AUTO_MERGE_DEPENDABOT_PRS` is enabled, the common gate re-fetches
cache-bypassing PR metadata and same-HEAD CI evidence for the current
evaluation and reconfirms the PR's open/mergeable/HEAD facts again after
that CI read, rather than reusing whatever the collector or an earlier
evaluation already decided; a policy refusal is `SKIPPED` with a specific
reason, while unavailable/incomplete evidence is retryable `DEFERRED`, and
neither outcome disturbs an already-retained implementation owner.

Codex Cloud pull requests whose authoritative remote head is the shared
``work`` branch are rejected at the common merge/review boundary before CI,
adversarial validation, repair delivery, checkout, or merge work. PR metadata
is refreshed from GitHub without cache before every safety decision; a
failed or incomplete refresh fails the processing pass closed. The existing
task is asked to republish from a task-specific branch, retaining linked-Issue
ownership only when that request succeeds.

PR processing propagates a machine-readable `success`, `deferred`, or `failed`
outcome through the automation engine. Internal exceptions remain visible in the
human-readable action diagnostics and are also added to the top-level errors, so
single-item completion output cannot report a false success. Expected states such
as red CI, merge gates, and cloud-task waits remain deferred rather than failures.

Codex CLI provider transport failures are classified from structured diagnostic
events (with a conservative text fallback). Exhausted reconnects defer the
current target to normal scheduling without consuming an implementation attempt,
while preserving the provider status and endpoint diagnostic for operators.

## Configuration

#### One-way Codex authentication publication

An optional `[github_secrets]` table in `config.toml` publishes the exact local
Codex login file (`$CODEX_HOME/auth.json`, or `~/.codex/auth.json`) to a
repository Actions secret. Publication is disabled by default. Enabling it
requires a dedicated `token` and explicit `repository = "owner/name"`; the
optional `secret_name` defaults to `CODEX_AUTH_JSON`. This credential is used
only by the Actions Secrets publisher and is never shared with ordinary GitHub
Issue, PR, repository, or workflow operations. Invalid or unavailable local
JSON is never published, remote secret values are never read, and publication
failures do not stop normal processing. A later run republishes the complete
current file, allowing refreshed local login state to replace stale CI state.

```toml
[github_secrets]
enabled = true
token = "a-dedicated-secrets-write-token"
repository = "owner/name"
secret_name = "CODEX_AUTH_JSON"
```

#### Muse Code local backend

Meta Muse Code is available as the `muse` backend and as named aliases with
`backend_type = "muse"`. Install and authenticate the `muse` CLI (or provide
`MUSE_API_KEY`) before startup. Auto-Coder invokes `muse exec` once with the
configured model and edit/no-edit options, transporting the complete rendered
task in an execution-scoped private `--prompt-file` outside the repository.
Muse may inspect files, edit the working tree, and run tests, but Auto-Coder
exclusively owns branches, HEAD, staging, commits, pushes, and pull-request
lifecycle operations. A lifecycle mutation, or any repository mutation during
no-edit execution, fails the run.

#### Authoritative Codex Cloud task IDs

Codex Cloud task associations use one shared parser across PR metadata, PR bodies,
issue sessions and comments, CI continuation, adversarial feedback, review repair,
and conflict repair. Only the provider-issued `task_e_<token>` shape is accepted;
arbitrary prefixed values such as `task_id` and `task_fake` are rejected and do not
block fallback to a valid provider task URL from a lower-priority source.

#### Forced adversarial-validation recovery

An explicit `--only <PR> --force` run starts a new adversarial-validation
attempt for the current head even when that head already has a verdict or the
normal review limit has been reached. Ordinary scheduling and non-forced
`--only` runs retain same-head and review-limit suppression. Every attempt has
a durable, start-ordered identity; prior reviews remain immutable, overlapping
attempts remain distinct, and a late older completion cannot supersede the
newer applicable verdict. Force changes retry eligibility only and does not
relax validator response, requirement coverage, or review-anchor checks.
Successfully recovered or irrelevant changed-file evidence is retained for the
exact reviewed head. An unchanged-head retry reuses that classification, while
a new head invalidates it. Unavailable correctness-relevant evidence must be
scoped to dependent `UNVERIFIED` requirements and an irreducible recovery gap;
contradictory `PASS` or `VERIFIED` claims are rejected without first synthesizing
a different invalid verdict.

#### Authoritative Issue dispatch type guard

Before any Issue implementation side effect (backend start, CloudRun
creation/persistence, attempt increment, work branch creation, or Issue
task-start comment), Auto-Coder establishes the target's authoritative
GitHub item type with a cache-bypassing lookup (`get_item_type_strict`),
which talks to GitHub directly rather than through the shared hishel
caching client. GitHub's Issues API represents pull requests as issue-like
objects, so a caller-supplied candidate type -- including one built from a
cached Issue response, or one from collection, an explicit
`target_type="issue"` request, a retry path, or another internal enqueue
path -- is never trusted on its own. A target that resolves to a pull
request is rejected from Issue dispatch even when
it carries the `@auto-coder` label or a Codex Cloud task reference; it
remains eligible for the normal PR-processing lifecycle. A failed or
ambiguous type lookup fails closed: no Issue backend task or lifecycle
state may be started. Genuine Issue processing (backend selection, CloudRun
duplicate-dispatch protection, attempt handling, task comments) is
unaffected.

#### Bounded material test-oracle review

The initial authoritative adversarial review may report a small, consolidated
set of material test-oracle gaps separately from demonstrated implementation
violations and specification gaps. Each gap is tied to an explicit Issue
requirement, an exact production boundary and invariant, a plausible incorrect
implementation that existing tests would miss, and one focused regression
scenario. An open gap produces `NEEDS_TESTS`, requests only committed regression
protection, and blocks automatic merge without claiming that current production
behavior is wrong.

The reviewer identifies a gap's Issue requirement only by its stable manifest ID.
Unknown IDs fail closed, while human-readable requirement text used in review
comments, prompts, and persisted lifecycle state is populated deterministically
from the authoritative requirement manifest rather than copied from model output.

Gap identities and scopes persist with the PR-scoped reviewer session. Rereviews
revalidate recorded gaps and the corrective diff instead of restarting broad
test exploration. New rereview gaps are accepted only when the corrective diff
introduced a boundary, weakened protection, or required revalidation directly
exposed an entirely untested authoritative material boundary. Closed gaps cannot
be reopened for input variants or stronger assertions outside their original
boundary and invariant.
Previously published gap identities reuse their existing unresolved review
threads; insufficient corrective commits do not create duplicate root threads.

The broad initial review independently traces every material requirement from a
supported production origin across the parser/configuration, model, manager,
selector, persistence, authorization, UI, or public-API boundaries that matter
to its observable behavior. Direct helper calls and tests that synthetically
construct an internal representation are not sufficient proof that the state is
production-reachable or preserved. For each material requirement, the reviewer
also considers a minimal plausible incorrect implementation that might leave the
committed tests green, including a downstream helper that accepts a Set/group
while its real upstream path flattens or never creates that representation.
Demonstrated production reachability failures produce `NEEDS_FIX`; evidence that
remains decision-critical after bounded recovery produces `INCONCLUSIVE`; and
correct production behavior lacking a material regression oracle continues to
produce `NEEDS_TESTS`. A successful initial `PASS` therefore requires valid
production-path evidence for every `VERIFIED` cross-boundary requirement. The
narrow incremental rereview policy is unchanged.

Issue implementation and adversarial-fix prompts likewise require regression
coverage to begin at a supported production origin and cross enough material
boundaries to detect information loss, flattening, reinterpretation, or bypass.
A synthetic-state helper test remains useful as additional unit coverage, but
cannot be presented as the regression oracle unless production-origin coverage
proves the same state can be created and preserved.

#### Dedicated adversarial reviewer GitHub App

Adversarial validation verdicts are published as native pull-request reviews using
the separately configured `auto-coder-reviewer` GitHub App. Configure its `app_id`
and optional `client_id` under `[github-app-auto-coder-reviewer]` in
`~/.auto-coder/config.toml`; keep the private key at
`~/.auto-coder/auto-coder-reviewer.pem`. `PASS` maps to `APPROVE`, `NEEDS_FIX`
and `NEEDS_TESTS` map to `REQUEST_CHANGES`, and other outcomes map
deterministically to `COMMENT`.
Publication is pinned to the validated head SHA and fails closed without falling
back to the normal user credential.

For a `NEEDS_FIX` verdict, every actionable finding is submitted atomically as
its own independently resolvable review thread. Findings name a changed-file
anchor and include their complete requirement, counterexample, evidence, test
gap, and regression scenario. Valid diff line or range anchors are preserved;
missing or invalid line coordinates safely become file-level comments rather
than fabricated line locations. An invalid changed-file anchor or any review API
failure leaves publication unsuccessful. GitHub's existing review-thread
resolution state remains the only acknowledgement state used by merge gating.

This native review is the sole and authoritative publication path: Auto-Coder
does not additionally post the validation result as a regular user-authenticated
PR comment. The review body carries the same versioned machine-readable marker
(validator format/version plus the exact validated head SHA) used elsewhere, so
persisted validation state for a PR head can be recovered from the review after
a processing-loop restart. A review only counts as authoritative when it was
authored by the reviewer App's own resolved bot identity (fetched via `GET /app`
using the App's own credentials, never a configurable string) and carries the
marker for the exact head SHA in question; a lookalike review or comment from
anyone else is ignored. Reading this persisted state (`GitHubClient.get_pr_reviews_strict`
plus identity resolution) fails closed on any API or configuration error rather
than treating a lookup failure as "no prior result". Legacy validation comments
created before this change remain readable as a same-SHA fallback when no native
review exists yet for that head, but the comment-publication path itself is
never used for new results.

#### Backend Configuration

The auto-coder system supports multiple LLM backends:

```toml
          [qwen.qwen-direct]
          command = "uvx"
          args = ["qwen-direct"]
          description = "Direct Qwen API access"
          QWEN_API_KEY = "your-api-key"
```

#### Codex No-Edit Execution Policy

No-edit Codex backends do not require
`--dangerously-bypass-approvals-and-sandbox`. Editable Codex backends must use
an unattended policy: that bypass flag, `--full-auto`, or explicit
`--sandbox workspace-write` with `--ask-for-approval never`. For every no-edit
invocation, including custom `backend_type = "codex"` aliases, auto-coder
removes dangerous/YOLO flags and enforces `--sandbox read-only`,
`--ask-for-approval never`, and the configured safe approval reviewer override.

#### Repository-Scoped Partial Configuration Overrides

Auto-Coder supports repository-scoped partial overrides for both `llm_config.toml` and `config.toml` settings. When processing a task for a repository (e.g. `kitamura-tetsuo/auto-coder`), settings from a repository-specific configuration file are merged recursively on top of the base configuration.
- **Base Configuration Files**:
  - `llm_config.toml`: `~/.auto-coder/llm_config.toml` (or `.auto-coder/llm_config.toml` in the working directory / `AUTO_CODER_CONFIG_PATH`).
  - `config.toml`: `~/.auto-coder/config.toml` (or `.auto-coder/config.toml` in the working directory).
  - **Tables / Dictionaries**: Recursively merged so sibling keys not specified in the override remain inherited from the base configuration.
  - **Lists / Arrays**: Entire list is replaced by the override (no concatenation).
  - **Missing keys**: Retain base configuration values.
  - **Incompatible types / Invalid TOML**: Fails safely with `ValueError`.
- **Repository Isolation**: Each repository resolution is isolated and evaluated in its own context without mutating global base configuration state. Sequential tasks across multiple repositories maintain strict isolation.
- **Examples**:
  - **`llm_config.toml` Example**:
    Base `~/.auto-coder/llm_config.toml`:
    ```toml
    [backend]
    default = "codex"
    order = ["codex", "claude"]

    [backends.codex_cloud]
    environment = "env-autocoder-999"
    attempts = 3
    ```
    Result for `kitamura-tetsuo/auto-coder`: `environment = "env-autocoder-999"`, `attempts = 3`, and `model = "codex-base"` (inherited from base).

  - **`config.toml` Example**:
    Base `~/.auto-coder/config.toml`:
    ```toml
    [jules]
    enabled = true
    wait_timeout_hours = 2

    [github_action]

  - Example:
    ```toml
    [backends.gemini]
    model = "gemini-2.5-pro"
    usage_markers = ["rate limit", "quota exceeded", "custom error message"]

    [backends.claude]
    model = "sonnet"
    usage_markers = ["api error: 429", "usage limit exceeded", "5-hour limit reached"]

    [backends.codex]
    model = "codex"
    usage_markers = ["rate limit", "usage limit", "upgrade to pro"]

    [backends.auggie]
    model = "GPT-5"
    usage_markers = ["rate limit", "quota", "429"]

    [backends.qwen]
    model = "qwen3-coder-plus"
    usage_markers = ["rate limit", "quota", "too many requests", "custom marker"]
    ```
  - Behavior:
    - When configured, the specified markers are used to detect usage limit errors
    - When not configured, clients fall back to their built-in default markers
    - Markers are matched case-insensitively against the CLI output
    - JSON markers are matched as partial JSON (subset) against any JSON payload found in the CLI output, including structured log lines
  - Configuration file: "~/.auto-coder/llm_config.toml"
  - Optional field: Backward compatible with existing configurations

- **backend_with_high_score**: Fallback backend configuration for PRs when attempt count reaches 3
  - Purpose: Automatically switches to a different backend when a PR has been attempted 3 times without success
  - Trigger: When any linked issue in a PR has an attempt count >= 3, the system switches to this fallback backend for all subsequent LLM operations on that PR
  - Configuration section: `[backend_with_high_score]` in the TOML config file
  - Example:
    ```toml
    [backend_with_high_score]
    name = "antigravity"
    model = "gemini-2.5-flash"
    api_key = "your-api-key"
    ```
  - Behavior:
    - Checks attempt count for all issues linked in the PR body (using keywords like "close", "fix", "resolve")
    - Uses max attempt count across all linked issues
    - When max attempt >= 3, switches to the fallback backend before making any LLM calls
    - Supports all standard backend configuration fields (model, api_key, base_url, etc.)
    - If no fallback is configured, processing continues with the current backend (no error)
  - Configuration file: "~/.auto-coder/llm_config.toml"
- **backend_cloud**: Cloud backend configuration for standard (non-difficult) tasks
    [backends.codex-cloud-luna]
  - Purpose: Automatically delegates difficult issues to high-scoring cloud coding agents (like Claude Routine or Jules)
  - Trigger: When an issue has the `difficult` label, the system skips Jules mode and delegates directly to `backend_with_high_score_cloud`
  - Configuration section: `[backend_with_high_score_cloud]` in the TOML config file
  - Example:
    ```toml
    [backend_with_high_score_cloud]
    order = ["codex-cloud", "claude-opus-routine"]

    [backends.codex-cloud]
    backend_type = "codex-cloud"
    # Codex Cloud selects the model server-side; omit model for this backend.
    environment_id = "<Codex Cloud environment ID>"
    attempts = 1

    [backends.claude-opus-routine]
    backend_type = "claude-routine"
    url = "https://api.anthropic.com/v1/claude_code/routines/trig_01WSZRQzV8M7sWXAoTGQf2sn/fire"
    claude_code_routine_token = "sk-ant-oat01-..."
    ```
  - Behavior:
    - `backend_cloud.order` remains a strict backend priority list. Alternatively,
      `backend_cloud.priority_groups` accepts an ordered array of non-empty
      backend-name arrays. Members of one inner array have equal priority and are
      quota-ranked, while no member of a later group can cross an earlier group.
      The two settings are mutually exclusive, including after repository-specific
      configuration overrides are merged; invalid group shapes fail configuration
      loading.
    - Backend names in an `order` array retain their declared priority after
      quota eligibility checks; an ineligible entry may be skipped without
      reordering the remaining entries. Quota-surplus ranking applies only to
      backends explicitly placed in the same equal-priority set/group and
      cannot promote a later candidate or group across an earlier priority
      boundary.
    - Single-item processing (`process-issues --only`) honors the repository's cloud/Jules mode configuration, just like continuous issue processing.
    - When `backend_type = "codex-cloud"` is used, the system invokes `codex cloud exec --env <environment_id> --branch <base_branch>` and records the returned task ID.
    - Before creating a Codex Cloud task, weekly usage is read through `codex app-server` using `initialize`, `initialized`, and `account/rateLimits/read` over stdio. Codex manages authentication and refresh using its own configuration and `CODEX_HOME`; Auto-Coder does not read OAuth tokens or call the usage HTTP endpoint directly. Surplus admission requires remaining percentage of at least `(days_until_reset + 1) * 5`; burst requires nonzero remaining weekly quota. Missing CLI/authentication, RPC errors, timeouts, and malformed responses leave quota unavailable and prevent Cloud submission. No LLM turn is started and no reset credit is consumed.
    - Codex Cloud supports `continue_if_paused()` via the internal WHAM backend API (`POST https://chatgpt.com/backend-api/wham/tasks`). When CI checks fail on a Codex Cloud-created PR, auto-coder resolves the latest assistant turn ID via WHAM turn APIs and sends a follow-up continuation prompt using Codex OAuth credentials (never the OpenAI API key), allowing Codex to resume and fix the PR without spawning new tasks. This cloud routing is preserved when label checks are disabled (including `--only` and WIP resumption) and when the local checkout already matches the PR branch; Auto-Coder does not check out or repair the cloud PR locally. A failed continuation delivery is reported as retryable and is never described as successfully handled, while local repair remains disabled. Repeated resumptions do not post duplicate informational PR comments; Jules fix-request notifications use the same deduplication rule.
    - Cloud clients may independently implement `send_followup()` for assigning new work to an existing task after it has created a PR; this capability is distinct from paused-task continuation. When a Codex Cloud or Claude cloud PR is still conflicting, Auto-Coder sends the existing session a repair instruction using the PR's actual head and base branches before local resolution. A provider-confirmed delivery adds a task-, PR-, purpose-, and head-specific action and an idempotent informational PR comment; comment publication is retried independently and can never cause the non-idempotent provider request to be resent. Successful delivery stops that processing pass, while failed or unsupported delivery retains the prior fallback. Durable deduplication keys include repository/PR identity plus head and base states, with explicit pending and confirmed states: unchanged confirmed work is not resent, an unconfirmed reservation is deferred without being falsely reported as delegated, and changed heads or bases may be delegated again. Delivery never marks the PR mergeable or bypasses normal CI, review-thread, adversarial-validation, or mergeability gates.
    - Codex Cloud pull requests whose remote head is exactly `work` are closed before diff, CI, merge, or checkout processing because that shared branch is not a safe task identity. The existing cloud task is instructed to preserve its implementation and publish a replacement PR from a unique issue/task branch without reusing or force-pushing `work`. Successful delivery keeps the linked issue in its current cloud flow; failed resolution or delivery releases it through the normal attempt/retry policy.
    - Codex Cloud selects its model server-side. If `model` is configured, Auto-Coder warns that user-selected models are unsupported, ignores the value, and starts the task without a model CLI override.
    - `environment_id` is required for Codex Cloud; `attempts` optionally configures best-of-N execution and defaults to 1.
    - When `backend_type = "claude-routine"` is used, the system triggers the Claude routine via HTTP POST to the configured fire endpoint.
    - Saves the returned session ID in `cloud.csv` together with the independent provider family and exact configured backend name, so Claude Routine follow-ups retain the same URL, token, and options after restart; legacy Claude Routine rows use the historical `claude-routine` backend identity.
    - Comments on the issue with the session link and retains the `@auto-coder` label.
    - Subsequent pull requests opened by Claude routines are tracked and linked to the issue.
    - Parent-issue verification uses the same lifecycle-aware dispatch: asynchronous task/session IDs are persisted and reported on the issue, and `@auto-coder` remains until the existing cloud completion lifecycle releases it. Local high-score backends retain synchronous processing.
  - Configuration file: "~/.auto-coder/llm_config.toml"


- **Claude / Claude-Routine Usage Quota Pre-Check & Failover**:
  - Purpose: Automatically checks remaining rate limit and usage allowances before calling Claude or Claude-Routine backends.
  - Trigger & Thresholds:
    - 5-hour rolling session limit has **<= 20% remaining** (utilization >= 80%), OR
    - 7-day weekly limit (including model-specific limits like `seven_day_sonnet`, `seven_day_opus`, `seven_day_oauth_apps`) has **<= 5% remaining** (utilization >= 95%), OR
    - Queries `https://api.anthropic.com/api/oauth/usage` before invoking the LLM CLI or firing a routine.
    - If remaining quota is at or below the threshold or rate limits are reached, raises `AutoCoderUsageLimitError` with the reset timestamp and reason.
    - Seamlessly triggers standard `BackendManager` rotation to the next backend in the configured order (including failover in `backend_with_high_score_cloud_order`) or defers until reset.
    - Automatically discovers OAuth tokens from backend configuration (`claude_code_oauth_token`, `claude_code_routine_token`), environment variables, or credentials file (`~/.claude/.credentials.json`).
    - Proactively checks `expiresAt` timestamp and exchanges refresh tokens via JSON payload with `client_id` to prevent authorization failures.
    - Accurately captures HTTP 429 rate limits from token refresh and usage endpoints to avoid runaway task spawning.
    - Handles account-wide weekly limit entries whose API scope has no model, while preserving threshold detection and reset timestamps.
  - Default: `[]` (empty list)
  - Usage: Applied when the LLM is invoked for analyzing issues, generating code, fixing bugs, and other file-modifying operations
  - Example:
    ```toml
    [backends.codex]
    model = "codex"
    options = ["--dangerously-bypass-approvals-and-sandbox"]
    ```
  - Behavior:
    - The system automatically adds required flags for each backend type during execution (e.g., `--dangerously-bypass-approvals-and-sandbox` for Codex)
    - Custom options specified here are appended to the automatically-added flags
    - Different backends may interpret options differently
    - Supports placeholder replacement for dynamic values (see Placeholder Replacement System below)
  - Configuration file: "~/.auto-coder/llm_config.toml"
  - Optional field: Backward compatible with existing configurations

- **`options_for_noedit` field**: CLI options for message generation (non-editing operations)
  - Purpose: Pass additional command-line arguments to backend CLIs when generating commit messages, PR descriptions, and other non-code operations
  - Type: List[str]
  - Default: `[]` (empty list)
  - Usage: Applied when the LLM is invoked for message generation operations (not code editing)
  - Example:
    ```toml
    [backends.gemini]
    model = "gemini-2.5-pro"
    options = ["--debug"]
    options_for_noedit = ["--silent"]
    ```
  - Behavior:
    - If not specified or empty, falls back to using `options` value
    - Allows different configurations for editing vs message generation
    - The system automatically adds required flags for each backend type during execution
    - Useful for optimizing different operations with different option sets
  - Configuration file: "~/.auto-coder/llm_config.toml"
  - Optional field: Backward compatible with existing configurations

- **`backend_for_noedit` configuration**: Separate backend configuration for non-editing operations
  - Purpose: Configure a different backend (or backend order) for message generation compared to code editing
  - Breaking Change: Renamed from `message_backend` to `backend_for_noedit`
  - Configuration Sections:
    - `[backend_for_noedit]`: Top-level section for non-editing backend configuration
    - Fields:
      - `default`: Default backend name for non-editing operations
      - `order`: List of backend names to try for non-editing operations (in order)
  - Example:
    ```toml
    [backend]
    default = "qwen"
    order = ["qwen", "antigravity", "claude"]

    [backend_for_noedit]
    default = "claude"
    order = ["claude", "qwen"]
    ```
  - Behavior:
    - If not specified, falls back to general backend configuration (`[backend]` section)
    - Allows optimization: use fast/cheap models for messages, premium models for code
    - Backward compatible: old `message_backend` key still works but emits deprecation warning
  - Migration:
    - Replace `[message_backend]` with `[backend_for_noedit]` in config files
    - Replace environment variable `AUTO_CODER_MESSAGE_DEFAULT_BACKEND` with `AUTO_CODER_NOEDIT_DEFAULT_BACKEND`
  - Configuration file: "~/.auto-coder/llm_config.toml"
  - Optional field: Defaults to general backend configuration if not specified

- **Issue discovery and implementation admission**: Ordinary open Issues are collected on every candidate scan, independently of the number, priority, mergeability, or review state of open PRs. Existing candidate priorities still determine scheduling order after discovery. Starting Issue work remains separately controlled by the durable `[process_issues].max_concurrent_implementations` slots. Issue retries, provider sessions, and linked PRs share one persisted Issue-owned slot; standalone PRs own separate slots. Slots survive restarts, remain held during asynchronous and CI/review waits, and are normally released after authoritative terminal GitHub state is observed. Confirmed pre-submission Cloud rejection also releases unbound idle ownership, as described above. The state and lock files inherit the containing runtime directory's group and retain group read/write access (without world access) across every atomic replacement, allowing intentionally shared execution identities to coordinate safely. Permission or ownership setup failures are distinct fail-closed errors and never reset durable state. The `urgent` label retains its single durable emergency slot beyond normal capacity, and explicit `--only` / `--force` overrides retain their existing admission semantics.
- **Event-driven implementation-capacity refill**: A running daemon observes its cross-process implementation-slot repository. When normal capacity changes from full to available, it obtains a new authoritative open-Issue enumeration, strictly refreshes and priority-ranks every candidate, and sends candidates through the ordinary dispatch checks until capacity is full or the snapshot is exhausted. Rejected candidates do not consume the refill opportunity. Failed enumeration remains a level-triggered obligation and is retried, while idle steady state never polls GitHub for candidates.

- **Adversarial-review-blocked PR priority (issue #1731)**: Deprioritizes PRs that cannot make progress at their unchanged HEAD
  - Purpose: A PR whose current HEAD already completed Auto-Coder's own adversarial validation with material specification violations (`NEEDS_FIX` or `NEEDS_TESTS`) has no further normal action to perform until the PR author/backend supplies a new commit. Without this, such a PR keeps competing at the ordinary auto-merge-candidate priority (2), crowding out genuinely actionable work.
  - Implementation: `is_current_head_adversarial_review_blocked()` in `pr_processor.py`, called from `AutomationEngine._get_candidates()`.
  - Behavior:
    - When `[ENABLE_ADVERSARIAL_VALIDATION]` is enabled, the PR is not a dependency-bot PR, and it is otherwise mergeable with passing checks, the dedicated reviewer App's authoritative same-SHA verdict (looked up the same way the merge gate does, via `_get_published_adversarial_validation_status`) is consulted for the PR's exact current `head.sha`.
    - `NEEDS_FIX` or `NEEDS_TESTS` for the current HEAD lowers the PR to `pr_priority = 1`, the same tier as a mergeable PR with failing GitHub Actions checks.
    - The classification is re-derived from the current HEAD on every candidate-collection pass; a verdict recorded against an older SHA never suppresses a newer HEAD, so a fresh commit immediately restores the ordinary priority even before a new adversarial result exists for it.
    - Validator errors, timeouts, or indeterminate verdicts (`ERROR`, `BLOCKED`, `INCONCLUSIVE`), a PR with no linked-Issue specification oracle, and any lookup failure all resolve to "not blocked" so they remain retried rather than deprioritized.
    - Only the dedicated `auto-coder-reviewer` GitHub App's own marker-scoped verdict counts; a generic human `CHANGES_REQUESTED` review or unrelated unresolved review thread never triggers this classification on its own.
    - An independently applicable higher-priority condition (unmergeable, `urgent`, breaking-change) is unaffected: this check only runs, and can only apply, in the branch that would otherwise assign the mergeable/passing-checks priority of 2.

#### Placeholder Replacement System

- **Purpose**: Enable dynamic configuration values in option lists using placeholders
- **Documentation**: See [Configuration Guide](configuration_guide.md) for complete documentation
- **Supported Placeholders**:
  - `[model_name]` - Replaced with the backend's model value
  - `[sessionId]` - Replaced with session ID for resume functionality
  - `[settings]` - Replaced with backend's settings file path
  - `[model_provider]` - Replaced with backend's model_provider value
- **Implementation**: The `BackendConfig.replace_placeholders()` method processes all three option lists (`options`, `options_for_noedit`, `options_for_resume`)
- **Behavior**:
  - Placeholders are replaced with provided values at runtime
  - If a placeholder value is not provided, the placeholder remains unchanged
  - The method returns a new dictionary with processed lists, leaving the original configuration unmodified
  - Multiple occurrences of the same placeholder in a list are all replaced
- **Example Configuration**:
  ```toml
  [backends.codex]
  model = "gpt-5.1-codex-max"
  options = ["--model", "[model_name]", "--json", "--dangerously-bypass-approvals-and-sandbox"]
  options_for_noedit = ["--model", "[model_name]", "--json"]
  options_for_resume = ["--model", "[model_name]"]

  [backends.custom-claude]
  model = "opus"
  backend_type = "claude"
  settings = "/path/to/settings.json"
  options = ["--print", "--model", "[model_name]", "--settings", "[settings]"]

  [backends.openrouter-backend]
  model = "some/model:free"
  backend_type = "codex"
  model_provider = "openrouter"
  options = ["--model", "[model_name]", "-c", "model_provider=[model_provider]"]
  ```
- **Usage in Code**:
  ```python
  config = BackendConfig(name="codex", ...)
  processed = config.replace_placeholders(
      model_name="gpt-5.1-codex-max",
      session_id="sess_20241204",
      settings="/path/to/settings.json"
  )
  # processed['options'] = ["--model", "gpt-5.1-codex-max", "--json", "--dangerously-bypass-approvals-and-sandbox"]
  ```
- **Benefits**:
  - Single configuration template can be used with different models
  - Session-based backends can dynamically inject session IDs
  - Settings files can be configured without hardcoding paths in options
  - Model providers can be specified dynamically for OpenAI-compatible backends
  - Reduces configuration duplication
  - Supports dynamic runtime values without modifying configuration files
- **Backward Compatibility**: Fully backward compatible - configurations without placeholders work unchanged

