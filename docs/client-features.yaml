#### Per-Backend Option Examples

The following examples demonstrate typical `options` and `options_for_noedit` configurations for each supported backend:

- **Codex Backend** (`backend_type = "codex"`):
  ```toml
  [codex]
  model = "codex"
  options = ["--dangerously-bypass-approvals-and-sandbox"]
  options_for_noedit = ["--dangerously-bypass-approvals-and-sandbox"]
  ```
  - Typical use: OpenAI-compatible providers (OpenRouter, Azure OpenAI, custom endpoints)
  - Automatic flags: `--dangerously-bypass-approvals-and-sandbox` during code editing operations
  - Custom options: Add tracking headers, timeouts, or provider-specific flags

- **Claude Backend** (`backend_type = "claude"`):
  ```toml
  [claude]
  model = "sonnet"
  backend_type = "claude"
  options = []
  options_for_noedit = []
  ```
  - Typical use: Anthropic Claude API
  - Local print-mode tasks deliver the complete prepared prompt as finite UTF-8 stdin
    (including retries and explicit session continuations), never as an argv or
    environment payload. Conflicting task-input selectors and non-text input formats
    are rejected before the task is launched.
  - Automatic flags: `--print`, `--dangerously-skip-permissions`, `--allow-dangerously-skip-permissions`
  - Custom options: Path to settings file, debug modes
  - Cloud sessions: when `options` contain `--cloud` (or `--cloud=<description>`), the run is
    interactive-only. `--print` is never added and any `--print` / `--output-format <format>`
    entry is removed from the options, because the claude CLI rejects
    `--cloud` combined with `--print` and `--output-format` only works with `--print`.
    The prompt is passed as the trailing argument and becomes the cloud task description.
    Such runs are executed through a pseudo terminal (`CommandExecutor.run_command(..., use_pty=True)`),
    because the claude CLI aborts with "--cloud requires an interactive terminal" when stdout is a pipe.
    In pty mode stdout and stderr are merged into a single stream and ANSI escape sequences are stripped
    from the captured output.
  - Configuration recovery: before invoking the CLI, a missing or unparsable `~/.claude.json`
    (or `$CLAUDE_CONFIG_DIR/.claude.json`) is restored from the newest usable backup in
    `~/.claude/backups/`; an unparsable file is preserved as `.claude.json.corrupt.<timestamp>`.

- **Gemini Backend** (`backend_type = "antigravity"`):
  ```toml
  [gemini]
  model = "gemini-2.5-pro"
  backend_type = "antigravity"
  options = []
  options_for_noedit = []
  ```
  - Typical use: Google Gemini API
  - Automatic flags: `--dangerously-skip-permissions`, `--force-model`
  - Custom options: Debug modes, output formatting

- **Qwen Backend** (`backend_type = "qwen"`):
  ```toml
  [qwen]
  model = "qwen3-coder-plus"
  backend_type = "qwen"
  options = []
  options_for_noedit = []
  ```
  - Typical use: Native Qwen CLI with OAuth authentication
  - Automatic flags: `-y` (auto-confirm)
  - Custom options: Stream settings, debug modes, timeouts

- **Qwen via OpenRouter** (`backend_type = "codex"`):
  ```toml
  [qwen-openrouter]
  model = "qwen/qwen3-coder:free"
  backend_type = "codex"
  openai_api_key = "sk-or-v1-your-key"
  openai_base_url = "https://openrouter.ai/api/v1"
  options = ["-o", "HTTPReferer", "https://yourapp.com", "-o", "XTitle", "Auto-Coder"]
  options_for_noedit = ["-o", "timeout", "30"]
  ```
  - Typical use: Qwen models through OpenAI-compatible API
  - Automatic flags: `--dangerously-bypass-approvals-and-sandbox`
  - Custom options: Tracking headers, timeouts, stream settings

- **Auggie Backend** (`backend_type = "auggie"`):
  ```toml
  [auggie]
  model = "GPT-5"
  backend_type = "auggie"
  options = []
  options_for_noedit = []
  ```
  - Typical use: AugmentCode Auggie CLI
  - Automatic flags: `--print`
  - Task instructions are passed as exact UTF-8 through a private, external `--instruction-file`; the file is removed after the direct CLI child exits.
  - Custom options: Debug modes, output formatting (configured instruction-source options are rejected)

- **Jules Backend** (`backend_type = "jules"`):
  ```toml
  [jules]
  backend_type = "jules"
  options = []
  options_for_noedit = []
  ```
  - Typical use: Session-based AI assistant (Jules)
  - Automatic flags: Minimal - Jules manages sessions internally
  - Custom options: Usually minimal due to session-based nature

#### Empty PR Handling

  empty_pr_handling:
    description: "Detection and requeueing of pull requests with zero effective diff against the base branch."
    zero_diff_detection:
      - "When a PR has zero changed files (or additions and deletions are zero / diff is empty), it is treated as a failed processing attempt even if the branch contains commits."
      - "The empty PR is closed automatically with an explanatory comment."
      - "The associated source issue is resolved from the PR body, session ID, branch name, or title."
      - "If the source issue was closed as a side effect of the PR relationship, it is reopened before reprocessing."
      - "The source issue's attempt counter is incremented, and its @auto-coder label is removed."
      - "The issue is requeued through the normal issue-processing path so the next attempt-based routing/fallback model takes over."
      - "Non-empty PR behavior remains unchanged."
    cloud_run_aware_handling:
      - "Before incrementing the attempt or releasing the @auto-coder label, _close_empty_pr() (src/auto_coder/pr_processor.py) checks whether the source issue's current attempt owns a durable CloudRun (CloudRunRepository.get(issue_number, attempt)) and, if so, asks cloud_run_policies.get_policy_for_provider(run.provider) for the run's CloudRunPolicy."
      - "If a policy is found and it denies the transition (CloudRunEvent(reason='empty_pr')), closing the PR stays a PR-local action: the Issue attempt is not incremented, the @auto-coder label is not released, and the issue is not requeued. The closed PR's number is still recorded on the CloudRun (CloudRunRepository.add_pull_request) without disturbing any other PR already associated with that run."
      - "For Codex Cloud (provider='codex-cloud'), CodexCloudRunPolicy is manual-only, so an empty PR alone never authorizes a new attempt or a replacement Codex Cloud task, even when it is the only known PR for that run. This lets another valid PR from the same multi-PR CloudRun continue through ordinary PR processing unaffected."
      - "When the issue's current attempt has no persisted CloudRun (e.g. Jules) or the provider has no registered policy, behavior is unchanged from the pre-#1607 attempt-increment/requeue flow described above."

#### Jules PR Handling

  jules_pr_handling:
    description: "Rules applied to PRs created by Jules (google-labs-jules)."
    no_automatic_local_fixes:
      - "Auto-Coder never pushes automatic fix commits to a Jules PR branch: Jules does not recognize commits made to its branch by other actors, so such commits desynchronize the Jules session."
      - "CI failures are reported back to the Jules session instead, and Jules is expected to push the fix itself."
      - "Only an explicit local run that is already checked out on the PR branch keeps fixing the working copy directly."
    ci_timeout:
      - "When a Jules PR still has failing (completed) CI more than [jules].pr_ci_timeout_hours after it was created, the PR is closed as unfixable."
      - "The attempt counter of the issue linked to the PR is incremented so the issue is retried from scratch."
      - "The issue is resolved from the PR body links first, then from the Jules session ID, branch name, or PR title."
      - "Default timeout: 12 hours. Configurable via [jules].pr_ci_timeout_hours in config.toml."
      - "PRs whose CI is still running, or whose CI passed, are never closed by this rule."
      - "The check runs before every '@auto-coder label present' skip (candidate collection, single-target processing, and process_pull_request); a stale PR normally still carries the label from an earlier run and would otherwise never be revisited."
      - "Closing also releases the issue: the @auto-coder label that the dead Jules session kept on the linked issue is removed, and the issue is processed again in the same run (queued as a candidate in the daemon, processed inline for single-target runs)."
      - "PRs that are already closed are ignored, so the attempt counter is never incremented twice for the same PR."
    issue_pr_timeout:
      - "When a Jules session has been working on an issue for more than [jules].issue_pr_timeout_hours without opening a PR, the session is sent a 'stop' message and the issue is implemented by the backend_with_high_score backend instead."
      - "Default timeout: 12 hours. Configurable via [jules].issue_pr_timeout_hours in config.toml."
      - "The session-to-issue mapping comes from cloud.csv; sessions tracked against a PR number are ignored by this rule."
      - "Sessions whose outputs already contain a pullRequest, and issues that already have a linked PR on GitHub, are never stopped."
      - "Closed issues are skipped, and a session that fails to accept the stop message keeps the issue."
      - "The attempt counter of the issue is incremented, so the fallback starts from a fresh attempt branch instead of the one the Jules run left behind."
      - "The @auto-coder label the Jules run left on the issue is kept in place so no other instance picks the issue up while the fallback works on it; the fallback run passes check_labels=False so the label gate does not skip the issue it already owns."
      - "Stopped sessions are recorded in .auto-coder/jules_session_state.json so they are neither resumed nor handed over twice."
      - "The check runs during the hourly Jules full-session-list maintenance cycle, right after the Jules session resume/archive pass."
    session_listing_cache:
      - "Listing Jules sessions walks the whole paginated /sessions collection, which takes minutes once a repository accumulates thousands of sessions."
      - "The raw (unfiltered) listing is cached process-wide in jules_client, so every list_sessions call shares a single HTTP fetch regardless of the JulesClient instance or the repo_name filter used."
      - "Repository and ARCHIVED filtering still happens client-side on each call, so callers keep receiving their own filtered view."
      - "Each process waits approximately one hour after startup before its first full listing opportunity. The producer/run loop then starts a list-dependent Jules maintenance cycle at most once per hour, invalidating the cache immediately before the resume/archive, stale-issue, and recurrent-task passes."
      - "The hourly deadline advances before the listing is attempted, so a failed listing is not retried by a subsequent loop until approximately another hour has elapsed. Non-eligible loops skip all list-dependent maintenance rather than treating the cached snapshot as fresh."
      - "Direct operations on a known Jules session ID remain independent of the full-list maintenance schedule. The schedule is process-local and resets on restart."
    label_locking:
      - "Jules mode keeps the @auto-coder label on an issue for the lifetime of its session, so an aborted session would otherwise lock the issue permanently."
      - "With check_labels=False (--only and WIP-branch resume) an existing @auto-coder label no longer blocks processing; the label is left in place because the run does not own it."

#### Breaking Changes Documentation

Recent configuration schema changes that require migration:

**BREAKING CHANGE (v2026.1.0.0)**: Removed hardcoded default options from CodexClient
   - **What Changed**: The CodexClient no longer includes hardcoded `-s workspace-write` options in codex CLI commands.
   - **Impact**: Users who relied on these hardcoded options will need to explicitly configure them in their backend configuration.
   - **Migration Required**:
     - Add the following to your `~/.auto-coder/llm_config.toml`:
       ```toml
       [backends.codex]
       model = "codex"
       options = ["-s", "workspace-write"]
       ```
     - Or configure any custom options you need for your specific use case.
   - **Rationale**: Hardcoded options were considered excessive and limited flexibility. This change allows users to configure exactly the options they need.
   - **Version**: v2026.1.0.0 (Major version bump due to breaking change)

**1. Configuration Field Renames**:
   - **`message_backend` → `backend_for_noedit`**:
     - Old config:
       ```toml
       [message_backend]
       default = "claude"
       order = ["claude", "qwen"]
       ```
     - New config:
       ```toml
       [backend_for_noedit]
       default = "claude"
       order = ["claude", "qwen"]
       ```
     - Migration: Update all config files to use new field name
     - Deprecation: Old name still works but emits warning and will be removed in future version

**2. Environment Variable Renames**:
   - **`AUTO_CODER_MESSAGE_DEFAULT_BACKEND` → `AUTO_CODER_NOEDIT_DEFAULT_BACKEND`**:
     - Migration: Update environment variables to new name
     - Deprecation: Old name still works but emits warning

**3. Hardcoded Options Removal**:
   - **Before**: CLI options were hardcoded in client implementations
     - Codex: always used `--dangerously-bypass-approvals-and-sandbox`
     - Claude: always used `--print --dangerously-skip-permissions --allow-dangerously-skip-permissions`
     - Gemini: always used `--dangerously-skip-permissions --force-model`
     - Qwen: always used `-y`
   - **After**: Options are configurable through `options` and `options_for_noedit` fields
     - System automatically adds required flags for each backend
     - Users can add custom options beyond the defaults
     - Allows fine-tuning per-operation-type behavior
   - Migration: No action required - configuration is backward compatible
   - Benefits: Full customization, better separation of concerns

**4. Default Option Behavior**:
   - When `options_for_noedit` is not specified, it now falls back to `options` value
   - Previously, each backend had different default behaviors
   - Migration: No action required - existing configs work as expected
   - Note: Empty list `[]` means use defaults, not "no options"

