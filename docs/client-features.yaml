# Client Features Documentation

This file documents the client-facing features and tools provided by auto-coder.

## Configuration

#### Dedicated adversarial reviewer GitHub App

Adversarial validation verdicts are published as native pull-request reviews using
the separately configured `auto-coder-reviewer` GitHub App. Configure its `app_id`
and optional `client_id` under `[github-app-auto-coder-reviewer]` in
`~/.auto-coder/config.toml`; keep the private key at
`~/.auto-coder/auto-coder-reviewer.pem`. `PASS` maps to `APPROVE`, `NEEDS_FIX`
maps to `REQUEST_CHANGES`, and other outcomes map deterministically to `COMMENT`.
Publication is pinned to the validated head SHA and fails closed without falling
back to the normal user credential.

#### Backend Configuration

The auto-coder system supports multiple LLM backends:

```toml
          [qwen.qwen-direct]
          command = "uvx"
          args = ["qwen-direct"]
          description = "Direct Qwen API access"
          QWEN_API_KEY = "your-api-key"
```

#### Repository-Scoped Partial Configuration Overrides

Auto-Coder supports repository-scoped partial overrides for `llm_config.toml` settings. When processing a task for a repository (e.g. `kitamura-tetsuo/auto-coder`), settings from a repository-specific configuration file are merged recursively on top of the base configuration.

- **Base Configuration File**: `~/.auto-coder/llm_config.toml` (or `.auto-coder/llm_config.toml` in the working directory / `AUTO_CODER_CONFIG_PATH`).
- **Repository Override File**: `~/.auto-coder/<owner>/<repo>/llm_config.toml` (e.g. `~/.auto-coder/kitamura-tetsuo/auto-coder/llm_config.toml`).
- **Path Resolution**: Must be selected using the full GitHub `<owner>/<repo>` identity mapped directly to the directory structure. Short names without an owner are rejected.
- **Merge Semantics**:
  - **Scalar values**: Override value replaces the base value.
  - **Tables / Dictionaries**: Recursively merged so sibling keys not specified in the override remain inherited from the base configuration.
  - **Lists / Arrays**: Entire list is replaced by the override (no concatenation).
  - **Missing keys**: Retain base configuration values.
  - **Incompatible types / Invalid TOML**: Fails safely with `ValueError`.
- **Repository Isolation**: Each repository resolution is isolated and evaluated in its own context without mutating global base configuration state. Sequential tasks across multiple repositories maintain strict isolation.
- **Example**:
  Base `~/.auto-coder/llm_config.toml`:
  ```toml
  [backend]
  default = "codex"
  order = ["codex", "claude"]

  [backends.codex_cloud]
  model = "codex-base"
  environment = "env-outliner-123"
  attempts = 1
  ```
  Override `~/.auto-coder/kitamura-tetsuo/auto-coder/llm_config.toml`:
  ```toml
  [backends.codex_cloud]
  environment = "env-autocoder-999"
  attempts = 3
  ```
  Result for `kitamura-tetsuo/auto-coder`: `environment = "env-autocoder-999"`, `attempts = 3`, and `model = "codex-base"` (inherited from base).

#### Backend Configuration Fields

The system supports extensive backend configuration options. Key fields include:

- **model_provider**: Specifies the model provider for backends using `backend_type = "codex"`
  - Purpose: Allows users to configure providers like OpenRouter, Anthropic, etc.
  - Example:
    ```toml
    [grok-4.1-fast]
    enabled = true
    model = "x-ai/grok-4.1-fast:free"
    backend_type = "codex"
    model_provider = "openrouter"
    ```
  - This translates to: `codex -c model="x-ai/grok-4.1-fast:free" -c model_provider=openrouter`
  - Optional field: Backward compatible with existing configurations

- **usage_markers**: Configurable patterns (strings or JSON snippets) to detect rate limits or usage errors in CLI output
  - Purpose: Enables users to handle different localizations or new error messages without modifying source code
  - Supported by: ClaudeClient, GeminiClient, CodexClient, AuggieClient, QwenClient
  - Default behavior: Each client has built-in default markers (e.g., "rate limit", "quota", "429")
  - Example:
    ```toml
    [backends.gemini]
    model = "gemini-2.5-pro"
    usage_markers = ["rate limit", "quota exceeded", "custom error message"]

    [backends.claude]
    model = "sonnet"
    usage_markers = ["api error: 429", "usage limit exceeded", "5-hour limit reached"]

    [backends.codex]
    model = "codex"
    usage_markers = ["rate limit", "usage limit", "upgrade to pro"]

    [backends.auggie]
    model = "GPT-5"
    usage_markers = ["rate limit", "quota", "429"]

    [backends.qwen]
    model = "qwen3-coder-plus"
    usage_markers = ["rate limit", "quota", "too many requests", "custom marker"]
    ```
  - Behavior:
    - When configured, the specified markers are used to detect usage limit errors
    - When not configured, clients fall back to their built-in default markers
    - Markers are matched case-insensitively against the CLI output
    - JSON markers are matched as partial JSON (subset) against any JSON payload found in the CLI output, including structured log lines
  - Configuration file: "~/.auto-coder/llm_config.toml"
  - Optional field: Backward compatible with existing configurations

- **backend_with_high_score**: Fallback backend configuration for PRs when attempt count reaches 3
  - Purpose: Automatically switches to a different backend when a PR has been attempted 3 times without success
  - Trigger: When any linked issue in a PR has an attempt count >= 3, the system switches to this fallback backend for all subsequent LLM operations on that PR
  - Configuration section: `[backend_with_high_score]` in the TOML config file
  - Example:
    ```toml
    [backend_with_high_score]
    name = "antigravity"
    model = "gemini-2.5-flash"
    api_key = "your-api-key"
    ```
  - Behavior:
    - Checks attempt count for all issues linked in the PR body (using keywords like "close", "fix", "resolve")
    - Uses max attempt count across all linked issues
    - When max attempt >= 3, switches to the fallback backend before making any LLM calls
    - Supports all standard backend configuration fields (model, api_key, base_url, etc.)
    - If no fallback is configured, processing continues with the current backend (no error)
  - Configuration file: "~/.auto-coder/llm_config.toml"
- **backend_cloud**: Cloud backend configuration for standard (non-difficult) tasks
    [backends.codex-cloud-luna]
  - Purpose: Automatically delegates difficult issues to high-scoring cloud coding agents (like Claude Routine or Jules)
  - Trigger: When an issue has the `difficult` label, the system skips Jules mode and delegates directly to `backend_with_high_score_cloud`
  - Configuration section: `[backend_with_high_score_cloud]` in the TOML config file
  - Example:
    ```toml
    [backend_with_high_score_cloud]
    order = ["codex-cloud", "claude-opus-routine"]

    [backends.codex-cloud]
    backend_type = "codex-cloud"
    model = "gpt-5.6-terra"
    environment_id = "<Codex Cloud environment ID>"
    attempts = 1

    [backends.claude-opus-routine]
    backend_type = "claude-routine"
    url = "https://api.anthropic.com/v1/claude_code/routines/trig_01WSZRQzV8M7sWXAoTGQf2sn/fire"
    claude_code_routine_token = "sk-ant-oat01-..."
    ```
  - Behavior:
    - When `backend_type = "codex-cloud"` is used, the system invokes `codex cloud exec --env <environment_id> --branch <base_branch>` and records the returned task ID.
    - Before creating a Codex Cloud task, weekly usage is fetched with ChatGPT OAuth credentials from `$CODEX_HOME/auth.json` (or `~/.codex/auth.json`). The task starts only when the remaining percentage is at least `(days_until_reset + 1) * 5`; missing credentials, authentication errors, and malformed responses safely route to the next backend. OpenAI API keys are never used for this request.
    - Codex Cloud supports `continue_if_paused()` via the internal WHAM backend API (`POST https://chatgpt.com/backend-api/wham/tasks`). When CI checks fail on a Codex Cloud-created PR, auto-coder resolves the latest assistant turn ID via WHAM turn APIs and sends a follow-up continuation prompt using Codex OAuth credentials (never the OpenAI API key), allowing Codex to resume and fix the PR without spawning new tasks.
    - When `model` is configured, it is forwarded to Codex Cloud as a CLI configuration override.
    - `environment_id` is required for Codex Cloud; `attempts` optionally configures best-of-N execution and defaults to 1.
    - When `backend_type = "claude-routine"` is used, the system triggers the Claude routine via HTTP POST to the configured fire endpoint.
    - Saves the returned session ID in `cloud.csv`, comments on the issue with the session link, and retains the `@auto-coder` label.
    - Subsequent pull requests opened by Claude routines are tracked and linked to the issue.
  - Configuration file: "~/.auto-coder/llm_config.toml"


- **Claude / Claude-Routine Usage Quota Pre-Check & Failover**:
  - Purpose: Automatically checks remaining rate limit and usage allowances before calling Claude or Claude-Routine backends.
  - Trigger & Thresholds:
    - 5-hour rolling session limit has **<= 20% remaining** (utilization >= 80%), OR
    - 7-day weekly limit (including model-specific limits like `seven_day_sonnet`, `seven_day_opus`, `seven_day_oauth_apps`) has **<= 5% remaining** (utilization >= 95%), OR
    - Queries `https://api.anthropic.com/api/oauth/usage` before invoking the LLM CLI or firing a routine.
    - If remaining quota is at or below the threshold or rate limits are reached, raises `AutoCoderUsageLimitError` with the reset timestamp and reason.
    - Seamlessly triggers standard `BackendManager` rotation to the next backend in the configured order (including failover in `backend_with_high_score_cloud_order`) or defers until reset.
    - Automatically discovers OAuth tokens from backend configuration (`claude_code_oauth_token`, `claude_code_routine_token`), environment variables, or credentials file (`~/.claude/.credentials.json`).
    - Proactively checks `expiresAt` timestamp and exchanges refresh tokens via JSON payload with `client_id` to prevent authorization failures.
    - Accurately captures HTTP 429 rate limits from token refresh and usage endpoints to avoid runaway task spawning.
    - Handles account-wide weekly limit entries whose API scope has no model, while preserving threshold detection and reset timestamps.
  - Default: `[]` (empty list)
  - Usage: Applied when the LLM is invoked for analyzing issues, generating code, fixing bugs, and other file-modifying operations
  - Example:
    ```toml
    [backends.codex]
    model = "codex"
    options = ["--dangerously-bypass-approvals-and-sandbox"]
    ```
  - Behavior:
    - The system automatically adds required flags for each backend type during execution (e.g., `--dangerously-bypass-approvals-and-sandbox` for Codex)
    - Custom options specified here are appended to the automatically-added flags
    - Different backends may interpret options differently
    - Supports placeholder replacement for dynamic values (see Placeholder Replacement System below)
  - Configuration file: "~/.auto-coder/llm_config.toml"
  - Optional field: Backward compatible with existing configurations

- **`options_for_noedit` field**: CLI options for message generation (non-editing operations)
  - Purpose: Pass additional command-line arguments to backend CLIs when generating commit messages, PR descriptions, and other non-code operations
  - Type: List[str]
  - Default: `[]` (empty list)
  - Usage: Applied when the LLM is invoked for message generation operations (not code editing)
  - Example:
    ```toml
    [backends.gemini]
    model = "gemini-2.5-pro"
    options = ["--debug"]
    options_for_noedit = ["--silent"]
    ```
  - Behavior:
    - If not specified or empty, falls back to using `options` value
    - Allows different configurations for editing vs message generation
    - The system automatically adds required flags for each backend type during execution
    - Useful for optimizing different operations with different option sets
  - Configuration file: "~/.auto-coder/llm_config.toml"
  - Optional field: Backward compatible with existing configurations

- **`backend_for_noedit` configuration**: Separate backend configuration for non-editing operations
  - Purpose: Configure a different backend (or backend order) for message generation compared to code editing
  - Breaking Change: Renamed from `message_backend` to `backend_for_noedit`
  - Configuration Sections:
    - `[backend_for_noedit]`: Top-level section for non-editing backend configuration
    - Fields:
      - `default`: Default backend name for non-editing operations
      - `order`: List of backend names to try for non-editing operations (in order)
  - Example:
    ```toml
    [backend]
    default = "qwen"
    order = ["qwen", "antigravity", "claude"]

    [backend_for_noedit]
    default = "claude"
    order = ["claude", "qwen"]
    ```
  - Behavior:
    - If not specified, falls back to general backend configuration (`[backend]` section)
    - Allows optimization: use fast/cheap models for messages, premium models for code
    - Backward compatible: old `message_backend` key still works but emits deprecation warning
  - Migration:
    - Replace `[message_backend]` with `[backend_for_noedit]` in config files
    - Replace environment variable `AUTO_CODER_MESSAGE_DEFAULT_BACKEND` with `AUTO_CODER_NOEDIT_DEFAULT_BACKEND`
  - Configuration file: "~/.auto-coder/llm_config.toml"
  - Optional field: Defaults to general backend configuration if not specified

#### Placeholder Replacement System

- **Purpose**: Enable dynamic configuration values in option lists using placeholders
- **Documentation**: See [Configuration Guide](configuration_guide.md) for complete documentation
- **Supported Placeholders**:
  - `[model_name]` - Replaced with the backend's model value
  - `[sessionId]` - Replaced with session ID for resume functionality
  - `[settings]` - Replaced with backend's settings file path
  - `[model_provider]` - Replaced with backend's model_provider value
- **Implementation**: The `BackendConfig.replace_placeholders()` method processes all three option lists (`options`, `options_for_noedit`, `options_for_resume`)
- **Behavior**:
  - Placeholders are replaced with provided values at runtime
  - If a placeholder value is not provided, the placeholder remains unchanged
  - The method returns a new dictionary with processed lists, leaving the original configuration unmodified
  - Multiple occurrences of the same placeholder in a list are all replaced
- **Example Configuration**:
  ```toml
  [backends.codex]
  model = "gpt-5.1-codex-max"
  options = ["--model", "[model_name]", "--json", "--dangerously-bypass-approvals-and-sandbox"]
  options_for_noedit = ["--model", "[model_name]", "--json"]
  options_for_resume = ["--model", "[model_name]"]

  [backends.custom-claude]
  model = "opus"
  backend_type = "claude"
  settings = "/path/to/settings.json"
  options = ["--print", "--model", "[model_name]", "--settings", "[settings]"]

  [backends.openrouter-backend]
  model = "some/model:free"
  backend_type = "codex"
  model_provider = "openrouter"
  options = ["--model", "[model_name]", "-c", "model_provider=[model_provider]"]
  ```
- **Usage in Code**:
  ```python
  config = BackendConfig(name="codex", ...)
  processed = config.replace_placeholders(
      model_name="gpt-5.1-codex-max",
      session_id="sess_20241204",
      settings="/path/to/settings.json"
  )
  # processed['options'] = ["--model", "gpt-5.1-codex-max", "--json", "--dangerously-bypass-approvals-and-sandbox"]
  ```
- **Benefits**:
  - Single configuration template can be used with different models
  - Session-based backends can dynamically inject session IDs
  - Settings files can be configured without hardcoding paths in options
  - Model providers can be specified dynamically for OpenAI-compatible backends
  - Reduces configuration duplication
  - Supports dynamic runtime values without modifying configuration files
- **Backward Compatibility**: Fully backward compatible - configurations without placeholders work unchanged

#### Backend Management

    nested_managers:
      description: "Multiple backend manager instances can exist with different configurations"
      llm_backend: "Singleton instance for general LLM operations (PR processing, test fixes, code generation)"
      noedit_backend: "Separate singleton instance for non-editing operations (commit messages, PR messages)"
      usage: "Access via get_llm_backend_manager() and get_noedit_backend_manager() for different use cases"
      provider_manager: "BackendProviderManager is shared across backend manager instances and tracks provider rotation state"
      deprecated_names: "get_message_backend_manager(), run_llm_message_prompt(), get_message_backend_and_model() are deprecated - use get_noedit_backend_manager(), run_llm_noedit_prompt(), get_noedit_backend_and_model() instead"
  session_resume:
      description: "Persist and reuse backend session identifiers so supported backends can resume previous conversations."
      prerequisites:
        - "Backend configuration includes options_for_resume with a [sessionId] placeholder that matches the backend CLI flag"
      behavior:
        - "Captures session IDs from backend clients after each execution and persists them to ~/.auto-coder/backend_session_state.json"
        - "Automatically injects configured resume options when the same backend runs consecutively and a session ID is available"
        - "Clears persisted session data when rotating to a different backend to avoid cross-backend leakage"
      configuration_file: "~/.auto-coder/llm_config.toml"
      persistence_file: "~/.auto-coder/backend_session_state.json"

  retry_configuration:
      description: "Configurable retry mechanism for LLM backends when usage limits are hit"
      fields:
        - name: "usage_limit_retry_count"
          type: "int"
          default: 0
          purpose: "Number of retry attempts before switching to next backend"
        - name: "usage_limit_retry_wait_seconds"
          type: "int"
          default: 0
          purpose: "Seconds to wait between retry attempts"
      behavior:
        - "When AutoCoderUsageLimitError is caught, backend manager checks retry configuration"
        - "Retries the same backend up to configured count with specified wait time between attempts"
        - "After retries are exhausted, rotates to next available backend"
        - "Default behavior (0 retries, 0 wait) maintains backward compatibility with immediate rotation"
      example:
        toml_example: |
          [backends.gemini]
          model = "gemini-2.5-pro"
          usage_limit_retry_count = 3
          usage_limit_retry_wait_seconds = 30
      configuration_file: "~/.auto-coder/llm_config.toml"
      scope: "Per-backend configuration allows different backends to have different retry policies"
  post_execution_rotation:
      description: "Optional round-robin style rotation after every successful backend call"
      fields:
        - name: "always_switch_after_execution"
          type: "bool"
          default: false
          purpose: "If true, immediately switch to the next backend in backend.order after a successful execution"
      use_cases:
        - "Distribute traffic evenly across providers"
        - "Avoid soft per-backend limits by rotating proactively"
        - "Comply with backends that only permit a single execution per window"
      example:
        toml_example: |
          [backend]
          order = ["antigravity", "qwen", "claude"]

          [backends.antigravity]
          model = "gemini-2.5-pro"
          always_switch_after_execution = true

          [backends.qwen]
          model = "qwen3-coder-plus"
          always_switch_after_execution = true
      configuration_file: "~/.auto-coder/llm_config.toml"
      scope: "Per-backend flag; defaults to false when omitted"

#### Per-Backend Option Examples

The following examples demonstrate typical `options` and `options_for_noedit` configurations for each supported backend:

- **Codex Backend** (`backend_type = "codex"`):
  ```toml
  [codex]
  model = "codex"
  options = ["--dangerously-bypass-approvals-and-sandbox"]
  options_for_noedit = ["--dangerously-bypass-approvals-and-sandbox"]
  ```
  - Typical use: OpenAI-compatible providers (OpenRouter, Azure OpenAI, custom endpoints)
  - Automatic flags: `--dangerously-bypass-approvals-and-sandbox` during code editing operations
  - Custom options: Add tracking headers, timeouts, or provider-specific flags

- **Claude Backend** (`backend_type = "claude"`):
  ```toml
  [claude]
  model = "sonnet"
  backend_type = "claude"
  options = []
  options_for_noedit = []
  ```
  - Typical use: Anthropic Claude API
  - Automatic flags: `--print`, `--dangerously-skip-permissions`, `--allow-dangerously-skip-permissions`
  - Custom options: Path to settings file, debug modes
  - Cloud sessions: when `options` contain `--cloud` (or `--cloud=<description>`), the run is
    interactive-only. `--print` is never added and any `--print` / `--output-format <format>`
    entry is removed from the options, because the claude CLI rejects
    `--cloud` combined with `--print` and `--output-format` only works with `--print`.
    The prompt is passed as the trailing argument and becomes the cloud task description.
    Such runs are executed through a pseudo terminal (`CommandExecutor.run_command(..., use_pty=True)`),
    because the claude CLI aborts with "--cloud requires an interactive terminal" when stdout is a pipe.
    In pty mode stdout and stderr are merged into a single stream and ANSI escape sequences are stripped
    from the captured output.
  - Configuration recovery: before invoking the CLI, a missing or unparsable `~/.claude.json`
    (or `$CLAUDE_CONFIG_DIR/.claude.json`) is restored from the newest usable backup in
    `~/.claude/backups/`; an unparsable file is preserved as `.claude.json.corrupt.<timestamp>`.

- **Gemini Backend** (`backend_type = "antigravity"`):
  ```toml
  [gemini]
  model = "gemini-2.5-pro"
  backend_type = "antigravity"
  options = []
  options_for_noedit = []
  ```
  - Typical use: Google Gemini API
  - Automatic flags: `--dangerously-skip-permissions`, `--force-model`
  - Custom options: Debug modes, output formatting

- **Qwen Backend** (`backend_type = "qwen"`):
  ```toml
  [qwen]
  model = "qwen3-coder-plus"
  backend_type = "qwen"
  options = []
  options_for_noedit = []
  ```
  - Typical use: Native Qwen CLI with OAuth authentication
  - Automatic flags: `-y` (auto-confirm)
  - Custom options: Stream settings, debug modes, timeouts

- **Qwen via OpenRouter** (`backend_type = "codex"`):
  ```toml
  [qwen-openrouter]
  model = "qwen/qwen3-coder:free"
  backend_type = "codex"
  openai_api_key = "sk-or-v1-your-key"
  openai_base_url = "https://openrouter.ai/api/v1"
  options = ["-o", "HTTPReferer", "https://yourapp.com", "-o", "XTitle", "Auto-Coder"]
  options_for_noedit = ["-o", "timeout", "30"]
  ```
  - Typical use: Qwen models through OpenAI-compatible API
  - Automatic flags: `--dangerously-bypass-approvals-and-sandbox`
  - Custom options: Tracking headers, timeouts, stream settings

- **Auggie Backend** (`backend_type = "auggie"`):
  ```toml
  [auggie]
  model = "GPT-5"
  backend_type = "auggie"
  options = []
  options_for_noedit = []
  ```
  - Typical use: AugmentCode Auggie CLI
  - Automatic flags: `--print`
  - Custom options: Debug modes, output formatting

- **Jules Backend** (`backend_type = "jules"`):
  ```toml
  [jules]
  backend_type = "jules"
  options = []
  options_for_noedit = []
  ```
  - Typical use: Session-based AI assistant (Jules)
  - Automatic flags: Minimal - Jules manages sessions internally
  - Custom options: Usually minimal due to session-based nature

#### Empty PR Handling

  empty_pr_handling:
    description: "Detection and requeueing of pull requests with zero effective diff against the base branch."
    zero_diff_detection:
      - "When a PR has zero changed files (or additions and deletions are zero / diff is empty), it is treated as a failed processing attempt even if the branch contains commits."
      - "The empty PR is closed automatically with an explanatory comment."
      - "The associated source issue is resolved from the PR body, session ID, branch name, or title."
      - "If the source issue was closed as a side effect of the PR relationship, it is reopened before reprocessing."
      - "The source issue's attempt counter is incremented, and its @auto-coder label is removed."
      - "The issue is requeued through the normal issue-processing path so the next attempt-based routing/fallback model takes over."
      - "Non-empty PR behavior remains unchanged."

#### Jules PR Handling

  jules_pr_handling:
    description: "Rules applied to PRs created by Jules (google-labs-jules)."
    no_automatic_local_fixes:
      - "Auto-Coder never pushes automatic fix commits to a Jules PR branch: Jules does not recognize commits made to its branch by other actors, so such commits desynchronize the Jules session."
      - "CI failures are reported back to the Jules session instead, and Jules is expected to push the fix itself."
      - "Only an explicit local run that is already checked out on the PR branch keeps fixing the working copy directly."
    ci_timeout:
      - "When a Jules PR still has failing (completed) CI more than [jules].pr_ci_timeout_hours after it was created, the PR is closed as unfixable."
      - "The attempt counter of the issue linked to the PR is incremented so the issue is retried from scratch."
      - "The issue is resolved from the PR body links first, then from the Jules session ID, branch name, or PR title."
      - "Default timeout: 12 hours. Configurable via [jules].pr_ci_timeout_hours in config.toml."
      - "PRs whose CI is still running, or whose CI passed, are never closed by this rule."
      - "The check runs before every '@auto-coder label present' skip (candidate collection, single-target processing, and process_pull_request); a stale PR normally still carries the label from an earlier run and would otherwise never be revisited."
      - "Closing also releases the issue: the @auto-coder label that the dead Jules session kept on the linked issue is removed, and the issue is processed again in the same run (queued as a candidate in the daemon, processed inline for single-target runs)."
      - "PRs that are already closed are ignored, so the attempt counter is never incremented twice for the same PR."
    issue_pr_timeout:
      - "When a Jules session has been working on an issue for more than [jules].issue_pr_timeout_hours without opening a PR, the session is sent a 'stop' message and the issue is implemented by the backend_with_high_score backend instead."
      - "Default timeout: 12 hours. Configurable via [jules].issue_pr_timeout_hours in config.toml."
      - "The session-to-issue mapping comes from cloud.csv; sessions tracked against a PR number are ignored by this rule."
      - "Sessions whose outputs already contain a pullRequest, and issues that already have a linked PR on GitHub, are never stopped."
      - "Closed issues are skipped, and a session that fails to accept the stop message keeps the issue."
      - "The attempt counter of the issue is incremented, so the fallback starts from a fresh attempt branch instead of the one the Jules run left behind."
      - "The @auto-coder label the Jules run left on the issue is kept in place so no other instance picks the issue up while the fallback works on it; the fallback run passes check_labels=False so the label gate does not skip the issue it already owns."
      - "Stopped sessions are recorded in .auto-coder/jules_session_state.json so they are neither resumed nor handed over twice."
      - "The check runs once per producer/run loop iteration, right after the Jules session resume/archive pass."
    session_listing_cache:
      - "Listing Jules sessions walks the whole paginated /sessions collection, which takes minutes once a repository accumulates thousands of sessions."
      - "The raw (unfiltered) listing is cached process-wide in jules_client, so every list_sessions call shares a single HTTP fetch regardless of the JulesClient instance or the repo_name filter used."
      - "Repository and ARCHIVED filtering still happens client-side on each call, so callers keep receiving their own filtered view."
      - "The producer/run loop calls invalidate_jules_sessions_cache() once per iteration, immediately before the Jules resume/archive, stale-issue, and recurrent-task passes: exactly one listing request per loop iteration."
      - "A failed listing is never cached, so the next call retries the fetch."
    label_locking:
      - "Jules mode keeps the @auto-coder label on an issue for the lifetime of its session, so an aborted session would otherwise lock the issue permanently."
      - "With check_labels=False (--only and WIP-branch resume) an existing @auto-coder label no longer blocks processing; the label is left in place because the run does not own it."

#### Breaking Changes Documentation

Recent configuration schema changes that require migration:

**BREAKING CHANGE (v2026.1.0.0)**: Removed hardcoded default options from CodexClient
   - **What Changed**: The CodexClient no longer includes hardcoded `-s workspace-write` options in codex CLI commands.
   - **Impact**: Users who relied on these hardcoded options will need to explicitly configure them in their backend configuration.
   - **Migration Required**:
     - Add the following to your `~/.auto-coder/llm_config.toml`:
       ```toml
       [backends.codex]
       model = "codex"
       options = ["-s", "workspace-write"]
       ```
     - Or configure any custom options you need for your specific use case.
   - **Rationale**: Hardcoded options were considered excessive and limited flexibility. This change allows users to configure exactly the options they need.
   - **Version**: v2026.1.0.0 (Major version bump due to breaking change)

**1. Configuration Field Renames**:
   - **`message_backend` → `backend_for_noedit`**:
     - Old config:
       ```toml
       [message_backend]
       default = "claude"
       order = ["claude", "qwen"]
       ```
     - New config:
       ```toml
       [backend_for_noedit]
       default = "claude"
       order = ["claude", "qwen"]
       ```
     - Migration: Update all config files to use new field name
     - Deprecation: Old name still works but emits warning and will be removed in future version

**2. Environment Variable Renames**:
   - **`AUTO_CODER_MESSAGE_DEFAULT_BACKEND` → `AUTO_CODER_NOEDIT_DEFAULT_BACKEND`**:
     - Migration: Update environment variables to new name
     - Deprecation: Old name still works but emits warning

**3. Hardcoded Options Removal**:
   - **Before**: CLI options were hardcoded in client implementations
     - Codex: always used `--dangerously-bypass-approvals-and-sandbox`
     - Claude: always used `--print --dangerously-skip-permissions --allow-dangerously-skip-permissions`
     - Gemini: always used `--dangerously-skip-permissions --force-model`
     - Qwen: always used `-y`
   - **After**: Options are configurable through `options` and `options_for_noedit` fields
     - System automatically adds required flags for each backend
     - Users can add custom options beyond the defaults
     - Allows fine-tuning per-operation-type behavior
   - Migration: No action required - configuration is backward compatible
   - Benefits: Full customization, better separation of concerns

**4. Default Option Behavior**:
   - When `options_for_noedit` is not specified, it now falls back to `options` value
   - Previously, each backend had different default behaviors
   - Migration: No action required - existing configs work as expected
   - Note: Empty list `[]` means use defaults, not "no options"

