## Quota Surplus-Based High-Score Backend Selection

  quota_surplus_high_score_selection:
    description: "Selects candidate backends for backend_with_high_score and backend_with_high_score_cloud based on weekly quota surplus rather than nearest reset time."
    implementation: |
      evaluate_backend_quota, rank_high_score_backends_by_quota, linear_planned_remaining_ratio,
      calculate_quota_surplus in src/auto_coder/quota_selector.py,
      create_high_score_backend_manager, create_high_score_cloud_backend_manager in src/auto_coder/cli_helpers.py,
      _process_issue_high_score_cloud in src/auto_coder/issue_processor.py
    behavior:
      - "Calculates planned remaining quota ratio using a weekly consumption curve (planned_remaining_ratio = time_until_reset / quota_period)."
      - "Computes quota surplus as (actual_remaining_ratio - planned_remaining_ratio) independently for each candidate backend using its own reset timestamp."
      - "Prioritizes eligible backends with the largest positive quota surplus (consuming slower than planned), avoiding premature quota exhaustion."
      - "Preserves existing capability and availability checks; ineligible backends (e.g. usage limit reached, insufficient minimum remaining percentage) are filtered out."
      - "Unmetered backends or backends without weekly quota metrics retain stable fallback ordering."
      - "Backends whose usage metrics cannot be retrieved (e.g. rate-limited token refresh or API errors) have their priority lowered below measured and unmetered backends."

## Early Loop Resume on PR Merge/Close & Jules Enumeration Skip

  producer_early_wake_on_pr_event:
    description: "Cuts short the main producer loop sleep duration (300s) upon PR merge or close events and resumes candidate processing immediately while skipping Jules session enumeration."
    implementation: |
      notify_pr_merged_or_closed, _sleep_or_wake, _check_if_pr_merged_or_closed,
      _producer_loop, _worker_loop in src/auto_coder/automation_engine.py,
      process_github_payload in src/auto_coder/webhook_server.py
    behavior:
      - "When a PR is merged or closed (internally by a worker, via branch cleanup, or externally received via GitHub webhook), signals the engine to cut short the active wait time in _producer_loop."
      - "On early resume, bypasses time-consuming Jules session listing and checks (invalidate_jules_sessions_cache, check_and_resume_or_archive_sessions, handle_stale_jules_issue_sessions, check_and_start_recurrent_jules_tasks_async) for that single iteration."
      - "Immediately pulls latest changes and checks for actionable candidates so unlocked issues or PRs can be picked up without waiting for the full sleep duration to elapse."
      - "Subsequent scheduled iterations (when sleep completes normally) continue to enumerate and check Jules sessions as usual."

## Strong-Model Adversarial Validation Before PR Merge

  adversarial_validation_before_merge:
    description: "Executes a strong-model adversarial review on green PRs to falsify the implementation against the issue specification oracle and trigger corrective regression fixes before merge."
    implementation: |
      run_adversarial_validation, parse_adversarial_validation_response,
      build_adversarial_validation_context, extract_changed_test_files,
      apply_adversarial_fix in src/auto_coder/adversarial_validator.py,
      _handle_pr_merge in src/auto_coder/pr_processor.py,
      create_adversarial_validation_backend_manager in src/auto_coder/cli_helpers.py,
      backend_adversarial_validation in src/auto_coder/llm_backend_config.py
    configuration:
      - "[backend_adversarial_validation]: Configures order / default / model for the strong adversarial reviewer in ~/.auto-coder/llm_config.toml."
      - "ENABLE_ADVERSARIAL_VALIDATION (AutomationConfig): Toggle feature on/off (default: True, overridable via AUTO_CODER_ENABLE_ADVERSARIAL_VALIDATION env var)."
    behavior:
      - "Runs after normal CI / GitHub Actions checks are green and before merge eligibility."
      - "Fail-Closed Design: PASS is only produced for an explicitly parsed, internally consistent PASS with 0 blocking findings; all empty, malformed, contradictory, or inconclusive responses block PR merge."
      - "Oracle Acquisition Required: Fails closed (BLOCKED) if the linked issue specification or acceptance criteria cannot be acquired."
      - "Backend Independence: Uses independently configured strong model without silently falling back to the general implementation backend."
      - "Diff Truncation Transparency: Alerts the reviewer when diffs exceed limits and provides complete changed-file lists so partial review is never misrepresented as complete coverage."
      - "Dynamic-on-Suspicion Contract: Supports dynamic test execution when requested by the reviewer; failure or inability to execute dynamic checks fails closed."
      - "Requires concrete behavioral counterexamples: `Given state S, when action A occurs, then specification requires R, but implementation produces X, and tests pass because ...`."
      - "Regression Test Verification: When NEEDS_FIX is determined, verifies that a focused regression test file was added/modified before completing the corrective fix loop."
      - "When NEEDS_FIX is determined:"
        - "Blocks PR merge."
        - "Checks out the PR branch and triggers a corrective fix prompt with the concrete counterexamples on the same PR / branch."
        - "Instructs the implementation agent to add a focused regression test reproducing the counterexample and fix the code."
        - "Stages, commits, and pushes changes to GitHub to trigger a new CI run."
        - "Re-runs adversarial validation once CI is green again; only merges after validation returns PASS."
