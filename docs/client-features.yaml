## Attempt Mechanism

  attempt_management:
    description: "Tracks retries per issue/PR and aligns work branches to the current attempt."
    tracking:
      - "Attempts are recorded as standardized comments 'Auto-Coder Attempt: <N>' with an optional detail suffix."
      - "get_current_attempt reads the latest attempt number from those comments (legacy timestamped comments stay compatible)."
      - "Comments are read with full pagination (100 per page), so attempt numbers stay correct on issues with more than one page of comments."
    deduplication:
      - "PR-driven increments carry a trigger marker 'trigger=pr-<number>-<head sha (12 chars)>' in the attempt comment."
      - "increment_attempt skips the increment when the latest attempt comment already records the same trigger, so a PR that keeps failing on the same commit bumps the counter only once."
      - "New commits on the PR produce a new trigger and therefore a new attempt; sub-issue propagation inherits the parent trigger."
      - "Callers that pass no trigger (e.g. Jules timeout handling, which runs once per closed PR) keep incrementing unconditionally."
    branching:
      - "Work branches follow issue-<number> for the first pass and issue-<number>/attempt-<N> for subsequent passes; parent branches cascade to sub-issues."
      - "When the local branch is behind the recorded attempt, Auto-Coder switches or recreates the correct attempt branch before continuing work."
      - "New attempt branches are created from the validated base branch (main or the parent's current attempt branch) to re-implement changes safely."
    fallback:
      - "PR failures that cannot be auto-merged (LLM CANNOT_FIX/unclear output, commit/push errors, failed merges or conflict resolution) trigger attempt increments for every linked issue."
      - "Jules PRs that still have failing CI more than [jules].pr_ci_timeout_hours (default 12) after PR creation are closed, and the attempt counter of the linked issue is incremented so the issue is retried from scratch."
      - "Jules sessions that do not open a PR within [jules].issue_pr_timeout_hours (default 12) are stopped, the attempt counter of the issue is incremented, and the issue is implemented by the backend_with_high_score backend instead."
      - "Conflict resolver fallbacks do the same when LLM-based conflict handling leaves unresolved markers or cannot push a clean merge, deduplicated by the PR head commit."
      - "When attempt count reaches 3 for any linked issue, the system automatically switches to the configured fallback backend (see [backend_with_high_score] configuration)."
      - "Backend fallback provides a fresh perspective using a different LLM after multiple failed attempts, improving chances of successful PR resolution."
    propagation:
      - "increment_attempt propagates attempt counter increments to all sub-issues to keep parent/child attempts in sync without reopening closed sub-issues."
    parent_handling:
      - "When processing a child issue whose parent issue is closed, the system automatically reopens the parent issue before continuing"
      - "This ensures branch selection, base branch selection, and attempt tracking use the parent issue context"
      - "Reopening closed parents maintains proper workflow continuity and prevents branch naming and base selection issues"
      - "When processing a child issue whose parent issue is closed, the system does not reopen the parent issue"
      - "Sub-issues are merged directly into the main branch upon completion"
      - "When all sub-issues of a parent issue are closed, the parent issue is processed via backend_with_high_score_cloud on a work branch from main"
      - "The prompt instructs the AI model to verify that main satisfies what the group of sub-issues was intended to implement, and implement any remaining requirements specified in the parent issue"


## Lock Mechanism

  lock_mechanism:
    description: "Prevents concurrent auto-coder executions to avoid conflicts and data corruption"
    behavior:
      - "Automatically acquires a lock before executing any command (except read-only commands like 'config' and 'unlock')"
      - "Lock files are stored in the repository's .git directory as 'auto-coder.lock'"
      - "Lock information includes PID, hostname, and start time"
      - "Automatically detects stale locks (process no longer running)"
      - "Lock is released when command completes successfully"
      - "Supports context manager protocol for safe lock acquisition and release"
    usage_patterns:
      context_manager:
        description: "Recommended pattern using Python's with statement"
        example: |
          with LockManager() as lock:
              # Lock is automatically acquired here
              do_work()
          # Lock is automatically released here, even if an exception occurs
        benefits:
          - "Automatic cleanup even on exceptions"
          - "More Pythonic and readable code"
          - "Prevents accidental lock leaks"
      manual_management:
        description: "Explicit acquire/release pattern"
        example: |
          lock = LockManager()
          if lock.acquire():
              try:
                  do_work()
              finally:
                  lock.release()
        use_cases:
          - "Complex control flow requiring early release"
          - "Legacy code compatibility"
    commands:
      auto_lock:
        description: "Lock is automatically acquired by default for all commands"
        exceptions: "Read-only commands ('config', 'unlock', 'auth-status', 'get-actions-logs', 'mcp-pdb', 'health', 'usage-amount')"
      unlock:
        description: "Manually remove a lock file"
        usage: "auto-coder lock unlock"
        options:
          - "--force: Force remove lock file even if process appears to be running (use with caution)"
        behavior:
          - "Shows lock information before removing"
          - "Prevents removal if process is still running (unless --force is used)"
          - "Automatically detects and removes stale locks without --force flag"
    error_handling:
      concurrent_execution:
        description: "When another instance is already running"
        message: "Displays error with lock information (PID, hostname, start time, status)"
        action: "User must wait for existing instance to complete or use 'unlock' command"
      stale_lock:
        description: "When lock file exists but process is no longer running"
        detection: "Checks if PID is still active using os.kill(pid, 0) on Unix or OpenProcess on Windows"
        action: "Safe to remove without --force flag"
    technical_details:
      implementation: "LockManager class in src/auto_coder/lock_manager.py"
      cli_commands: "src/auto_coder/cli_commands_lock.py"
      integration: "Lock check in cli.py before command execution"
      skip_conditions: "Temporary directories (paths containing 'tmp' or 'pytest')"
      storage_format: "JSON file with pid, hostname, and started_at fields"


## Merge Conflict Handling

  mergeability_check:
    description: "Decides whether merging the base branch into a PR would degrade code quality before conflicts are resolved."
    implementation: "check_mergeability_with_llm in src/auto_coder/conflict_resolver.py"
    behavior:
      - "For regular PRs the LLM is asked once and must answer SAFE_TO_MERGE or DEGRADING_MERGE; unclear or missing answers are treated as unsafe."
      - "Dependency-bot PRs never reach this check because their conflicts are not resolved at all (see dependency_bot_conflict_skip)."
      - "Jules PRs (google-labs-jules[bot]) are not treated as dependency bots and still go through the LLM check."

  dependency_bot_conflict_skip:
    description: "Merge conflicts of dependency-bot PRs are never resolved by auto-coder."
    implementation: |
      _perform_base_branch_merge_and_conflict_resolution in src/auto_coder/conflict_resolver.py,
      _update_with_base_branch / _resolve_pr_merge_conflicts / _merge_pr in src/auto_coder/pr_processor.py
    behavior:
      - "Dependency-bot PRs (Dependabot/Renovate/'[bot]' logins, detected via _is_dependabot_pr) are detected before any conflict resolution starts."
      - "When a conflict is detected on such a PR the in-progress merge is aborted with 'git merge --abort' and the routine returns without calling the LLM."
      - "_resolve_pr_merge_conflicts fetches the PR details first and returns False for dependency-bot PRs before checking out the PR branch."
      - "_merge_pr does not attempt conflict resolution when an unmergeable PR is authored by a dependency bot."
      - "Rationale: dependency bots recreate or rebase their PRs against the updated base branch themselves, so resolving conflicts locally only wastes LLM calls and can clobber the bot's own update."
      - "Jules PRs (google-labs-jules[bot]) are not treated as dependency bots and keep their existing conflict handling."


## Git Pull Recovery

  git_pull_recovery:
    description: "git_pull recovers automatically from local repository state that blocks a pull; uncommitted local changes are expendable."
    implementation: "git_pull, discard_local_changes, abort_in_progress_git_operations and reset_branch_to_remote in src/auto_coder/git_branch.py"
    behavior:
      - "Pull is attempted up to max_attempts times (default 3); each failure is classified from the combined stderr/stdout before a targeted remediation is applied."
      - "Local changes blocking the merge ('Your local changes ... would be overwritten by merge', 'Please commit your changes or stash them', 'untracked working tree files would be overwritten', 'you have unstaged changes') are discarded with 'git reset --hard HEAD' + 'git clean -fd', then the pull is retried."
      - "'git clean' never uses -x, so ignored files (build artifacts, virtualenvs, local configuration) are preserved."
      - "Unfinished merge/rebase/cherry-pick state and a stale .git/index.lock are cleared by aborting all three operations and deleting the lock file, then the pull is retried."
      - "Transient remote failures (host resolution, timeouts, 'RPC failed', 'early EOF', 'unable to access') are retried as-is with an exponential backoff capped at 5 seconds; they never trigger a hard reset."
      - "Diverging branches and merge conflicts are delegated to resolve_pull_conflicts as before."
      - "'no tracking information' / 'no such ref was fetched' is still reported as success because it is the normal case for a new branch."
      - "As a last resort the branch is hard-reset onto the remote branch (fetch + 'git reset --hard FETCH_HEAD' + 'git clean -fd')."
      - "The hard reset is refused when the branch has unpushed commits, so committed work is never lost; only uncommitted changes are discarded."
      - "discard_local=False disables every destructive step: the original pull error is returned instead."


## Security & Access Control

  github_author_allowlist:
    description: "Restrict automatic processing of GitHub Issues and Pull Requests to explicitly trusted GitHub users based on numeric user IDs."
    implementation: |
      get_issue_allowlist_from_config / get_pr_allowlist_from_config in src/auto_coder/llm_backend_config.py,
      ISSUE_ALLOWLIST / PR_ALLOWLIST in src/auto_coder/automation_config.py,
      _is_issue_author_allowed / _is_pr_author_allowed in src/auto_coder/automation_engine.py,
      author_id extraction in src/auto_coder/util/gh_cache.py
    configuration:
      file: "~/.auto-coder/config.toml or .auto-coder/config.toml"
      example: |
        [github]
        issue_allowlist = [12345678, 87654321]
        pr_allowlist = [12345678, 87654321]
    behavior:
      - "Supports separate allowlists for Issues (`issue_allowlist`) and Pull Requests (`pr_allowlist`)."
      - "Stores GitHub numeric user IDs rather than usernames because user IDs are immutable."
      - "When an allowlist is configured, Issues/PRs authored by non-allowlisted users are completely and silently ignored."
      - "No LLM calls are invoked, no CI checks or comments are made, and no labels or branches are modified for untrusted authors."
      - "Allowlist check is performed as early as possible before processing any issue or PR content."
      - "When an allowlist is not set (None), all authors are allowed by default for backward compatibility."
      - "When an allowlist is explicitly set to an empty list `[]`, all authors are denied."
      - "Supports environment variable overrides via `AUTO_CODER_ISSUE_ALLOWLIST` and `AUTO_CODER_PR_ALLOWLIST` (JSON array or comma-separated integers)."

## Parent-Issue Metadata Fallback for Sub-issues

  parent_issue_metadata_fallback:
    description: "Declarative fallback in issue bodies (Parent-Issue: #<number>) for sub-issue relationships when native sub-issues cannot be created."
    implementation: |
      parse_parent_issue_number, add_sub_issue, get_parent_issue_details, get_open_issues_json in src/auto_coder/util/gh_cache.py,
      sibling exclusion and _has_open_sub_issues in src/auto_coder/automation_engine.py
    behavior:
      - "Parses `Parent-Issue: #<number>` case-insensitively from issue bodies."
      - "Attempts to promote/register the issue as a native GitHub sub-issue using the GitHub REST API (POST /repos/{owner}/{repo}/issues/{parent_number}/sub_issues) when possible."
      - "If native sub-issue promotion fails or is unsupported in the agent environment, retains the metadata as a fallback parent relationship."
      - "Scans all open issues upfront at the beginning of issue retrieval/processing to detect Parent-Issue relationships before constructing issue candidates, ensuring correct processing order even when a parent issue has a lower number than its sub-issues."
      - "Before implementation admission, native parent, sub-issue, and dependency relationships are refreshed through cache-bypassing REST reads. Parents with open children remain containers; siblings are ordered only by explicit Blocked-By/native dependency edges, while unavailable or malformed hierarchy evidence fails closed and is retried by capacity refill."
      - "Explicit `--only` Issue processing strictly enumerates current open Issues and performs a relationship-only reconciliation of every declaration affecting the target's parent/direct-child set before validation or dispatch, then re-reads the native hierarchy; failures block or defer the target without processing discovered siblings."

## Cloud Task Execution Abstraction

  cloud_task_abstraction:
    description: "Unified abstraction for asynchronous cloud coding tasks across Jules, Claude Routine, and Codex Cloud."
    implementation: |
      CloudTaskClientBase, CloudTaskState, CloudTask in src/auto_coder/cloud_task_client_base.py,
      JulesClient in src/auto_coder/jules_client.py,
      ClaudeRoutineClient in src/auto_coder/claude_routine_client.py,
      CodexCloudClient in src/auto_coder/codex_cloud_client.py,
      CloudTaskEngine in src/auto_coder/cloud_task_engine.py
    architecture:
      - "CloudTaskClientBase extends LLMClientBase and defines common lifecycle methods: continue_if_paused(), start_task(), get_task(), list_tasks(), stop_task()."
      - "CloudTaskState normalizes task states into: QUEUED, RUNNING, PAUSED, COMPLETED, FAILED, UNKNOWN."
      - "JulesClient implements CloudTaskClientBase, encapsulating Jules-specific state inspection, plan approval, and continuation messaging."
      - "ClaudeRoutineClient implements CloudTaskClientBase. Treats absence of a created PR as substitute paused state, and sends 'continue' messages via 'claude -p --cloud <session_id>' every 1 hour up to 5 hours from start."
      - "CodexCloudClient manages asynchronous Codex Cloud task execution via 'codex cloud exec --env <ENV_ID> [--branch <BRANCH>] PROMPT', 'codex cloud list --json', 'codex cloud status <TASK_ID>', 'codex cloud diff <TASK_ID>', and 'codex cloud apply <TASK_ID>'. continue_if_paused returns False as follow-up messaging is currently unsupported in Codex Cloud CLI."
      - "ClaudeClient and CodexClient remain focused on local/non-cloud execution only."
      - "The orchestration layer interacts with cloud providers uniformly through CloudTaskClientBase without embedding provider-specific state names."
      - "Cloud implementation associations in cloud.csv persist both provider and task/session ID. Adversarial validation resolves this durable ownership and uses CloudTaskClientBase.send_followup; legacy providerless rows, ambiguous ownership, unavailable providers, and providers without follow-up support fail closed without probing another provider. Delivery receipts include provider plus task identity, and follow-up assignment remains independent of paused-task recovery."

## Cloud Run Lifecycle Abstraction (non-Jules)

  cloud_run_lifecycle:
    description: "Durable, provider-agnostic lifecycle abstraction for a non-Jules cloud provider run of a single Issue attempt, separate from CloudTaskClientBase transport operations. Implementation step 1/3 added the abstraction; step 2/3 wired Codex Cloud Issue dispatch through it with a manual-only retry policy; step 3/3 made empty-PR recovery CloudRun-aware. Does not change Jules behavior."
    implementation: |
      CloudRun, CloudRunRepository, CloudRunEvent, CloudRunPolicy, evaluate_new_attempt
      in src/auto_coder/cloud_run.py
      CodexCloudRunPolicy, get_policy_for_provider in src/auto_coder/cloud_run_policies.py
      Codex Cloud dispatch guard in _process_issue_codex_cloud_mode() in src/auto_coder/issue_processor.py
      CloudRun-aware empty-PR gate in _is_cloud_run_retry_blocked() / _close_empty_pr() in src/auto_coder/pr_processor.py
    architecture:
      - "CloudRun is a dataclass keyed by (repo_name, issue_number, attempt) that records provider identity, provider task/session id, and an ordered, de-duplicated list of associated pull request numbers (pull_request_numbers)."
      - "CloudRun.add_pull_request() appends a new PR number while preserving every previously associated PR, so a single task/run can own zero, one, or multiple PRs."
      - "CloudRunRepository persists CloudRun records as JSON under ~/.auto-coder/<repo>/cloud_runs.json (or a custom storage_path), keyed by '<issue_number>:<attempt>'. A freshly constructed CloudRunRepository instance recovers all runs from disk, independent of any in-memory state from a prior process."
      - "CloudRunRepository.get_by_task_id() performs a reverse lookup from a provider task/session id to its CloudRun, intended for duplicate-dispatch protection."
      - "CloudRunPolicy is an abstract base class with allow_new_attempt(event: CloudRunEvent) -> bool. Provider-specific retry/auto-transition rules are expressed as CloudRunPolicy implementations supplied by the caller."
      - "evaluate_new_attempt(event, policy) is the single generic entry point for lifecycle code to ask whether an event may transition a run to a new attempt; it delegates entirely to the supplied policy and never branches on CloudRun.provider."
      - "This module is independent of CloudTaskClientBase: CloudRunRepository and CloudRunPolicy operate only on CloudRun/CloudRunEvent data and never require a transport client instance. Provider clients (JulesClient, ClaudeRoutineClient, CodexCloudClient) remain unchanged and continue to own only transport operations (start/query/continue/follow-up/stop)."
      - "Jules is explicitly out of scope: JulesClient and CloudManager (issue_number -> session_id CSV mapping) are untouched and are not migrated to CloudRun."
      - "_process_issue_codex_cloud_mode() looks up the issue's current attempt (attempt_manager.get_current_attempt, parsed from 'Auto-Coder Attempt:' issue comments) and checks CloudRunRepository.get(issue_number, attempt) before dispatching. If a codex-cloud CloudRun already exists for that attempt, CodexCloudClient.start_task() is not called again; the existing task_id is reused and the @auto-coder label context is kept. This guard is independent of the @auto-coder label, so it remains effective across a process restart and when the label is missing, stale, or inconsistent."
      - "On a successful new dispatch, a CloudRun(provider='codex-cloud') is saved for (issue_number, attempt) before CloudManager.add_session() records the task id in cloud.csv, so the durable duplicate-dispatch guard is in place before the task-identifying issue comment is posted."
      - "CodexCloudRunPolicy (src/auto_coder/cloud_run_policies.py) implements CloudRunPolicy with a manual-only retry rule: allow_new_attempt() returns True only for a CloudRunEvent whose reason is the MANUAL_RETRY_REASON ('manual') marker. RUNNING, PAUSED, FAILED, UNKNOWN, a stalled/no-progress timeout, an empty PR, or the absence of a PR must never by themselves authorize a new attempt or replacement Codex Cloud task; only an explicitly human-driven or otherwise separately authorized transition (reason='manual') is allowed through. Automatic unrecoverable-state detection for Codex Cloud remains a non-goal."
      - "get_policy_for_provider(provider) (src/auto_coder/cloud_run_policies.py) is the single provider-name-to-CloudRunPolicy mapping (currently 'codex-cloud' -> CodexCloudRunPolicy()); generic Issue/PR processing code calls this instead of branching on provider name itself, so a future provider only needs a new policy entry here."
      - "_is_cloud_run_retry_blocked() (src/auto_coder/pr_processor.py) is the CloudRun-aware gate used by _close_empty_pr(): for the issue's current attempt, it loads any persisted CloudRun, associates the PR being closed with that run via CloudRunRepository.add_pull_request() (preserving every other PR already associated with the run), and asks the run's policy (via get_policy_for_provider) whether a CloudRunEvent(reason='empty_pr') authorizes a new attempt. When the policy denies it (e.g. CodexCloudRunPolicy), _close_empty_pr() still closes the empty PR but skips incrementing the Issue's attempt counter and skips releasing the @auto-coder label, so no replacement Codex Cloud task is started or enqueued and any other PR owned by the same run continues through ordinary PR processing unaffected. When the issue's current attempt has no persisted CloudRun (e.g. Jules) or the provider has no registered policy, this returns False and the pre-existing attempt-increment/requeue behavior is unchanged."

## PR Review Thread Merge Gate

  unresolved_review_threads_gate:
    description: "Block PR auto-merge while unresolved review threads exist."
    implementation: |
      ReviewThread, get_pr_review_threads, has_unresolved_review_threads in src/auto_coder/util/gh_cache.py,
      has_unresolved_review_threads, _process_pr_for_merge, _handle_pr_merge, _merge_pr in src/auto_coder/pr_processor.py
    behavior:
      - "Before performing an automatic merge, retrieves the PR review threads from GitHub GraphQL API (PullRequestReviewThread.isResolved)."
      - "If any review thread is unresolved (isResolved == False):"
        - "The PR is not merged and remains open."
        - "When the PR is associated with an existing Codex Cloud task, Auto-Coder assigns the unresolved review work to that same task through a follow-up. The prompt pins work to the current PR head/base branches, requires fixes and tests to be pushed to the existing PR, and forbids replacement branches or PRs."
        - "Cloud repair delivery keeps a stable per-finding identity for cross-path deduplication and a durable remediation-generation identity derived from terminal activity of the owning implementation task or applicable implementer provenance evidence. A head change alone does not advance remediation, so unrelated commits remain deduplicated. The first independent failed revalidation after genuine corrective activity is delivered once to every supported originating provider with an explicit failed-correction explanation. Both identities are recorded locally and in trusted PR-side receipts, so this lifecycle distinction survives restarts while ordinary unresolved-thread routing remains deduplicated. WHAM 429/5xx and transport failures retain their reconciliation safeguards, and definite client rejection remains retryable."
        - "Linked issue attempt counters are not incremented."
        - "The condition is treated as deferred processing rather than an execution failure."
        - "Future runs re-check the review threads and merge once all threads are resolved."
      - "Resolved review threads (isResolved == True) and normal PR conversation comments do not block merge."
      - "Applies generically to all PRs handled by Auto-Coder."

## AI Backend Usage Amount CLI

  usage_amount_command:
    description: "Inspect quota utilization, rate limit windows, and remaining usage for Claude and Codex AI backends."
    implementation: |
      usage_amount in src/auto_coder/cli_commands_usage.py,
      check_claude_usage in src/auto_coder/claude_usage_checker.py,
      get_codex_weekly_usage in src/auto_coder/codex_usage_checker.py
    commands:
      usage_amount:
        usage: "auto-coder usage-amount [TARGET] [--backend all|claude|codex] [--json] [--no-cache] [--token TOKEN]"
        description: "Check AI backend quota and usage amounts for Claude (Anthropic OAuth) and Codex (ChatGPT OAuth)."
        options:
          - "TARGET: Optional positional argument ('all', 'claude', 'codex', default: 'all')"
          - "--backend, -b: Target backend option ('all', 'claude', 'codex')"
          - "--json: Output results in structured JSON format"
          - "--no-cache: Bypass in-memory cache and fetch fresh usage data"
          - "--token: Explicit Claude OAuth token to use for verification"
        behavior:
          - "Claude: Displays 5-hour window, 7-day window, model-specific windows (Sonnet/Opus/OAuth Apps), and extra usage / overage credit details."
          - "Claude credential discovery preserves explicit and environment token precedence, then supports Claude Code's platform storage (including macOS Keychain and `.credentials.json`) after verifying and refreshing an authenticated session through the Claude CLI. Authenticated credential-acquisition failures are reported separately from missing login, while unauthenticated users are directed to `claude auth login`."
          - "Codex: Displays weekly rate-limit window utilization, remaining percentage, reset timestamp, days until reset, minimum required threshold, and task execution allowance."
          - "Codex requires a CLI with app-server account/rateLimits/read support (verified with 0.154.0). A short-lived stdio process has a 15-second request deadline and is terminated and reaped after each read. Server output and credentials are not logged."
          - "Codex selects the codex bucket from rateLimitsByLimitId when supplied, otherwise the single rateLimits view. It selects the longest primary/secondary window of at least 10080 minutes; window position is not fixed. Missing/invalid durations, reset timestamps, or usage percentages make weekly quota unavailable."
          - "Read-only command that does not require lock acquisition or GitHub authentication."

